esphome:
  name: access-panel
esp32:
  board: esp32dev
  framework:
    type: arduino
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
captive_portal: {}
i2c:
- id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 100kHz
pn532_i2c:
  id: reader
  i2c_id: i2c0
  update_interval: 500ms
  on_tag:
  - homeassistant.tag_scanned: !lambda return x;
wiegand:
- id: keypad
  d0: GPIO32
  d1: GPIO33
output:
- platform: ledc
  id: latch_pwm
  pin: GPIO13
  frequency: 50 Hz
servo:
- id: latch
  output: latch_pwm
  auto_detach_time: 2s
  transition_length: 500ms
number:
- platform: template
  name: Latch Position
  min_value: -100
  max_value: 100
  step: 1
  optimistic: true
  set_action:
    then:
    - servo.write:
        id: latch
        level: !lambda return x / 100.0;
switch:
- platform: gpio
  pin: GPIO26
  name: Door Strike
  id: strike
