esphome:
  name: output-hub
esp32:
  board: esp32dev
  framework:
    type: arduino
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
captive_portal: {}
i2c:
- id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz
pca9685:
  id: pwmhub
  i2c_id: i2c0
  address: 64
  frequency: 1000Hz
output:
- platform: pca9685
  pca9685_id: pwmhub
  id: pwmhub_ch0
  channel: 0
- platform: pca9685
  pca9685_id: pwmhub
  id: pwmhub_ch1
  channel: 1
light:
- platform: monochromatic
  name: Shelf Strip
  output: pwmhub_ch0
- platform: monochromatic
  name: Cabinet Strip
  output: pwmhub_ch1
sn74hc595:
- id: shift1
  data_pin: GPIO25
  clock_pin: GPIO26
  latch_pin: GPIO27
  sr_count: 1
switch:
- platform: gpio
  pin:
    sn74hc595: shift1
    number: 0
  name: Vent Fan
  id: fan_relay
