esphome:
  name: motor-position
esp32:
  board: esp32dev
  framework:
    type: esp-idf
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
output:
- platform: gpio
  pin: GPIO18
  id: bridge_in1
- platform: gpio
  pin: GPIO19
  id: bridge_in2
sensor:
- platform: adc
  pin: GPIO34
  name: Actuator position
  id: feedback
  attenuation: 12db
  update_interval: 100ms
