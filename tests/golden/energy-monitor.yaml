esphome:
  name: energy-monitor
esp32:
  board: esp32dev
  framework:
    type: arduino
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
captive_portal: {}
uart:
- id: pzem_uart
  rx_pin: GPIO16
  tx_pin: GPIO17
  baud_rate: 9600
i2c:
- id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 100kHz
modbus:
  id: pzem_bus
  uart_id: pzem_uart
  send_wait_time: 200ms
sensor:
- platform: pzemac
  modbus_id: pzem_bus
  address: 1
  voltage:
    name: Heater Circuit Voltage
  current:
    name: Heater Circuit Current
  power:
    name: Heater Circuit Power
  energy:
    name: Heater Circuit Energy
  frequency:
    name: Heater Circuit Frequency
  power_factor:
    name: Heater Circuit Power Factor
  update_interval: 10s
- platform: adc
  id: clamp_adc
  pin: GPIO34
  attenuation: 12db
  internal: true
- platform: ct_clamp
  sensor: clamp_adc
  name: Dryer Circuit Current
  sample_duration: 300ms
  update_interval: 30s
  filters:
  - calibrate_linear:
    - 0.0 -> 0.0
    - 0.0125 -> 1.25
- platform: ina219
  i2c_id: i2c0
  address: 64
  shunt_resistance: 0.1 ohm
  max_current: 3.2A
  max_voltage: 26.0V
  current:
    id: dcrail_current
    name: 12V Rail Current
  power:
    id: dcrail_power
    name: 12V Rail Power
  bus_voltage:
    id: dcrail_bus_voltage
    name: 12V Rail Bus Voltage
  update_interval: 30s
