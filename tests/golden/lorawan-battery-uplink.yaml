esphome:
  name: lorawan-battery-uplink
esp32:
  board: ttgo-lora32-v1
  framework:
    type: arduino
  flash_size: 4MB
logger: {}
sensor:
- platform: adc
  pin: GPIO35
  name: Battery
  id: battery
  attenuation: 12db
  update_interval: 30s
  unit_of_measurement: V
  filters:
  - multiply: 2.0
- platform: lorawan
  lorawan_id: lw
  sensor: battery
external_components:
- source: github://moellere/lorawan-for-esphome@3abc55852e90814c28ce0ffa38b918ba5230a5e1
  components:
  - lorawan
lorawan:
  id: lw
  region: US915
  sub_band: 2
  dev_eui: !secret dev_eui
  join_eui: !secret join_eui
  app_key: !secret app_key
  radio:
    chip: sx1276
    cs_pin: GPIO18
    rst_pin: GPIO23
    sck_pin: GPIO5
    miso_pin: GPIO19
    mosi_pin: GPIO27
    dio0_pin: GPIO26
