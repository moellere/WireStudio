esphome:
  name: wled-sensor-strip
esp32:
  board: esp32dev
  framework:
    type: arduino
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
i2c:
- id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 100kHz
one_wire:
- platform: gpio
  pin: GPIO4
  id: wire0
light:
- platform: esp32_rmt_led_strip
  rgb_order: GRB
  pin: GPIO16
  num_leds: 60
  chipset: WS2812
  name: Shelf strip
  id: strip
binary_sensor:
- platform: gpio
  pin: GPIO0
  name: Preset button
  id: preset_btn
sensor:
- platform: bme280_i2c
  address: '0x76'
  i2c_id: i2c0
  temperature:
    id: env_temperature
    name: Room climate Temperature
  humidity:
    id: env_humidity
    name: Room climate Humidity
  pressure:
    id: env_pressure
    name: Room climate Pressure
- platform: dallas_temp
  one_wire_id: wire0
  name: Probe temperature
  update_interval: 60s
