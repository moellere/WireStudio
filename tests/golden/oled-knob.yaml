esphome:
  name: oled-knob
esp32:
  board: esp32dev
  framework:
    type: arduino
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
captive_portal: {}
i2c:
- id: i2c0
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz
display:
- platform: ssd1306_i2c
  model: SH1106 128x64
  address: '0x3C'
  i2c_id: i2c0
  id: disp
sensor:
- platform: rotary_encoder
  pin_a:
    number: GPIO16
    mode: INPUT
  pin_b:
    number: GPIO17
    mode: INPUT
  name: Menu knob
  id: knob
binary_sensor:
- platform: gpio
  pin: GPIO18
  name: Knob press
  id: knobbtn
- platform: gpio
  pin: GPIO19
  name: Button A
  id: btn1
- platform: gpio
  pin: GPIO23
  name: Button B
  id: btn2
