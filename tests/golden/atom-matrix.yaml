esphome:
  name: atom-matrix
esp32:
  board: m5stack-atom
  framework:
    type: arduino
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
captive_portal: {}
light:
- platform: esp32_rmt_led_strip
  rgb_order: GRB
  pin: GPIO27
  num_leds: 25
  chipset: SK6812
  name: LED matrix
  id: matrix
binary_sensor:
- platform: gpio
  pin: GPIO39
  name: Button
  id: btn
