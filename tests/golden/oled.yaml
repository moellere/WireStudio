esphome:
  name: oled
esp8266:
  board: d1_mini
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
i2c:
- id: i2c0
  sda: D2
  scl: D1
  frequency: 100kHz
font:
- file: gfonts://Roboto
  id: ws_show_font
  size: 14
time:
- platform: homeassistant
  id: ws_show_time
display:
- platform: ssd1306_i2c
  model: SSD1306 128x64
  address: '0x3C'
  i2c_id: i2c0
  id: oled1
  reset_pin: D0
  update_interval: 2s
  lambda: |-
    int y = 0;
    it.printf(0, y, id(ws_show_font), "wirestudio");
    y += 16;
    it.strftime(0, y, id(ws_show_font), "Time: %H:%M", id(ws_show_time).now());
    y += 16;
    it.strftime(0, y, id(ws_show_font), "Date: %d.%m.%Y", id(ws_show_time).now());
    y += 16;
sensor:
- platform: uptime
  name: oled System Uptime
- platform: wifi_signal
  name: oled WiFi Signal
  update_interval: 15s
