esphome:
  name: blind-stepper
esp32:
  board: esp32dev
  framework:
    type: arduino
  flash_size: 4MB
logger:
  level: INFO
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
stepper:
- platform: uln2003
  id: stepper1
  pin_a: GPIO16
  pin_b: GPIO17
  pin_c: GPIO18
  pin_d: GPIO19
  max_speed: 250 steps/s
  step_mode: HALF_STEP
  sleep_when_done: true
