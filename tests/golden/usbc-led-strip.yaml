esphome:
  name: usbc-led-strip
esp32:
  board: esp32dev
  framework:
    type: esp-idf
  flash_size: 4MB
logger: {}
api:
  encryption:
    key: !secret api_key
ota:
- platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
light:
- platform: esp32_rmt_led_strip
  rgb_order: GRB
  pin: GPIO18
  num_leds: 30
  chipset: WS2812
  name: Desk strip
  id: strip
