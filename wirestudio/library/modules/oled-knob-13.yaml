id: oled-knob-13
name: 1.3in OLED + EC11 encoder combo module
category: module
description: >-
  Inexpensive combo board: a 1.3-inch SH1106 white OLED on I2C, an EC11
  rotary encoder, and two auxiliary push buttons. One selection drops in
  all five parts, pre-wired and auto-bus-seeded; the BOM lists this
  module rather than its individual parts.
use_cases: [oled, display, encoder, menu_navigation, input, control_panel]
aliases: [oled-encoder, knob-display, ec11-oled]
components:
  - id_hint: disp
    library_id: ssd1306
    label: Panel OLED
    params: {model: "SH1106 128x64", address: "0x3C"}
  - id_hint: knob
    library_id: rotary_encoder
    label: Menu knob
  - id_hint: knobsw
    library_id: gpio_input
    label: Knob press
  - id_hint: btn1
    library_id: gpio_input
    label: Button A
  - id_hint: btn2
    library_id: gpio_input
    label: Button B
# Enclosure geometry (mm): 65 x 35 PCB, M3 holes 59 x 29 apart, from
# the module's STL; heights measured on the module after the first
# wall-panel fit print, where a 6.4 lid gap sank the panel too deep to
# press the knob. Component side: the 1.3in OLED glass (34.75 x 23.25,
# about 3.6 tall), the two tact switches above and below the encoder
# (actuator top 3.7), and the EC11, whose base is the tallest part at
# 4.5 with its shaft 15.15 above that. The lid sits 4.7 above the PCB,
# clear of all of it; the shaft comes through a round hole and the
# knob cap goes on from outside after assembly. The window shows the
# glass less 1 each side.
enclosure:
  mount: lid
  pcb: {length_mm: 65.0, width_mm: 35.0, thickness_mm: 1.5}
  mount_holes:
    - {x_mm: 3.1, y_mm: 3.1, hole_diameter_mm: 3.2}
    - {x_mm: 62.1, y_mm: 3.1, hole_diameter_mm: 3.2}
    - {x_mm: 3.1, y_mm: 32.1, hole_diameter_mm: 3.2}
    - {x_mm: 62.1, y_mm: 32.1, hole_diameter_mm: 3.2}
  lid_gap_mm: 4.7
  height_above_pcb_mm: 19.65
  height_below_pcb_mm: 17.0
  features:
    - {kind: window, x_mm: 21.4, y_mm: 17.6, width_mm: 32.7, height_mm: 21.2}
    - {kind: hole, x_mm: 53.1, y_mm: 17.6, diameter_mm: 9.0}
    - {kind: button, x_mm: 53.1, y_mm: 5.6, diameter_mm: 4.5, top_mm: 3.7}
    - {kind: button, x_mm: 53.1, y_mm: 29.6, diameter_mm: 4.5, top_mm: 3.7}
