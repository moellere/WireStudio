id: oled-knob-13
name: 1.3in OLED + EC11 encoder combo module
category: module
description: >-
  Inexpensive combo board: a 1.3-inch SH1106 white OLED on I2C, an EC11
  rotary encoder, and two auxiliary push buttons. One selection drops in
  all five parts, pre-wired and auto-bus-seeded; the BOM lists this
  module rather than its individual parts.
use_cases: [oled, display, encoder, menu_navigation, input, control_panel]
aliases: [oled-encoder, knob-display, ec11-oled]
components:
  - id_hint: disp
    library_id: ssd1306
    label: Panel OLED
    params: {model: "SH1106 128x64", address: "0x3C"}
  - id_hint: knob
    library_id: rotary_encoder
    label: Menu knob
  - id_hint: knobsw
    library_id: gpio_input
    label: Knob press
  - id_hint: btn1
    library_id: gpio_input
    label: Button A
  - id_hint: btn2
    library_id: gpio_input
    label: Button B
# Enclosure geometry (mm): 65 x 35 PCB, M3 holes 59 x 29 apart, from
# the module's STL; heights measured on the module after the wall-panel
# fit prints. Component side: the 1.3in OLED glass (34.75 x 23.25, about
# 3.6 tall), the two tact switches above and below the encoder (actuator
# top 3.7), and the EC11, whose base is the tallest part at 4.5 (14.25
# across) with its shaft 15.15 above that. A 6.4 lid gap sank the panel
# too deep to press the knob; 4.7, clear of the EC11 base, still left the
# glass recessed and the knob cap too close to the face to click. The
# module's own front case (oled_encoder_case_front_enc_1_3_in.stl) puts
# its face 6.0 above the PCB: posts 4.5 under a 1.5 plate. With this
# lid's 2.0 plane the lid sits 4.0 above the PCB, clear of the switches
# and the glass, and the EC11 base rises 0.5 into a 15.4 hole that the
# knob cap covers; the cap goes on from outside after assembly. The window is the
# display's active area plus a margin, 32.6 x 17.6, centred above the
# glass centre (the ribbon end is blank); a frame drops onto the glass
# and the opening tapers 2.0 each side to the face, after Enoch's
# display-cover-v16.
enclosure:
  mount: lid
  pcb: {length_mm: 65.0, width_mm: 35.0, thickness_mm: 1.5}
  mount_holes:
    - {x_mm: 3.1, y_mm: 3.1, hole_diameter_mm: 3.2}
    - {x_mm: 62.1, y_mm: 3.1, hole_diameter_mm: 3.2}
    - {x_mm: 3.1, y_mm: 32.1, hole_diameter_mm: 3.2}
    - {x_mm: 62.1, y_mm: 32.1, hole_diameter_mm: 3.2}
  lid_gap_mm: 4.0
  height_above_pcb_mm: 19.65
  height_below_pcb_mm: 2.0
  # The 9-pin header along the top edge (CON..VCC); its Dupont housing
  # hangs 7.5 below the PCB, and the leads bend away under it.
  connectors:
    - {x_mm: 22.3, y_mm: 33.1, width_mm: 24.0, height_mm: 3.5, depth_mm: 12.0}
  features:
    - {kind: window, x_mm: 21.25, y_mm: 19.15, width_mm: 32.6, height_mm: 17.6, glass_top_mm: 3.6, taper_mm: 2.0}
    - {kind: hole, x_mm: 53.1, y_mm: 17.6, diameter_mm: 15.4}
    - {kind: button, x_mm: 53.1, y_mm: 5.6, diameter_mm: 4.5, top_mm: 3.7}
    - {kind: button, x_mm: 53.1, y_mm: 29.6, diameter_mm: 4.5, top_mm: 3.7}
