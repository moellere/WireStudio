id: yd-esp32-23
name: YD-ESP32-23 (VCC-GND YD-ESP32-S3 N16R8)
mcu: esp32
chip_variant: esp32s3
framework: arduino
platformio_board: esp32-s3-devkitc-1
# VCC-GND Studio's DevKitC-1 clone, PCB "YD-ESP32-23 2022-V1.3":
# ESP32-S3-WROOM-1 N16R8, two USB-C ports (CH343P UART "COM" and native
# USB), a WS2812 on GPIO48 behind the RGB jumper. Same header pinout as
# the DevKitC-1. https://github.com/rtek1000/YD-ESP32-23
flash_size_mb: 16

rails:
  - {name: "5V",  voltage: 5.0, source: usb}
  - {name: "3V3", voltage: 3.3, source: onboard_regulator}
  - {name: "GND", voltage: 0.0}

# Dual-core Xtensa with native USB. UART0 is broken out on GPIO43 (TX)
# and GPIO44 (RX); native USB lives on GPIO19 (D-) / GPIO20 (D+) and
# also doubles as USB-Serial-JTAG. Strap pins:
#   GPIO0  = boot mode (HIGH normal, LOW download). Tied to BOOT button.
#   GPIO45 = VDD_SPI voltage select. Default LOW = 3.3V.
#   GPIO46 = ROM print. LOW = silent at boot.
# The N16R8 module's 8MB PSRAM is octal, so GPIO35-GPIO37 carry the
# PSRAM bus and are left out of the capabilities below.
# ADC1 covers GPIO1-GPIO10; ADC2 covers GPIO11-GPIO20 and is unusable
# while WiFi is active. Prefer ADC1.
default_buses:
  i2c: {sda: GPIO8, scl: GPIO9}
  spi: {clk: GPIO12, miso: GPIO13, mosi: GPIO11}

onboard_peripherals:
  led_ws2812: {pin: GPIO48}
  boot_button: {pin: GPIO0, inverted: true}

gpio_capabilities:
  GPIO0:  [gpio, strap, boot_high, button]
  GPIO1:  [gpio, adc, adc1, pwm]
  GPIO2:  [gpio, adc, adc1, pwm]
  GPIO3:  [gpio, adc, adc1, pwm]
  GPIO4:  [gpio, adc, adc1, pwm]
  GPIO5:  [gpio, adc, adc1, pwm]
  GPIO6:  [gpio, adc, adc1, pwm]
  GPIO7:  [gpio, adc, adc1, pwm]
  GPIO8:  [gpio, adc, adc1, i2c_sda, pwm]
  GPIO9:  [gpio, adc, adc1, i2c_scl, pwm]
  GPIO10: [gpio, adc, adc1, pwm]
  GPIO11: [gpio, adc, adc2, spi_mosi, pwm]
  GPIO12: [gpio, adc, adc2, spi_clk, pwm]
  GPIO13: [gpio, adc, adc2, spi_miso, pwm]
  GPIO14: [gpio, adc, adc2, pwm]
  GPIO15: [gpio, adc, adc2, pwm]
  GPIO16: [gpio, adc, adc2, pwm]
  GPIO17: [gpio, adc, adc2, pwm]
  GPIO18: [gpio, adc, adc2, pwm]
  GPIO19: [gpio, usb, pwm]
  GPIO20: [gpio, usb, pwm]
  GPIO21: [gpio, pwm]
  GPIO33: [gpio, pwm]
  GPIO34: [gpio, pwm]
  GPIO38: [gpio, pwm]
  GPIO39: [gpio, pwm]
  GPIO40: [gpio, pwm]
  GPIO41: [gpio, pwm]
  GPIO42: [gpio, pwm]
  GPIO43: [gpio, uart_tx, serial_tx]
  GPIO44: [gpio, uart_rx, serial_rx]
  GPIO45: [gpio, strap, boot_low, pwm]
  GPIO46: [gpio, strap, boot_low, pwm]
  GPIO47: [gpio, pwm]
  GPIO48: [gpio, builtin_led, pwm]
# Enclosure geometry (mm), measured off the board photos against the
# 2.54 mm header pitch (no maker drawing): PCB 56.5 x 28.0 plus the
# WROOM-1 antenna overhanging the far end by 5.0, header rows 25.4
# apart. USB end at x=0; both USB-C receptacles (8.94 x 3.26) sit
# symmetric about the centre line, 12.8 apart. The component side tops
# out at the USB-C shells; underneath, header plastic plus a Dupont
# housing is 17.
enclosure:
  pcb:
    length_mm: 61.5
    width_mm: 28.0
    thickness_mm: 1.6
  mount_holes: []
  ports:
  - kind: usb_c                # UART (CH343P)
    edge: short_a
    offset_mm: 3.1
    width_mm: 9.0
    height_mm: 3.3
    height_above_pcb_mm: 1.65
  - kind: usb_c                # native USB
    edge: short_a
    offset_mm: 15.9
    width_mm: 9.0
    height_mm: 3.3
    height_above_pcb_mm: 1.65
  component_height_max_mm: 3.5
  underside_height_mm: 17.0

# KiCad symbol mapping. Header order from Espressif esp-dev-kits @
# 4ffc5bd, docs/en/esp32-s3-devkitc-1/user_guide_v1.1.rst (Header Block
# J1/J3; v1.0 identical). Viewed front, antenna up: J1 left, J3 right,
# pin 1 at the antenna end. Two rows on a Conn_02xNN_Odd_Even: left-row
# position k is pad 2k-1, right-row position k is pad 2k. pin_map binds
# each board role to its first pad; pads with no role (RST, extra rails)
# stay unconnected.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_02x22_Odd_Even
  footprint: Connector_PinHeader_2.54mm:PinHeader_2x22_P2.54mm_Vertical
  value: YD-ESP32-23
  pin_map:
    GPIO0: "28"
    GPIO1: "8"
    GPIO2: "10"
    GPIO3: "25"
    GPIO4: "7"
    GPIO5: "9"
    GPIO6: "11"
    GPIO7: "13"
    GPIO8: "23"
    GPIO9: "29"
    GPIO10: "31"
    GPIO11: "33"
    GPIO12: "35"
    GPIO13: "37"
    GPIO14: "39"
    GPIO15: "15"
    GPIO16: "17"
    GPIO17: "19"
    GPIO18: "21"
    GPIO19: "40"
    GPIO20: "38"
    GPIO21: "36"
    GPIO38: "20"
    GPIO39: "18"
    GPIO40: "16"
    GPIO41: "14"
    GPIO42: "12"
    GPIO43: "4"
    GPIO44: "6"
    GPIO45: "30"
    GPIO46: "27"
    GPIO47: "34"
    GPIO48: "32"
    3V3: "1"
    5V: "41"
    GND: "2"
