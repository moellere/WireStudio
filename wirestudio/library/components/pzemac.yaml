id: pzemac
name: Peacefair PZEM-004T v3 AC energy monitor (Modbus RTU over UART)
category: sensor
use_cases: [power_metering, ac_voltage, ac_current, energy, mains_monitoring]
aliases: ["pzem-004t", "pzem004t", "pzem"]

electrical:
  current_ma_typical: 10
  current_ma_peak: 15
  pins:
    - role: HUB
      kind: hub_ref
      parent_library_id: modbus
  passives: []

esphome:
  required_components: []
  yaml_template: |
    sensor:
      - platform: pzemac
        modbus_id: {{ parent.id }}
        address: {{ params.address | default(1) }}
        voltage:
          name: "{{ label }} Voltage"
        current:
          name: "{{ label }} Current"
        power:
          name: "{{ label }} Power"
        energy:
          name: "{{ label }} Energy"
        frequency:
          name: "{{ label }} Frequency"
        power_factor:
          name: "{{ label }} Power Factor"
        update_interval: {{ params.update_interval | default('10s') }}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}

# ESPHome's pzemac register map: ten input registers from 0, 32-bit
# values low word first: voltage (0.1 V), current (0.001 A), power
# (0.1 W), energy (Wh), frequency (0.1 Hz), power factor (0.01).
circuitpython:
  setup: |
    def {{ id }}_decode(data):
        if not data or len(data) < 20:
            return None
        r = [data[i] << 8 | data[i + 1] for i in range(0, 20, 2)]
        return r[0] / 10, (r[1] | r[2] << 16) / 1000, (r[3] | r[4] << 16) / 10, r[5] | r[6] << 16, r[7] / 10, r[8] / 100
  loop: |
    {{ id }}_reading = {{ id }}_decode({{ parent }}_read({{ params.address | default(1) }}, 0x04, 0, 10))
    if {{ id }}_reading:
        print("{{ label }}: %.1f V %.3f A %.1f W %d Wh %.1f Hz PF %.2f" % {{ id }}_reading)
    else:
        print("{{ label }}: no reply")

micropython:
  setup: |
    def {{ id }}_decode(data):
        if not data or len(data) < 20:
            return None
        r = [data[i] << 8 | data[i + 1] for i in range(0, 20, 2)]
        return r[0] / 10, (r[1] | r[2] << 16) / 1000, (r[3] | r[4] << 16) / 10, r[5] | r[6] << 16, r[7] / 10, r[8] / 100
  loop: |
    {{ id }}_reading = {{ id }}_decode({{ parent }}_read({{ params.address | default(1) }}, 0x04, 0, 10))
    if {{ id }}_reading:
        print("{{ label }}: %.1f V %.3f A %.1f W %d Wh %.1f Hz PF %.2f" % {{ id }}_reading)
    else:
        print("{{ label }}: no reply")

lorawan:
  globals: |
    float {{ id }}Volts = 0, {{ id }}Amps = 0, {{ id }}Hz = 0, {{ id }}Pf = 0;
    uint32_t {{ id }}DeciWatts = 0, {{ id }}Wh = 0;
  loop: |
    {%- if parent %}
    {
      static unsigned long _last = 0;
      if (_last == 0 || millis() - _last >= 10000) {
        _last = millis();
        uint8_t _d[20];
        if ({{ parent }}Read({{ params.address | default(1) }}, 0x04, 0, 10, _d)) {
          uint16_t _r[10];
          for (int _i = 0; _i < 10; _i++) _r[_i] = _d[2 * _i] << 8 | _d[2 * _i + 1];
          {{ id }}Volts = _r[0] / 10.0;
          {{ id }}Amps = (_r[1] | (uint32_t)_r[2] << 16) / 1000.0;
          {{ id }}DeciWatts = _r[3] | (uint32_t)_r[4] << 16;
          {{ id }}Wh = _r[5] | (uint32_t)_r[6] << 16;
          {{ id }}Hz = _r[7] / 10.0;
          {{ id }}Pf = _r[8] / 100.0;
        }
      }
    }
    {%- endif %}
  fields:
    - name: "{{ id }}_voltage"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "(uint16_t)({{ id }}Volts * 10.0 + 0.5)"
      scale: 10.0
      ha_device_class: voltage
      ha_unit: "V"
      ha_state_class: measurement
    - name: "{{ id }}_current"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "(uint16_t)({{ id }}Amps * 100.0 + 0.5)"
      scale: 100.0
      ha_device_class: current
      ha_unit: "A"
      ha_state_class: measurement
    - name: "{{ id }}_power"
      bytes: 4
      cpp_type: uint32_t
      cpp_expr: "{{ id }}DeciWatts"
      scale: 10.0
      ha_device_class: power
      ha_unit: "W"
      ha_state_class: measurement
    - name: "{{ id }}_energy"
      bytes: 4
      cpp_type: uint32_t
      cpp_expr: "{{ id }}Wh"
      ha_device_class: energy
      ha_unit: "Wh"
      ha_state_class: total_increasing
    - name: "{{ id }}_frequency"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "(uint16_t)({{ id }}Hz * 10.0 + 0.5)"
      scale: 10.0
      ha_device_class: frequency
      ha_unit: "Hz"
      ha_state_class: measurement
    - name: "{{ id }}_power_factor"
      bytes: 1
      cpp_type: uint8_t
      cpp_expr: "(uint8_t)({{ id }}Pf * 100.0 + 0.5)"
      scale: 100.0
      ha_device_class: power_factor
      ha_state_class: measurement
params_schema:
  address:
    type: number
    default: 1
    description: "Modbus slave address. Factory units answer address 1 (and the 0xF8 broadcast); re-address via ESPHome's pzemac.reset_energy/set_address services when stacking meters."
  update_interval:
    type: string
    default: "10s"

notes: |
  The de-facto DIY mains monitor: clamp CT or shunt on the AC side,
  optocoupled 5V TTL UART on ours. Interface side draws ~10mA from 5V;
  the measurement side connects to live mains -- enclose it, fuse the
  voltage tap, and keep the CT low-voltage side separated. UART runs
  9600 baud through ESPHome's modbus hub (uart -> modbus -> pzemac).
  Note the TTL header wants 5V VCC but its RX needs only 3.3V-safe
  drive -- it works directly off ESP32/ESP8266 pins.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: PZEM-004T
# PZEM-004T v3 speaks Modbus: the PZEM-016 receive function.
tasmota:
  bus: {tx: PZEM0XX_TX, rx: PZEM016_RX}
