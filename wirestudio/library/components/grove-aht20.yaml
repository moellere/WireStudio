# STATUS: spec tier (unverified) -- pre-filled by the WireStudio project
# from Seeed's published product page, pending Seeed review per
# docs/integration_spec.md. Items needing vendor confirmation are
# marked VENDOR REVIEW below.
id: grove-aht20
name: Seeed Grove AHT20 temperature + humidity (I2C)
category: sensor
use_cases: [temperature, humidity, weather, climate]
aliases: ["grove aht20", "grove temperature humidity", "aht20 grove"]

# Grove-packaged Aosong AHT20 on the standard Grove I2C connector
# (HY2.0 4-pin: 1=SCL, 2=SDA, 3=VCC, 4=GND). The Grove module carries
# its own I2C pull-ups and decoupling, so unlike the bare AHT20
# breakout no external passives are required -- this is exactly the
# kind of fact the Grove packaging standardizes and why the catalog
# converts cleanly.
#
# --- VENDOR REVIEW REQUESTED ---
# 1. Supply range: entered as 3.1-5.5V per the Grove AHT20 product
#    page. Please confirm the low end (the bare AHT20 IC allows 2.0V
#    but the Grove module's level circuitry may not).
# 2. Pull-ups: confirmed fitted on-module? (Assumed yes, so the pins
#    below omit the pull_up requirement and the solver will not ask
#    the user to add resistors.)
electrical:
  vcc_min: 3.1
  vcc_max: 5.5
  current_ma_typical: 0.25
  current_ma_peak: 0.98
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: SDA, kind: i2c_sda}
    - {role: SCL, kind: i2c_scl}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: aht10
        i2c_id: {{ bus.id }}
        variant: AHT20
        update_interval: {{ params.update_interval | default('60s') }}
        temperature:
          name: "{{ label }} Temperature"
    {%- if params.temperature_on_value is defined %}
          on_value: {{ params.temperature_on_value | tojson }}
    {%- endif %}
    {%- if params.temperature_on_value_range is defined %}
          on_value_range: {{ params.temperature_on_value_range | tojson }}
    {%- endif %}
        humidity:
          name: "{{ label }} Humidity"
    {%- if params.humidity_on_value is defined %}
          on_value: {{ params.humidity_on_value | tojson }}
    {%- endif %}
    {%- if params.humidity_on_value_range is defined %}
          on_value_range: {{ params.humidity_on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value, channel: temperature}
    - {event: on_value_range, kind: event, channel: temperature}
    - {event: on_value, kind: value, channel: humidity}
    - {event: on_value_range, kind: event, channel: humidity}

circuitpython:
  imports: ["import adafruit_ahtx0"]
  deps: [adafruit_ahtx0, adafruit_bus_device]
  setup: |
    {{ id }} = adafruit_ahtx0.AHTx0({{ bus_var }})
  loop: |
    print("{{ label }}: %.1fC %.0f%%" % ({{ id }}.temperature, {{ id }}.relative_humidity))

params_schema:
  update_interval:
    type: string
    default: "60s"

notes: |
  Grove packaging of the Aosong AHT20 (fixed I2C address 0x38).
  Driven by ESPHome's `aht10` platform with `variant: AHT20`. Because
  pull-ups and decoupling live on the Grove module, the wiring diagram
  is four wires and nothing else -- the Grove connector's whole value
  proposition, encoded.

# Grove HY2.0-4P connector, modelled as a 2.0mm 4-pin header. Pin
# order per the Grove I2C standard.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.00mm:PinHeader_1x04_P2.00mm_Vertical
  value: Grove AHT20
  pin_map:
    SCL: Pin_1
    SDA: Pin_2
    VCC: Pin_3
    GND: Pin_4
