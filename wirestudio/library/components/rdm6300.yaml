id: rdm6300
name: RDM6300 125kHz EM4100 RFID reader
category: rfid_reader
use_cases: [rfid, access_control, tag_scanner, low_frequency]
aliases: [em4100_reader, rdm630]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 50
  current_ma_peak: 70
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: TX,  kind: uart_tx, voltage: 5.0}
    # Only the module's TX is wired to the MCU's UART RX -- the reader
    # is one-way (it streams tag IDs, takes no commands). VCC must be
    # 5V; the TX line is 5V logic but is open-drain enough on most
    # clones that 3V3 ESP boards read it reliably.
  passives:
    - {kind: capacitor, value: "10uF", between: [VCC, GND], purpose: bulk decoupling}

esphome:
  required_components: [uart]
  yaml_template: |
    rdm6300:
      uart_id: {{ bus.id }}
    {%- if params.on_tag is defined %}
      on_tag: {{ params.on_tag | tojson }}
    {%- endif %}

capability:
  # 125kHz EM-style RFID reader. Only on_tag; no removal event in the platform.
  role: input
  provides:
    - {event: on_tag}

# Module frame: 0x02, ten ASCII hex digits (version byte and the 4-byte
# tag id), two ASCII hex digits XOR-ing the five data bytes, 0x03.
circuitpython:
  setup: |
    def {{ id }}_decode(buf):
        found = None
        for i in range(len(buf) - 13):
            if buf[i] != 0x02 or buf[i + 13] != 0x03:
                continue
            try:
                text = bytes(buf[i + 1:i + 13]).decode()
                data = [int(text[k:k + 2], 16) for k in range(0, 12, 2)]
            except (UnicodeError, ValueError):
                continue
            if data[0] ^ data[1] ^ data[2] ^ data[3] ^ data[4] == data[5]:
                found = int(text[2:10], 16)
        return found
    def {{ id }}_listen(seconds):
        {{ bus_var }}.reset_input_buffer()
        buf = b""
        until = time.monotonic() + seconds
        while time.monotonic() < until:
            n = {{ bus_var }}.in_waiting
            if n:
                buf += {{ bus_var }}.read(n)
        return buf
  loop: |
    {{ id }}_tag = {{ id }}_decode({{ id }}_listen(1.0))
    if {{ id }}_tag is not None:
        print("{{ label }}: tag %d" % {{ id }}_tag)

micropython:
  setup: |
    def {{ id }}_decode(buf):
        found = None
        for i in range(len(buf) - 13):
            if buf[i] != 0x02 or buf[i + 13] != 0x03:
                continue
            try:
                text = bytes(buf[i + 1:i + 13]).decode()
                data = [int(text[k:k + 2], 16) for k in range(0, 12, 2)]
            except (UnicodeError, ValueError):
                continue
            if data[0] ^ data[1] ^ data[2] ^ data[3] ^ data[4] == data[5]:
                found = int(text[2:10], 16)
        return found
    def {{ id }}_listen(seconds):
        {{ bus_var }}.read()
        buf = b""
        until = time.ticks_add(time.ticks_ms(), int(seconds * 1000))
        while time.ticks_diff(until, time.ticks_ms()) > 0:
            buf += {{ bus_var }}.read() or b""
            time.sleep_ms(20)
        return buf
  loop: |
    {{ id }}_tag = {{ id }}_decode({{ id }}_listen(1.0))
    if {{ id }}_tag is not None:
        print("{{ label }}: tag %d" % {{ id }}_tag)

params_schema:
  on_tag:
    type: array
    description: "ESPHome action list to run when a tag is read; receives `x` as the decimal tag ID."

notes: "UART at 9600 baud, 8N1. ESPHome's `rdm6300:` is a singleton and emits an event per scan; wire the module's TX to the bus RX and leave the bus TX unbound. Antenna sensitivity is a few cm -- tags need to be within ~3cm of the coil. For longer range or HF tags use the rc522 (MFRC522) component instead."
# KiCad symbol mapping (0.9). 125 kHz RFID reader; 6-pin breakout
# (VCC, GND, TX, RX, ANT1, ANT2).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x06
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical
  value: RDM6300
