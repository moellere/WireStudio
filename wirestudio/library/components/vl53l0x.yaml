id: vl53l0x
name: STMicro VL53L0X laser ToF distance sensor (I2C)
category: sensor
use_cases: [distance, range, proximity, presence, fill_level]
aliases: ["vl53l1x", "tof", "lidar", "laser_distance"]

electrical:
  vcc_min: 2.6
  vcc_max: 3.5
  current_ma_typical: 19
  current_ma_peak: 40
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - role: SDA
      kind: i2c_sda
      pull_up: {required: true, value: "4.7k", to: VCC}
    - role: SCL
      kind: i2c_scl
      pull_up: {required: true, value: "4.7k", to: VCC}
    - {role: XSHUT, kind: digital_in, voltage: 3.3}
    - {role: GPIO1, kind: digital_out, voltage: 3.3}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: vl53l0x
        id: {{ id }}
        i2c_id: {{ bus.id }}
        address: "{{ params.address | default('0x29') }}"
        name: "{{ label }} Distance"
        update_interval: {{ params.update_interval | default('60s') }}
        long_range: {{ params.long_range | default(false) | string | lower }}
        timeout: {{ params.timeout | default('200ms') }}
    {%- if params.on_value is defined %}
        on_value: {{ params.on_value | tojson }}
    {%- endif %}
    {%- if params.on_value_range is defined %}
        on_value_range: {{ params.on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}
    - {event: on_value_range, kind: event}

circuitpython:
  imports: ["import adafruit_vl53l0x"]
  deps: [adafruit_vl53l0x, adafruit_bus_device]
  setup: |
    {{ id }} = adafruit_vl53l0x.VL53L0X({{ bus_var }})
  loop: |
    print("{{ label }}: %d mm" % {{ id }}.range)

micropython:
  imports: ["from vl53l0x import VL53L0X"]
  deps: ["github:kevinmcaleer/vl53l0x/vl53l0x.py"]
  setup: |
    {{ id }} = VL53L0X({{ bus_var }})
  loop: |
    print("{{ label }}: %d mm" % {{ id }}.read())

params_schema:
  address:
    type: string
    enum: ["0x29"]
    default: "0x29"
    description: "Default address; multiple VL53L0X on one bus require XSHUT-driven re-addressing -- not modelled here."
  update_interval:
    type: string
    default: "60s"
  long_range:
    type: boolean
    default: false
    description: "Enable long-range mode (up to ~2m); reduces accuracy at short distance."
  timeout:
    type: string
    default: "200ms"

notes: |
  Laser time-of-flight ranger -- 30mm to ~1.2m (2m in long-range mode).
  Strictly better than HC-SR04 for indoor use: tighter beam, no
  acoustic-reflection issues, no >5V signal. Default I2C address 0x29
  is fixed; multi-sensor setups require sequential power-on via XSHUT
  (not modelled in this template).
# KiCad symbol mapping (VL53L0X module pinout).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x06
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical
  value: VL53L0X
  pin_map:
    VCC: Pin_1
    GND: Pin_2
    SCL: Pin_3
    SDA: Pin_4
    XSHUT: Pin_5
    GPIO1: Pin_6

lorawan:
  lib_deps: ["pololu/VL53L0X@^1.3.1"]
  requires: [i2c]
  globals: |
    #include <VL53L0X.h>
    VL53L0X vl53l0x;
    bool vl53l0xOk = false;
    uint16_t vl53l0xMm = 0;
  setup: |
    vl53l0x.setBus(&Wire);
    vl53l0x.setTimeout(500);
    vl53l0xOk = vl53l0x.init();
    if (vl53l0xOk) vl53l0x.startContinuous();
  loop: |
    if (vl53l0xOk) {
      uint16_t _mm = vl53l0x.readRangeContinuousMillimeters();
      if (!vl53l0x.timeoutOccurred()) vl53l0xMm = _mm;
    }
  fields:
    - name: vl53l0x_mm
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(vl53l0xMm)
      ha_device_class: distance
      ha_unit: "mm"
      ha_state_class: measurement

# WLED's VL53L0X usermod is a gesture control (a hand over the sensor
# toggles and dims the light), not a range readout.
wled:
  kind: usermod
  usermod: VL53L0X_gestures
  define: USERMOD_VL53L0X_GESTURES
  lib_deps: ["pololu/VL53L0X@^1.3.0"]
