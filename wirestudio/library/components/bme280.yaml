id: bme280
name: Bosch BME280 (T/H/P)
category: sensor
use_cases: [temperature, humidity, pressure, weather]
aliases: [bmp280, bme680]

electrical:
  vcc_min: 1.8
  vcc_max: 3.6
  current_ma_typical: 0.6
  current_ma_peak: 4
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: bme280_i2c
        address: "{{ params.address | default('0x76') }}"
        i2c_id: {{ bus.id }}
        temperature:
          id: {{ id }}_temperature
          name: "{{ label }} Temperature"
    {%- if params.temperature_on_value is defined %}
          on_value: {{ params.temperature_on_value | tojson }}
    {%- endif %}
    {%- if params.temperature_on_value_range is defined %}
          on_value_range: {{ params.temperature_on_value_range | tojson }}
    {%- endif %}
        humidity:
          id: {{ id }}_humidity
          name: "{{ label }} Humidity"
    {%- if params.humidity_on_value is defined %}
          on_value: {{ params.humidity_on_value | tojson }}
    {%- endif %}
    {%- if params.humidity_on_value_range is defined %}
          on_value_range: {{ params.humidity_on_value_range | tojson }}
    {%- endif %}
        pressure:
          id: {{ id }}_pressure
          name: "{{ label }} Pressure"
    {%- if params.pressure_on_value is defined %}
          on_value: {{ params.pressure_on_value | tojson }}
    {%- endif %}
    {%- if params.pressure_on_value_range is defined %}
          on_value_range: {{ params.pressure_on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value, channel: temperature}
    - {event: on_value_range, kind: event, channel: temperature}
    - {event: on_value, kind: value, channel: humidity}
    - {event: on_value_range, kind: event, channel: humidity}
    - {event: on_value, kind: value, channel: pressure}
    - {event: on_value_range, kind: event, channel: pressure}

circuitpython:
  imports: ["from adafruit_bme280 import basic as adafruit_bme280"]
  deps: [adafruit_bme280, adafruit_bus_device, adafruit_register]
  setup: |
    {{ id }} = adafruit_bme280.Adafruit_BME280_I2C({{ bus_var }}, address={{ params.address | default('0x76') }})
  loop: |
    print("{{ label }}: %.1fC %.0f%% %.1fhPa" % ({{ id }}.temperature, {{ id }}.relative_humidity, {{ id }}.pressure))

micropython:
  imports: ["import bme280_float as bme280"]
  deps: ["github:robert-hh/BME280/bme280_float.py"]
  setup: |
    {{ id }} = bme280.BME280(i2c={{ bus_var }}, address={{ params.address | default('0x76') }})
  loop: |
    print("{{ label }}:", *{{ id }}.values)

params_schema:
  address:
    type: string
    enum: ["0x76", "0x77"]
    default: "0x76"

notes: "3V3 only. On 5V boards, place behind level shifter or use 3V3 rail."
# KiCad symbol mapping (0.9 schematic export).
kicad:
  symbol_lib: Sensor
  symbol: BME280
  footprint: Package_LGA:Bosch_LGA-8_2.5x2.5mm_P0.65mm_ClockwisePinNumbering
  pin_map:
    VCC: VDD
    SDA: SDI
    SCL: SCK

wled:
  kind: usermod
  usermod: BME280_v2
  define: USERMOD_BME280
  lib_deps: ["BME280@~3.0.0"]
  um_name: BME280/BMP280
  um: {enabled: true}
  um_params: {I2CAddress: address}

lorawan:
  lib_deps: ["adafruit/Adafruit BME280 Library@^2.2.4"]
  requires: [i2c]
  globals: |
    #include <Adafruit_BME280.h>
    Adafruit_BME280 bme280;
    bool bme280Ok = false;
    float bme280TempC = 0, bme280Hum = 0, bme280HPa = 0;
  setup: |
    bme280Ok = bme280.begin({{ params.address | default('0x76') }}, &Wire);
  loop: |
    if (bme280Ok) {
      bme280TempC = bme280.readTemperature();
      bme280Hum = bme280.readHumidity();
      bme280HPa = bme280.readPressure() / 100.0F;
    }
  fields:
    - name: bme280_temp_c
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(bme280TempC * 100.0)
      signed: true
      scale: 100.0
      ha_device_class: temperature
      ha_unit: "°C"
      ha_state_class: measurement
    - name: bme280_humidity
      bytes: 1
      cpp_type: uint8_t
      cpp_expr: (uint8_t)(bme280Hum + 0.5)
      ha_device_class: humidity
      ha_unit: "%"
      ha_state_class: measurement
    - name: bme280_pressure
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(bme280HPa * 10.0)
      scale: 10.0
      ha_device_class: atmospheric_pressure
      ha_unit: hPa
      ha_state_class: measurement
