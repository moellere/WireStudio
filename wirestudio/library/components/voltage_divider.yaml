id: voltage_divider
name: Voltage divider sense input (battery, supply monitor)
category: sensor
use_cases: [battery_voltage, supply_monitor, voltage_sense, high_voltage_adc]
aliases: [battery_monitor, vsense, resistor_divider]

electrical:
  vcc_min: 0.0
  vcc_max: 0.0
  current_ma_typical: 0
  current_ma_peak: 0
  # The divider scales the sensed voltage down to the ADC's range and C1
  # gives the ESP32's sample-and-hold a low-impedance source. Full scale
  # at the pin is the attenuation's ceiling (about 3.1 V at 12 dB), so the
  # highest voltage the input can read is that times (r_top + r_bottom) /
  # r_bottom: 14.6 V with the defaults.
  pins:
  - {role: IN, kind: analog_in, voltage: 3.3}
  - {role: GND, kind: ground}
  passives: []

esphome:
  required_components: []
  yaml_template: |
    sensor:
      - platform: adc
        pin: {{ pins.IN | tojson }}
        name: "{{ label }}"
        id: {{ id }}
        unit_of_measurement: "V"
        accuracy_decimals: 2
        update_interval: {{ params.update_interval | default('10s') }}
    {%- if board and board.chip_variant.startswith('esp32') %}
        attenuation: {{ params.attenuation | default('12db') }}
    {%- endif %}
        filters:
          - multiply: {{ ((params.r_top + params.r_bottom) / params.r_bottom) | round(4) }}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}
    - {event: on_value_range, kind: event}

circuitpython:
  imports: ["import analogio"]
  setup: |
    {{ id }} = analogio.AnalogIn(P({{ pins.IN }}))
  loop: |
    print("{{ label }}: %.2fV" % ({{ id }}.value / 65535 * {{ id }}.reference_voltage * {{ ((params.r_top | default(100000)) + (params.r_bottom | default(27000))) / (params.r_bottom | default(27000)) }}))

micropython:
  imports: ["from machine import ADC"]
  setup: |
    {{ id }} = ADC(Pin({{ pins.IN }}), atten=ADC.{{ {'0db': 'ATTN_0DB', '2.5db': 'ATTN_2_5DB', '6db': 'ATTN_6DB'}.get(params.attenuation | default('12db'), 'ATTN_11DB') }})
  loop: |
    print("{{ label }}: %.2fV" % ({{ id }}.read_uv() / 1000000 * {{ ((params.r_top | default(100000)) + (params.r_bottom | default(27000))) / (params.r_bottom | default(27000)) }}))

params_schema:
  sense_v:
    type: number
    default: 12
  r_top:
    type: number
    default: 100000
  r_bottom:
    type: number
    default: 27000
  attenuation:
    type: string
    enum: [0db, 2.5db, 6db, 12db]
    default: 12db
  update_interval:
    type: string
    default: "10s"

verify:
  # sense_v is the highest voltage the instance will see; 3.1 V is the
  # ESP32 ADC ceiling at 12 dB attenuation.
  checks:
  - {kind: divider, r_top: r_top, r_bottom: r_bottom, sense: sense_v, max_pin_v: 3.1}
notes: "r_top and r_bottom are in ohms and set both the BOM values and the multiply filter, so the
  sensor reports the sensed voltage directly. Keep the pair around 100k so a battery is not drained
  through it. On an ESP8266 the pin is A0 and reads 0-1 V through the board's own divider; size the
  ratio for that. J1 takes the sensed voltage and its ground."
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x02
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
  value: V sense
subcircuit:
  parts:
  - id: r_top
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "{{ params.r_top }}"}
    pins: {"1": vsense, "2": IN}
  - id: r_bottom
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "{{ params.r_bottom }}"}
    pins: {"1": IN, "2": GND}
  - id: c_filter
    ref_prefix: C
    kicad: {symbol_lib: Device, symbol: C, footprint: "Capacitor_THT:C_Disc_D5.0mm_W2.5mm_P5.00mm", value: 100nF}
    pins: {"1": IN, "2": GND}
  - id: j_sense
    ref_prefix: J
    kicad: {symbol_lib: Connector_Generic, symbol: Conn_01x02, footprint: "TerminalBlock_Phoenix:TerminalBlock_Phoenix_MKDS-1,5-2_1x02_P5.00mm_Horizontal", value: V sense}
    pins: {"1": vsense, "2": GND}
# The divider ratio has no template field; scale with AdcParam.
  # The sensed voltage in on the connector, the divider down to GND with the filter
  # capacitor across the bottom resistor, its midpoint out as IN.
  # Grid units (1.27 mm), x right, y down.
  schematic:
    parts:
      j_sense:  {at: [2, 7], mirror: y}
      r_top:    {at: [10, 5]}
      r_bottom: {at: [10, 15]}
      c_filter: {at: [14, 13]}
    wires:
      - [[6, 7], [8, 7], [8, 2], [10, 2]]        # vsense
      - [[10, 8], [10, 10], [10, 12]]            # the divider's midpoint
      - [[10, 10], [14, 10], [18, 10]]           # IN
      - [[6, 9], [7, 9], [7, 20]]                # connector GND
      - [[7, 20], [10, 20], [12, 20], [14, 20]]  # GND
      - [[10, 18], [10, 20]]
      - [[14, 16], [14, 20]]
    nodes:
      IN: [{at: [18, 10]}]
      GND: [{at: [12, 20], kind: power}]
      vsense: [{at: [8, 2], rot: 90}]

tasmota:
  pins: {IN: ADC_Input}

lorawan:
  globals: |
    uint16_t voltageDividerMv = 0;
  loop: |
    voltageDividerMv = (uint16_t)(analogReadMilliVolts({{ pins.IN }}) * {{ ((params.r_top | default(100000)) + (params.r_bottom | default(27000))) / (params.r_bottom | default(27000)) }});
  fields:
    - name: voltage_divider_mv
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: voltageDividerMv
      ha_device_class: voltage
      ha_unit: V
      ha_state_class: measurement
      ha_divide: 1000

# WLED's one analog voltage reader is the Battery usermod; the divider
# ratio is set in its settings page, not from r_top / r_bottom.
wled:
  kind: usermod
  usermod: Battery
  define: USERMOD_BATTERY
  pins: [IN]
  pin_defines: {IN: USERMOD_BATTERY_MEASUREMENT_PIN}
  um_name: Battery
  um: {interval: 30000}
  um_pins: {IN: pin}
