id: tm1638
name: TM1638 8-digit 7-segment + 8 LEDs + 8 buttons
category: display
use_cases: [seven_segment, status, button_input, led_output]
aliases: [tm1638plus, led_and_key]

electrical:
  vcc_min: 3.0
  vcc_max: 5.5
  current_ma_typical: 30
  current_ma_peak: 80
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: STB, kind: digital_out, voltage: 3.3}
    - {role: CLK, kind: digital_out, voltage: 3.3}
    - {role: DIO, kind: digital_out, voltage: 3.3}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: []
  yaml_template: |
    display:
      platform: tm1638
      id: {{ id }}
      stb_pin: {{ pins.STB | tojson }}
      clk_pin: {{ pins.CLK | tojson }}
      dio_pin: {{ pins.DIO | tojson }}
    {%- if params.intensity is defined %}
      intensity: {{ params.intensity }}
    {%- endif %}
    {%- if params.update_interval is defined %}
      update_interval: {{ params.update_interval }}
    {%- endif %}
    {%- if params.lambda_ is defined %}
      lambda: {{ params.lambda_ | tojson }}
    {%- endif %}

# Datasheet protocol: STB low frames a command, bits go LSB first and
# latch on CLK rising. 0x40 writes with auto-increment, 0xC0 addresses
# the first of 16 bytes (segments at even addresses, LEDs at odd), and
# 0x88 | brightness turns the display on.
circuitpython:
  imports: ["import digitalio"]
  setup: |
    {{ id }}_pins = [digitalio.DigitalInOut(P(n)) for n in ({{ pins.STB }}, {{ pins.CLK }}, {{ pins.DIO }})]
    for {{ id }}_pin in {{ id }}_pins:
        {{ id }}_pin.switch_to_output(value=True)
    def {{ id }}_stb(v):
        {{ id }}_pins[0].value = bool(v)
    def {{ id }}_clk(v):
        {{ id }}_pins[1].value = bool(v)
    def {{ id }}_dio(v):
        {{ id }}_pins[2].value = bool(v)
    {{ id }}_font = {"0": 0x3F, "1": 0x06, "2": 0x5B, "3": 0x4F, "4": 0x66, "5": 0x6D, "6": 0x7D, "7": 0x07, "8": 0x7F, "9": 0x6F, "-": 0x40, " ": 0x00}
    def {{ id }}_send(*data):
        {{ id }}_stb(0)
        for b in data:
            for i in range(8):
                {{ id }}_clk(0)
                {{ id }}_dio(b >> i & 1)
                {{ id }}_clk(1)
        {{ id }}_stb(1)
    def {{ id }}_show(text):
        {{ id }}_send(0x40)
        {{ id }}_send(0xC0, *[x for c in text[:8] for x in ({{ id }}_font.get(c, 0), 0)])
        {{ id }}_send(0x88 | {{ [params.intensity | default(5), 7] | min }})
    {{ id }}_show("--------")

micropython:
  setup: |
    {{ id }}_stb = Pin({{ pins.STB }}, Pin.OUT, value=1)
    {{ id }}_clk = Pin({{ pins.CLK }}, Pin.OUT, value=1)
    {{ id }}_dio = Pin({{ pins.DIO }}, Pin.OUT, value=1)
    {{ id }}_font = {"0": 0x3F, "1": 0x06, "2": 0x5B, "3": 0x4F, "4": 0x66, "5": 0x6D, "6": 0x7D, "7": 0x07, "8": 0x7F, "9": 0x6F, "-": 0x40, " ": 0x00}
    def {{ id }}_send(*data):
        {{ id }}_stb(0)
        for b in data:
            for i in range(8):
                {{ id }}_clk(0)
                {{ id }}_dio(b >> i & 1)
                {{ id }}_clk(1)
        {{ id }}_stb(1)
    def {{ id }}_show(text):
        {{ id }}_send(0x40)
        {{ id }}_send(0xC0, *[x for c in text[:8] for x in ({{ id }}_font.get(c, 0), 0)])
        {{ id }}_send(0x88 | {{ [params.intensity | default(5), 7] | min }})
    {{ id }}_show("--------")

params_schema:
  intensity:
    type: integer
    minimum: 0
    maximum: 7
    default: 5
  update_interval:
    type: string
    default: "1s"

notes: "All-in-one module: 8 7-segment digits, 8 red LEDs, 8 momentary buttons. Buttons surface as a `binary_sensor: tm1638` (`key: 0..7`) and the LEDs as `switch: tm1638` (`led: 0..7`); the library template only emits the display block. The bus is bit-banged and not 5V-tolerant, so always run the module from 3V3 if your MCU is 3V3 -- many clones tolerate it."
# KiCad symbol mapping (0.9). Generic 5-pin header captures the
# TM1638 LED + key-scan module (VCC, GND, STB, CLK, DIO).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x05
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical
  value: TM1638
