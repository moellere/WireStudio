id: rf_bridge
name: Sonoff RF Bridge 433MHz EFM8 module
category: radio
use_cases: [rf_433, doorbell, motion_relay, garage_door]
aliases: [efm8bb1, portisch]

electrical:
  vcc_min: 3.0
  vcc_max: 3.6
  current_ma_typical: 8
  current_ma_peak: 30
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: TX,  kind: uart_tx, voltage: 3.3}
    - {role: RX,  kind: uart_rx, voltage: 3.3}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [uart]
  yaml_template: |
    rf_bridge:
      uart_id: {{ bus.id }}
      id: {{ id }}
    {%- if params.on_code_received is defined %}
      on_code_received: {{ params.on_code_received | tojson }}
    {%- endif %}

capability:
  # Sonoff RF Bridge: on_code_received fires for each 433MHz code seen.
  # Lowering surfaces the code via ESPHome's `data` substitution; the simple
  # event -> action lowering wires it into a switch/light action by id.
  role: input
  provides:
    - {event: on_code_received}

# EFM8 bridge protocol, as ESPHome's rf_bridge reads it: AA A4 (or A3 when
# learned), sync, low and high timings (2 bytes each), the 3-byte code,
# 55. Each code is acknowledged with AA A0 55.
circuitpython:
  setup: |
    def {{ id }}_listen(seconds):
        {{ bus_var }}.reset_input_buffer()
        buf = b""
        until = time.monotonic() + seconds
        while time.monotonic() < until:
            n = {{ bus_var }}.in_waiting
            if n:
                buf += {{ bus_var }}.read(n)
        return buf
    def {{ id }}_decode(buf):
        codes = []
        i = buf.find(b"\xaa")
        while 0 <= i and i + 12 <= len(buf):
            if buf[i + 1] in (0xA3, 0xA4) and buf[i + 11] == 0x55:
                r = buf[i + 2:i + 11]
                codes.append((r[0] << 8 | r[1], r[2] << 8 | r[3], r[4] << 8 | r[5], r[6] << 16 | r[7] << 8 | r[8]))
                i = buf.find(b"\xaa", i + 12)
            else:
                i = buf.find(b"\xaa", i + 1)
        return codes
  loop: |
    for {{ id }}_code in {{ id }}_decode({{ id }}_listen(1.0)):
        print("{{ label }}: sync %04X low %04X high %04X code %06X" % {{ id }}_code)
        {{ bus_var }}.write(b"\xaa\xa0\x55")

micropython:
  setup: |
    def {{ id }}_listen(seconds):
        {{ bus_var }}.read()
        buf = b""
        until = time.ticks_add(time.ticks_ms(), int(seconds * 1000))
        while time.ticks_diff(until, time.ticks_ms()) > 0:
            buf += {{ bus_var }}.read() or b""
            time.sleep_ms(20)
        return buf
    def {{ id }}_decode(buf):
        codes = []
        i = buf.find(b"\xaa")
        while 0 <= i and i + 12 <= len(buf):
            if buf[i + 1] in (0xA3, 0xA4) and buf[i + 11] == 0x55:
                r = buf[i + 2:i + 11]
                codes.append((r[0] << 8 | r[1], r[2] << 8 | r[3], r[4] << 8 | r[5], r[6] << 16 | r[7] << 8 | r[8]))
                i = buf.find(b"\xaa", i + 12)
            else:
                i = buf.find(b"\xaa", i + 1)
        return codes
  loop: |
    for {{ id }}_code in {{ id }}_decode({{ id }}_listen(1.0)):
        print("{{ label }}: sync %04X low %04X high %04X code %06X" % {{ id }}_code)
        {{ bus_var }}.write(b"\xaa\xa0\x55")

params_schema:
  on_code_received:
    type: array
    description: "Action list run when an RF code is received; receives `data` with `sync`, `low`, `high`, `code` fields."

notes: "Inside the Sonoff RF Bridge, an EFM8BB1 microcontroller decodes 433MHz signals and ships them to the host ESP8266 over a 19200-baud UART (TX = GPIO1, RX = GPIO3 -- the same pins used by the USB serial console, so set `logger: baud_rate: 0` on stock hardware). ESPHome's `rf_bridge:` block is a singleton. Send codes via `rf_bridge.send_code`; learn new codes via `rf_bridge.learn`."
# KiCad symbol mapping (0.9). 433 MHz RF bridge module (Sonoff RF
# Bridge etc.); 4-pin header.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: RF bridge
