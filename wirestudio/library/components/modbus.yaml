id: modbus
name: Modbus RTU bus protocol (RS485-over-UART)
category: bus
use_cases: [rs485, modbus_rtu, energy_meter, hvac, inverter]
aliases: ["modbus_rtu", "rs485_bus"]

electrical:
  vcc_min: 0.0
  vcc_max: 0.0
  current_ma_typical: 0
  current_ma_peak: 0
  pins:
    # Optional GPIO that drives a MAX485 (or equivalent) RS485
    # transceiver's combined DE+RE direction pin. Bind only when
    # half-duplex RS485 is wired through such a transceiver; for
    # full-duplex RS232/TTL modbus stacks, leave it unbound.
  - {role: UART, kind: uart_tx}
  - {role: FLOW, kind: digital_out, voltage: 3.3}
  passives: []

esphome:
  required_components: [uart]
  yaml_template: |
    modbus:
      id: {{ id }}
      uart_id: {{ bus.id }}
    {%- if pins.FLOW is defined %}
      flow_control_pin: {{ pins.FLOW | tojson }}
    {%- endif %}
    {%- if params.send_wait_time is defined %}
      send_wait_time: {{ params.send_wait_time }}
    {%- endif %}
    {%- if params.role is defined %}
      role: {{ params.role }}
    {%- endif %}

# Modbus RTU client: a request of address, function, start and count
# with its CRC-16 (polynomial 0xA001, low byte first); the reply's
# address, function, byte count and data, checked by the same CRC. The
# FLOW pin drives an RS485 transceiver's DE/RE high for the request.
# Exception replies (function | 0x80) and timeouts read as None.
circuitpython:
  imports: ["import digitalio"]
  setup: |
    {%- if pins.FLOW is defined %}
    {{ id }}_flow = digitalio.DigitalInOut(P({{ pins.FLOW }}))
    {{ id }}_flow.switch_to_output(value=False)
    def {{ id }}_transmit(on):
        {{ id }}_flow.value = on
    {%- else %}
    def {{ id }}_transmit(on):
        pass
    {%- endif %}
    def {{ id }}_drain():
        {{ bus_var }}.reset_input_buffer()
    def {{ id }}_collect(seconds):
        buf = b""
        until = time.monotonic() + seconds
        while time.monotonic() < until:
            n = {{ bus_var }}.in_waiting
            if n:
                buf += {{ bus_var }}.read(n)
        return buf
    {{ id }}_baud = {{ (bus.baud_rate if bus else none) or 9600 }}
    def {{ id }}_crc(data):
        crc = 0xFFFF
        for b in data:
            crc ^= b
            for _ in range(8):
                crc = crc >> 1 ^ 0xA001 if crc & 1 else crc >> 1
        return bytes([crc & 0xFF, crc >> 8])
    def {{ id }}_parse(address, function, raw):
        head = bytes([address, function])
        i = raw.find(head)
        while 0 <= i and i + 3 <= len(raw):
            frame = raw[i:i + 5 + raw[i + 2]]
            if len(frame) == 5 + raw[i + 2] and {{ id }}_crc(frame[:-2]) == frame[-2:]:
                return frame[3:-2]
            i = raw.find(head, i + 1)
        return None
    def {{ id }}_read(address, function, start, count):
        frame = bytes([address, function, start >> 8, start & 0xFF, count >> 8, count & 0xFF])
        frame += {{ id }}_crc(frame)
        {{ id }}_drain()
        {{ id }}_transmit(True)
        {{ bus_var }}.write(frame)
        time.sleep(len(frame) * 11 / {{ id }}_baud)
        {{ id }}_transmit(False)
        return {{ id }}_parse(address, function, {{ id }}_collect(0.1 + (5 + 2 * count) * 11 / {{ id }}_baud))

micropython:
  setup: |
    {%- if pins.FLOW is defined %}
    {{ id }}_flow = Pin({{ pins.FLOW }}, Pin.OUT, value=0)
    def {{ id }}_transmit(on):
        {{ id }}_flow(1 if on else 0)
    {%- else %}
    def {{ id }}_transmit(on):
        pass
    {%- endif %}
    def {{ id }}_drain():
        {{ bus_var }}.read()
    def {{ id }}_collect(seconds):
        buf = b""
        until = time.ticks_add(time.ticks_ms(), int(seconds * 1000))
        while time.ticks_diff(until, time.ticks_ms()) > 0:
            buf += {{ bus_var }}.read() or b""
            time.sleep_ms(10)
        return buf
    {{ id }}_baud = {{ (bus.baud_rate if bus else none) or 9600 }}
    def {{ id }}_crc(data):
        crc = 0xFFFF
        for b in data:
            crc ^= b
            for _ in range(8):
                crc = crc >> 1 ^ 0xA001 if crc & 1 else crc >> 1
        return bytes([crc & 0xFF, crc >> 8])
    def {{ id }}_parse(address, function, raw):
        head = bytes([address, function])
        i = raw.find(head)
        while 0 <= i and i + 3 <= len(raw):
            frame = raw[i:i + 5 + raw[i + 2]]
            if len(frame) == 5 + raw[i + 2] and {{ id }}_crc(frame[:-2]) == frame[-2:]:
                return frame[3:-2]
            i = raw.find(head, i + 1)
        return None
    def {{ id }}_read(address, function, start, count):
        frame = bytes([address, function, start >> 8, start & 0xFF, count >> 8, count & 0xFF])
        frame += {{ id }}_crc(frame)
        {{ id }}_drain()
        {{ id }}_transmit(True)
        {{ bus_var }}.write(frame)
        time.sleep(len(frame) * 11 / {{ id }}_baud)
        {{ id }}_transmit(False)
        return {{ id }}_parse(address, function, {{ id }}_collect(0.1 + (5 + 2 * count) * 11 / {{ id }}_baud))

lorawan:
  requires: [uart]
  globals: |
    HardwareSerial {{ id }}Serial({{ serial }});
    static uint16_t {{ id }}Crc(const uint8_t* d, size_t n) {
      uint16_t c = 0xFFFF;
      for (size_t i = 0; i < n; i++) {
        c ^= d[i];
        for (int b = 0; b < 8; b++) c = (c & 1) ? (c >> 1) ^ 0xA001 : c >> 1;
      }
      return c;
    }
    // Modbus RTU read: `count` registers from `start` with function `fn`
    // (0x03 holding, 0x04 input); the register bytes land in `out`. False on
    // a timeout, an exception reply or a bad CRC.
    static bool {{ id }}Read(uint8_t addr, uint8_t fn, uint16_t start, uint16_t count, uint8_t* out) {
      uint8_t _q[8] = {addr, fn, (uint8_t)(start >> 8), (uint8_t)start, (uint8_t)(count >> 8), (uint8_t)count, 0, 0};
      uint16_t _c = {{ id }}Crc(_q, 6);
      _q[6] = _c & 0xFF;
      _q[7] = _c >> 8;
      while ({{ id }}Serial.available()) {{ id }}Serial.read();
    {%- if pins.FLOW is defined %}
      digitalWrite({{ pins.FLOW }}, HIGH);  // RS485 driver on
    {%- endif %}
      {{ id }}Serial.write(_q, 8);
      {{ id }}Serial.flush();
    {%- if pins.FLOW is defined %}
      digitalWrite({{ pins.FLOW }}, LOW);
    {%- endif %}
      // The reply can trail a noise byte or two from the line turning
      // around, so take the frame wherever it ends rather than at byte 0.
      uint8_t _r[16 + 5 + 2 * 80];  // the largest read: an SDM meter's 80 registers
      size_t _n = 5 + 2 * count, _got = 0;
      if (_n + 16 > sizeof(_r)) return false;
      unsigned long _t0 = millis(), _wait = 100 + _n * 11000UL / {{ bus.baud if bus and bus.baud else 9600 }};
      while (millis() - _t0 < _wait && _got < sizeof(_r)) {
        if (!{{ id }}Serial.available()) { delay(1); continue; }
        _r[_got++] = {{ id }}Serial.read();
        if (_got < _n) continue;
        const uint8_t* _f = _r + _got - _n;
        if (_f[0] != addr || _f[1] != fn || _f[2] != 2 * count) continue;
        _c = {{ id }}Crc(_f, _n - 2);
        if (_f[_n - 2] != (_c & 0xFF) || _f[_n - 1] != (_c >> 8)) continue;
        memcpy(out, _f + 3, 2 * count);
        return true;
      }
      return false;
    }
  setup: |
    {{ id }}Serial.begin({{ bus.baud if bus and bus.baud else 9600 }}, {{ 'SERIAL_8E1' if bus and bus.parity == 'EVEN' else ('SERIAL_8O1' if bus and bus.parity == 'ODD' else 'SERIAL_8N1') }}, {{ bus.rx if bus and bus.rx is not none else -1 }}, {{ bus.tx if bus and bus.tx is not none else -1 }});
    {%- if pins.FLOW is defined %}
    pinMode({{ pins.FLOW }}, OUTPUT);
    digitalWrite({{ pins.FLOW }}, LOW);
    {%- endif %}
params_schema:
  send_wait_time:
    type: string
    description: "Minimum gap between modbus requests, e.g. '200ms'. Some slaves need 100-500ms to settle
      between transactions."
  role:
    type: string
    enum: [client, server]
    default: client
    description: "client = master (the studio reads), server = slave (the studio answers). Almost everyone
      wants client."

notes: |
  The bare modbus protocol layer that downstream platforms (sdm_meter,
  modbus_controller, dl_bus, etc.) ride on. Pair with a UART configured
  for the slave's baud rate (commonly 9600 for SDM230 / 2400 for SDM120
  / 19200 for many inverters; check the device datasheet) and a MAX485
  transceiver if the bus is electrically RS485. The transceiver's
  DE+RE direction pin ties to the FLOW pin; ESPHome toggles it on each
  TX. UART parity is per-slave -- most modbus stacks run NONE 8N1, but
  a handful (SMA inverters, some HVAC gateways) need EVEN.
# KiCad symbol mapping. Modbus is a logical layer with no part number;
# the FLOW connection is to a real transceiver IC the user adds
# separately. 1-pin header keeps the schematic honest about the wiring
# point without inventing a part.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x02
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
  value: Modbus hub
