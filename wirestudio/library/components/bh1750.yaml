id: bh1750
name: BH1750 ambient light sensor (lux, I2C)
category: sensor
use_cases: [light, illuminance, lux, ambient_light, brightness]
aliases: ["bh1750fvi", "gy-30", "gy-302"]

electrical:
  vcc_min: 2.4
  vcc_max: 3.6
  current_ma_typical: 0.12
  current_ma_peak: 0.19
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  - {role: ADDR, kind: digital_in, voltage: 3.3}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: bh1750
        id: {{ id }}
        i2c_id: {{ bus.id }}
        address: "{{ params.address | default('0x23') }}"
        name: "{{ label }} Illuminance"
        update_interval: {{ params.update_interval | default('60s') }}
    {%- if params.on_value is defined %}
        on_value: {{ params.on_value | tojson }}
    {%- endif %}
    {%- if params.on_value_range is defined %}
        on_value_range: {{ params.on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}
    - {event: on_value_range, kind: event}

circuitpython:
  imports: ["import adafruit_bh1750"]
  deps: [adafruit_bh1750, adafruit_bus_device, adafruit_register]
  setup: |
    {{ id }} = adafruit_bh1750.BH1750({{ bus_var }}, address={{ params.address | default('0x23') }})
  loop: |
    print("{{ label }}: %.0f lux" % {{ id }}.lux)

# Register code, not a driver: the MicroPython BH1750 drivers are GPL.
# Power on (0x01), continuous high-resolution mode (0x10), lux = count / 1.2.
micropython:
  setup: |
    {{ id }}_addr = {{ params.address | default('0x23') }}
    {{ bus_var }}.writeto({{ id }}_addr, b"\x01")
    {{ bus_var }}.writeto({{ id }}_addr, b"\x10")
  loop: |
    {{ id }}_raw = {{ bus_var }}.readfrom({{ id }}_addr, 2)
    print("{{ label }}: %.0f lux" % (((({{ id }}_raw[0] << 8) | {{ id }}_raw[1])) / 1.2))

params_schema:
  address:
    type: string
    enum: ["0x23", "0x5C"]
    default: "0x23"
    description: "ADDR pin: GND/floating=0x23, VDD=0x5C"
  update_interval:
    type: string
    default: "60s"

notes: |
  Cheapest decent ambient-light sensor on the market -- used on the
  ubiquitous GY-30/GY-302 modules. Reports illuminance directly in
  lux (16-bit), no spectrum math required. 3.3V only.
# KiCad symbol mapping (0.9 schematic export).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x05
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical
  value: BH1750

lorawan:
  lib_deps: ["claws/BH1750@^1.3.0"]
  requires: [i2c]
  globals: |
    #include <BH1750.h>
    BH1750 bh1750({{ params.address | default('0x23') }});
    bool bh1750Ok = false;
    float bh1750Lux = 0;
  setup: |
    bh1750Ok = bh1750.begin(BH1750::CONTINUOUS_HIGH_RES_MODE, {{ params.address | default('0x23') }}, &Wire);
  loop: |
    if (bh1750Ok) {
      float _lx = bh1750.readLightLevel();
      if (_lx >= 0) bh1750Lux = _lx;
    }
  fields:
    - name: bh1750_lux
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(min(bh1750Lux, 65535.0f))
      ha_device_class: illuminance
      ha_unit: "lx"
      ha_state_class: measurement
