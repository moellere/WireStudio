id: mpu6886
name: MPU6886 6-axis IMU (accel + gyro, I2C)
category: sensor
use_cases: [imu, accelerometer, gyroscope, motion, orientation, vibration]
aliases: ["mpu-6886", "m5stack imu", "invensense imu"]

electrical:
  vcc_min: 1.71
  vcc_max: 3.6
  current_ma_typical: 3
  current_ma_peak: 4
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - role: SDA
      kind: i2c_sda
      pull_up: {required: true, value: "4.7k", to: VCC}
    - role: SCL
      kind: i2c_scl
      pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: mpu6886
        address: "{{ params.address | default('0x68') }}"
        i2c_id: {{ bus.id }}
        update_interval: {{ params.update_interval | default('60s') }}
        accel_x:
          name: "{{ label }} Accel X"
        accel_y:
          name: "{{ label }} Accel Y"
        accel_z:
          name: "{{ label }} Accel Z"
        gyro_x:
          name: "{{ label }} Gyro X"
        gyro_y:
          name: "{{ label }} Gyro Y"
        gyro_z:
          name: "{{ label }} Gyro Z"
        temperature:
          name: "{{ label }} Die Temp"

# Register code after ESPHome's mpu6886 component: X-gyro clock with
# sleep off (0x6B), +-2000 dps (0x1B), +-2 g (0x1C), then the 14 bytes
# from 0x3B (16384 LSB/g, 16.4 LSB/dps, temperature raw / 326.8 + 25).
circuitpython:
  setup: |
    {{ id }}_addr = {{ params.address | default('0x68') }}
    def {{ id }}_rd(reg, n):
        buf = bytearray(n)
        while not {{ bus_var }}.try_lock():
            pass
        try:
            {{ bus_var }}.writeto_then_readfrom({{ id }}_addr, bytes([reg]), buf)
        finally:
            {{ bus_var }}.unlock()
        return buf
    def {{ id }}_wr(reg, value):
        while not {{ bus_var }}.try_lock():
            pass
        try:
            {{ bus_var }}.writeto({{ id }}_addr, bytes([reg, value]))
        finally:
            {{ bus_var }}.unlock()
    def {{ id }}_decode(b):
        v = [b[k] << 8 | b[k + 1] for k in range(0, 14, 2)]
        v = [x - 0x10000 if x & 0x8000 else x for x in v]
        return tuple(x / 16384 for x in v[0:3]), v[3] / 326.8 + 25, tuple(x / 16.4 for x in v[4:7])
    {{ id }}_wr(0x6B, 0x01)
    {{ id }}_wr(0x1B, 0x18)
    {{ id }}_wr(0x1C, 0x00)
  loop: |
    {{ id }}_accel, {{ id }}_temp, {{ id }}_gyro = {{ id }}_decode({{ id }}_rd(0x3B, 14))
    print("{{ label }}: accel %.2f %.2f %.2f g gyro %.1f %.1f %.1f dps %.1fC" % ({{ id }}_accel + {{ id }}_gyro + ({{ id }}_temp,)))

micropython:
  setup: |
    {{ id }}_addr = {{ params.address | default('0x68') }}
    def {{ id }}_rd(reg, n):
        return {{ bus_var }}.readfrom_mem({{ id }}_addr, reg, n)
    def {{ id }}_wr(reg, value):
        {{ bus_var }}.writeto_mem({{ id }}_addr, reg, bytes([value]))
    def {{ id }}_decode(b):
        v = [b[k] << 8 | b[k + 1] for k in range(0, 14, 2)]
        v = [x - 0x10000 if x & 0x8000 else x for x in v]
        return tuple(x / 16384 for x in v[0:3]), v[3] / 326.8 + 25, tuple(x / 16.4 for x in v[4:7])
    {{ id }}_wr(0x6B, 0x01)
    {{ id }}_wr(0x1B, 0x18)
    {{ id }}_wr(0x1C, 0x00)
  loop: |
    {{ id }}_accel, {{ id }}_temp, {{ id }}_gyro = {{ id }}_decode({{ id }}_rd(0x3B, 14))
    print("{{ label }}: accel %.2f %.2f %.2f g gyro %.1f %.1f %.1f dps %.1fC" % ({{ id }}_accel + {{ id }}_gyro + ({{ id }}_temp,)))

params_schema:
  address:
    type: string
    enum: ["0x68", "0x69"]
    default: "0x68"
    description: "AD0 pin: GND=0x68, VCC=0x69"
  update_interval:
    type: string
    default: "60s"
    description: "How often to publish a fresh reading. The chip samples at its configured ODR regardless."

notes: |
  6-axis IMU (3-axis accelerometer + 3-axis gyroscope) plus an on-die
  temperature sensor -- the InvenSense MPU6886 that ships onboard the
  M5Stack Atom / AtomS3 / Core family. 1.71-3.6V, I2C at 0x68 (or 0x69
  with AD0 high). ESPHome's `mpu6886` platform mirrors the mpu6050 one.
# KiCad symbol mapping. No stock KiCad symbol for the MPU6886 breakout;
# render the 4-pin I2C header (VCC/GND/SDA/SCL) generically.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: MPU6886

# The same registers as the other frameworks' blocks, read over Wire;
# accelerations in milli-g, rates in tenths of a degree per second.
lorawan:
  requires: [i2c]
  globals: |
    bool mpu6886Ok = false;
    int16_t mpu6886Accel[3] = {0, 0, 0}, mpu6886Gyro[3] = {0, 0, 0};
    static bool mpu6886Write(uint8_t reg, uint8_t value) {
      Wire.beginTransmission({{ params.address | default('0x68') }});
      Wire.write(reg);
      Wire.write(value);
      return Wire.endTransmission() == 0;
    }
  setup: |
    mpu6886Ok = mpu6886Write(0x6B, 0x01) && mpu6886Write(0x1B, 0x18) && mpu6886Write(0x1C, 0x00);
  loop: |
    if (mpu6886Ok) {
      Wire.beginTransmission({{ params.address | default('0x68') }});
      Wire.write(0x3B);
      if (Wire.endTransmission(false) == 0 && Wire.requestFrom((uint8_t){{ params.address | default('0x68') }}, (uint8_t)14) == 14) {
        uint8_t _b[14];
        for (uint8_t _i = 0; _i < 14; _i++) _b[_i] = Wire.read();
        for (uint8_t _i = 0; _i < 3; _i++) {
          mpu6886Accel[_i] = (int16_t)((_b[2 * _i] << 8) | _b[2 * _i + 1]);
          mpu6886Gyro[_i] = (int16_t)((_b[8 + 2 * _i] << 8) | _b[9 + 2 * _i]);
        }
      }
    }
  fields:
    - name: mpu6886_accel_x
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6886Accel[0] * 1000L / 16384)
      signed: true
      scale: 1000.0
      ha_unit: g
      ha_state_class: measurement
    - name: mpu6886_accel_y
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6886Accel[1] * 1000L / 16384)
      signed: true
      scale: 1000.0
      ha_unit: g
      ha_state_class: measurement
    - name: mpu6886_accel_z
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6886Accel[2] * 1000L / 16384)
      signed: true
      scale: 1000.0
      ha_unit: g
      ha_state_class: measurement
    - name: mpu6886_gyro_x
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6886Gyro[0] * 100L / 164)
      signed: true
      scale: 10.0
      ha_unit: "°/s"
      ha_state_class: measurement
    - name: mpu6886_gyro_y
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6886Gyro[1] * 100L / 164)
      signed: true
      scale: 10.0
      ha_unit: "°/s"
      ha_state_class: measurement
    - name: mpu6886_gyro_z
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6886Gyro[2] * 100L / 164)
      signed: true
      scale: 10.0
      ha_unit: "°/s"
      ha_state_class: measurement
