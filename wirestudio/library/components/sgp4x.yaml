id: sgp4x
name: Sensirion SGP40/SGP41 VOC/NOx index sensor (I2C)
category: sensor
use_cases: [voc, air_quality, nox, odor, indoor_air]
aliases: ["sgp40", "sgp41", "adafruit-4829"]

electrical:
  vcc_min: 1.7
  vcc_max: 3.6
  current_ma_typical: 2.6
  current_ma_peak: 3.4
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: sgp4x
        i2c_id: {{ bus.id }}
        voc:
          name: "{{ label }} VOC Index"
    {%- if params.model | default('sgp40') == 'sgp41' %}
        nox:
          name: "{{ label }} NOx Index"
    {%- endif %}
        update_interval: {{ params.update_interval | default('60s') }}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}

circuitpython:
  imports: ["import adafruit_sgp40"]
  deps: [adafruit_sgp40, adafruit_bus_device]
  setup: |
    {{ id }} = adafruit_sgp40.SGP40({{ bus_var }})
  loop: |
    print("{{ label }}: raw VOC %d" % {{ id }}.raw)

# Datasheet register code: measure-raw with the default 50% RH / 25C
# compensation words and CRCs; the first word back is the raw VOC signal.
micropython:
  setup: |
    {{ id }}_cmd = {% if (params.model | default('sgp40')) == 'sgp41' %}b"\x26\x19\x80\x00\xa2\x66\x66\x93"{% else %}b"\x26\x0f\x80\x00\xa2\x66\x66\x93"{% endif %}
    def {{ id }}_raw():
        {{ bus_var }}.writeto(0x59, {{ id }}_cmd)
        time.sleep_ms(50)
        r = {{ bus_var }}.readfrom(0x59, 3)
        return (r[0] << 8) | r[1]
  loop: |
    print("{{ label }}: raw VOC %d" % {{ id }}_raw())

params_schema:
  model:
    type: string
    enum: [sgp40, sgp41]
    default: sgp40
    description: "SGP41 adds the NOx index channel."
  update_interval:
    type: string
    default: "60s"

notes: |
  Reports Sensirion's VOC Index (1-500, 100 = typical air), not ppb --
  the on-chip gas algorithm baselines itself over ~24h. Pair with an
  SHT4x on the same bus and set humidity_source for compensated
  readings. The hotplate runs continuously; ~2.6mA is the price of a
  stable index.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: SGP4x

# Measure-raw with the default 50% RH / 25 C compensation words, as the
# MicroPython block; the raw VOC signal (ticks), not the VOC index, since
# the index algorithm needs a 24 h baseline the uplink side can keep.
lorawan:
  requires: [i2c]
  globals: |
    uint16_t sgp4xVocRaw = 0;
    bool sgp4xOk = false;
    static bool sgp4xCommand(const uint8_t* cmd, size_t n) {
      Wire.beginTransmission(0x59);
      Wire.write(cmd, n);
      return Wire.endTransmission() == 0;
    }
  setup: |
    {%- if (params.model | default('sgp40')) == 'sgp41' %}
    static const uint8_t _condition[] = {0x26, 0x12, 0x80, 0x00, 0xA2, 0x66, 0x66, 0x93};
    sgp4xOk = sgp4xCommand(_condition, sizeof(_condition));
    {%- else %}
    sgp4xOk = true;
    {%- endif %}
  loop: |
    {
      static unsigned long _last = 0;
      if (sgp4xOk && (_last == 0 || millis() - _last >= 1000)) {
        _last = millis();
        static const uint8_t _measure[] = {% if (params.model | default('sgp40')) == 'sgp41' %}{0x26, 0x19, 0x80, 0x00, 0xA2, 0x66, 0x66, 0x93}{% else %}{0x26, 0x0F, 0x80, 0x00, 0xA2, 0x66, 0x66, 0x93}{% endif %};
        if (sgp4xCommand(_measure, sizeof(_measure))) {
          delay(50);
          if (Wire.requestFrom((uint8_t)0x59, (uint8_t)3) == 3) {
            uint16_t _raw = (uint16_t)Wire.read() << 8;
            _raw |= Wire.read();
            Wire.read();
            sgp4xVocRaw = _raw;
          }
        }
      }
    }
  fields:
    - name: sgp4x_voc_raw
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: sgp4xVocRaw
      ha_state_class: measurement
      ha_icon: mdi:air-filter
