id: mhz19
name: Winsen MH-Z19 NDIR CO2 sensor (UART)
category: sensor
use_cases: [co2, air_quality, ventilation, indoor_air]
aliases: ["mh-z19b", "mh-z19c", "mh-z19e"]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 60
  current_ma_peak: 150
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: TX, kind: uart_tx, voltage: 3.3}
    - {role: RX, kind: uart_rx, voltage: 3.3}
  passives:
    - {kind: capacitor, value: "10uF", between: [VCC, GND], purpose: bulk decoupling for lamp pulses}

esphome:
  required_components: [uart]
  yaml_template: |
    sensor:
      - platform: mhz19
        uart_id: {{ bus.id }}
        co2:
          id: {{ id }}_co2
          name: "{{ label }} CO2"
    {%- if params.co2_on_value is defined %}
          on_value: {{ params.co2_on_value | tojson }}
    {%- endif %}
    {%- if params.co2_on_value_range is defined %}
          on_value_range: {{ params.co2_on_value_range | tojson }}
    {%- endif %}
        temperature:
          id: {{ id }}_temperature
          name: "{{ label }} Temperature"
        update_interval: {{ params.update_interval | default('60s') }}
        automatic_baseline_calibration: {{ params.automatic_baseline_calibration | default(false) | tojson }}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value, channel: co2}
    - {event: on_value_range, kind: event, channel: co2}
    - {event: on_value, kind: value, channel: temperature}

tasmota:
  bus:
    tx: MHZ_TXD
    rx: MHZ_RXD

# Datasheet protocol: command 0x86 reads the CO2 concentration as a
# 9-byte reply, FF 86 HIGH LOW ... CHECK, where CHECK is the two's
# complement of the sum of bytes 1-7. Command 0x79 switches the
# automatic baseline calibration (0xA0 on, 0x00 off).
circuitpython:
  setup: |
    def {{ id }}_decode(resp):
        if not resp or len(resp) != 9 or resp[0] != 0xFF or resp[1] != 0x86:
            return None
        if (0x100 - sum(resp[1:8])) & 0xFF != resp[8]:
            return None
        return resp[2] << 8 | resp[3]
    def {{ id }}_co2():
        {{ bus_var }}.reset_input_buffer()
        {{ bus_var }}.write(b"\xff\x01\x86\x00\x00\x00\x00\x00\x79")
        return {{ id }}_decode({{ bus_var }}.read(9))
    {{ bus_var }}.write({{ 'b"\\xff\\x01\\x79\\xa0\\x00\\x00\\x00\\x00\\xe6"' if params.automatic_baseline_calibration | default(false) else 'b"\\xff\\x01\\x79\\x00\\x00\\x00\\x00\\x00\\x86"' }})
  loop: |
    {{ id }}_ppm = {{ id }}_co2()
    print("{{ label }}: %s" % ("%d ppm CO2" % {{ id }}_ppm if {{ id }}_ppm is not None else "no reply"))

micropython:
  setup: |
    def {{ id }}_decode(resp):
        if not resp or len(resp) != 9 or resp[0] != 0xFF or resp[1] != 0x86:
            return None
        if (0x100 - sum(resp[1:8])) & 0xFF != resp[8]:
            return None
        return resp[2] << 8 | resp[3]
    def {{ id }}_co2():
        {{ bus_var }}.read()
        {{ bus_var }}.write(b"\xff\x01\x86\x00\x00\x00\x00\x00\x79")
        time.sleep_ms(100)
        return {{ id }}_decode({{ bus_var }}.read(9))
    {{ bus_var }}.write({{ 'b"\\xff\\x01\\x79\\xa0\\x00\\x00\\x00\\x00\\xe6"' if params.automatic_baseline_calibration | default(false) else 'b"\\xff\\x01\\x79\\x00\\x00\\x00\\x00\\x00\\x86"' }})
  loop: |
    {{ id }}_ppm = {{ id }}_co2()
    print("{{ label }}: %s" % ("%d ppm CO2" % {{ id }}_ppm if {{ id }}_ppm is not None else "no reply"))

lorawan:
  requires: [uart]
  globals: |
    HardwareSerial {{ id }}Serial({{ serial }});
    uint16_t {{ id }}Co2 = 0;
  setup: |
    {{ id }}Serial.begin({{ bus.baud if bus and bus.baud else 9600 }}, SERIAL_8N1, {{ bus.rx if bus and bus.rx is not none else -1 }}, {{ bus.tx if bus and bus.tx is not none else -1 }});
    {
      const uint8_t _abc[9] = {{ '{0xFF, 0x01, 0x79, 0xA0, 0x00, 0x00, 0x00, 0x00, 0xE6}' if params.automatic_baseline_calibration else '{0xFF, 0x01, 0x79, 0x00, 0x00, 0x00, 0x00, 0x00, 0x86}' }};
      {{ id }}Serial.write(_abc, 9);  // automatic baseline calibration {{ 'on' if params.automatic_baseline_calibration else 'off' }}
    }
  loop: |
    {
      static unsigned long _last = 0;
      if (_last == 0 || millis() - _last >= 5000) {
        _last = millis();
        static const uint8_t _q[9] = {0xFF, 0x01, 0x86, 0x00, 0x00, 0x00, 0x00, 0x00, 0x79};
        while ({{ id }}Serial.available()) {{ id }}Serial.read();
        {{ id }}Serial.write(_q, 9);
        uint8_t _r[9];
        {{ id }}Serial.setTimeout(200);
        if ({{ id }}Serial.readBytes(_r, 9) == 9 && _r[0] == 0xFF && _r[1] == 0x86) {
          uint8_t _sum = 0;
          for (int _i = 1; _i < 8; _i++) _sum += _r[_i];
          if ((uint8_t)(0 - _sum) == _r[8]) {{ id }}Co2 = (uint16_t)(_r[2] << 8 | _r[3]);
        }
      }
    }
  fields:
    - name: "{{ id }}_co2_ppm"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}Co2"
      ha_device_class: carbon_dioxide
      ha_unit: "ppm"
      ha_state_class: measurement
params_schema:
  update_interval:
    type: string
    default: "60s"
  automatic_baseline_calibration:
    type: boolean
    default: false
    description: "ABC assumes the room sees ~400ppm fresh air daily; leave off for bedrooms/offices that stay occupied."

notes: |
  The classic hobbyist NDIR CO2 sensor: 5V supply, 3.3V UART at 9600
  baud (wire sensor TX to MCU RX and vice versa). Needs ~3 minutes of
  warm-up before readings settle. Temperature output is the internal
  die temperature -- coarse, not a room thermometer. For new designs
  the SCD4x costs similar and adds RH; the MH-Z19 remains the cheap
  proven default.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: MH-Z19
