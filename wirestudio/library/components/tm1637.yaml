id: tm1637
name: TM1637 4-digit 7-segment display module
category: display
use_cases: [display, seven_segment, clock, counter, numeric_readout]
aliases: ["4-digit-display", "grove-4-digit"]

electrical:
  vcc_min: 3.3
  vcc_max: 5.5
  current_ma_typical: 30
  current_ma_peak: 80
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: CLK, kind: digital_out, voltage: 3.3}
    - {role: DIO, kind: digital_out, voltage: 3.3}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: []
  display_dialect: seven_segment
  yaml_template: |
    display:
      - platform: tm1637
        id: {{ id }}
        clk_pin: {{ pins.CLK | tojson }}
        dio_pin: {{ pins.DIO | tojson }}
        intensity: {{ params.intensity | default(4) }}
        update_interval: {{ params.update_interval | default('1s') }}
        lambda: |-
          {{ params.lambda | default('it.print("----");') }}

tasmota:
  pins:
    CLK: TM1637_CLK
    DIO: TM1637_DIO

# Datasheet protocol, bit-banged open drain: start (DIO falls with CLK
# high), each byte LSB first latched on CLK rising plus an ACK clock,
# stop (DIO rises with CLK high). 0x40 writes with auto-increment, 0xC0
# addresses digit 0, 0x88 | brightness turns the display on.
circuitpython:
  imports: ["import digitalio"]
  setup: |
    {{ id }}_pins = [digitalio.DigitalInOut(P(n)) for n in ({{ pins.CLK }}, {{ pins.DIO }})]
    for {{ id }}_pin in {{ id }}_pins:
        {{ id }}_pin.switch_to_output(value=True, drive_mode=digitalio.DriveMode.OPEN_DRAIN)
    def {{ id }}_clk(v):
        {{ id }}_pins[0].value = bool(v)
    def {{ id }}_dio(v):
        {{ id }}_pins[1].value = bool(v)
    {{ id }}_font = {"0": 0x3F, "1": 0x06, "2": 0x5B, "3": 0x4F, "4": 0x66, "5": 0x6D, "6": 0x7D, "7": 0x07, "8": 0x7F, "9": 0x6F, "-": 0x40, " ": 0x00}
    def {{ id }}_byte(b):
        for i in range(8):
            {{ id }}_dio(b >> i & 1)
            {{ id }}_clk(1)
            {{ id }}_clk(0)
        {{ id }}_dio(1)
        {{ id }}_clk(1)
        {{ id }}_clk(0)
    def {{ id }}_command(*data):
        {{ id }}_dio(0)
        {{ id }}_clk(0)
        for b in data:
            {{ id }}_byte(b)
        {{ id }}_dio(0)
        {{ id }}_clk(1)
        {{ id }}_dio(1)
    def {{ id }}_show(text):
        {{ id }}_command(0x40)
        {{ id }}_command(0xC0, *[{{ id }}_font.get(c, 0) for c in text[:4]])
        {{ id }}_command(0x88 | {{ [params.intensity | default(4), 7] | min }})
    {{ id }}_show("----")

micropython:
  setup: |
    {{ id }}_clk = Pin({{ pins.CLK }}, Pin.OPEN_DRAIN, value=1)
    {{ id }}_dio = Pin({{ pins.DIO }}, Pin.OPEN_DRAIN, value=1)
    {{ id }}_font = {"0": 0x3F, "1": 0x06, "2": 0x5B, "3": 0x4F, "4": 0x66, "5": 0x6D, "6": 0x7D, "7": 0x07, "8": 0x7F, "9": 0x6F, "-": 0x40, " ": 0x00}
    def {{ id }}_byte(b):
        for i in range(8):
            {{ id }}_dio(b >> i & 1)
            {{ id }}_clk(1)
            {{ id }}_clk(0)
        {{ id }}_dio(1)
        {{ id }}_clk(1)
        {{ id }}_clk(0)
    def {{ id }}_command(*data):
        {{ id }}_dio(0)
        {{ id }}_clk(0)
        for b in data:
            {{ id }}_byte(b)
        {{ id }}_dio(0)
        {{ id }}_clk(1)
        {{ id }}_dio(1)
    def {{ id }}_show(text):
        {{ id }}_command(0x40)
        {{ id }}_command(0xC0, *[{{ id }}_font.get(c, 0) for c in text[:4]])
        {{ id }}_command(0x88 | {{ [params.intensity | default(4), 7] | min }})
    {{ id }}_show("----")

params_schema:
  intensity:
    type: integer
    minimum: 0
    maximum: 7
    default: 4
  update_interval:
    type: string
    default: "1s"
  lambda:
    type: string
    description: "Display lambda body, e.g. `it.printf(\"%4.0f\", id(co2_val).state);` or `it.strftime(\"%H.%M\", id(my_time).now());`"

notes: |
  The ubiquitous 4-digit LED module (clocks, counters, CO2 readouts).
  Two-wire protocol that looks like I2C but isn't -- CLK/DIO take any
  two GPIOs, no bus. Runs at 3.3V logic fine; brightness at 5V VCC is
  noticeably higher. The colon variant maps to the decimal point of
  digit 2 (`it.print("12.34")` style).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: TM1637
