id: bmp280
name: Bosch BMP280 (T/P)
category: sensor
use_cases: [temperature, pressure, weather, altimeter]
aliases: [bmp180, bmp388]

electrical:
  vcc_min: 1.8
  vcc_max: 3.6
  current_ma_typical: 0.4
  current_ma_peak: 1.1
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: bmp280_i2c
        address: "{{ params.address | default('0x77') }}"
        i2c_id: {{ bus.id }}
        temperature:
          id: {{ id }}_temperature
          name: "{{ label }} Temperature"
    {%- if params.oversampling is defined %}
          oversampling: {{ params.oversampling }}
    {%- endif %}
    {%- if params.temperature_on_value is defined %}
          on_value: {{ params.temperature_on_value | tojson }}
    {%- endif %}
    {%- if params.temperature_on_value_range is defined %}
          on_value_range: {{ params.temperature_on_value_range | tojson }}
    {%- endif %}
        pressure:
          id: {{ id }}_pressure
          name: "{{ label }} Pressure"
    {%- if params.pressure_on_value is defined %}
          on_value: {{ params.pressure_on_value | tojson }}
    {%- endif %}
    {%- if params.pressure_on_value_range is defined %}
          on_value_range: {{ params.pressure_on_value_range | tojson }}
    {%- endif %}
    {%- if params.update_interval is defined %}
        update_interval: {{ params.update_interval }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value, channel: temperature}
    - {event: on_value_range, kind: event, channel: temperature}
    - {event: on_value, kind: value, channel: pressure}
    - {event: on_value_range, kind: event, channel: pressure}

circuitpython:
  imports: ["import adafruit_bmp280"]
  deps: [adafruit_bmp280, adafruit_bus_device, adafruit_register]
  setup: |
    {{ id }} = adafruit_bmp280.Adafruit_BMP280_I2C({{ bus_var }}, address={{ params.address | default('0x76') }})
  loop: |
    print("{{ label }}: %.1fC %.1fhPa" % ({{ id }}.temperature, {{ id }}.pressure))

micropython:
  imports: ["from bmp280 import BMP280"]
  deps: ["github:dafvid/micropython-bmp280/bmp280.py"]
  setup: |
    {{ id }} = BMP280({{ bus_var }}, addr={{ params.address | default('0x77') }})
  loop: |
    print("{{ label }}: %.1fC %.1fhPa" % ({{ id }}.temperature, {{ id }}.pressure / 100))

params_schema:
  address:
    type: string
    enum: ["0x76", "0x77"]
    default: "0x77"
  oversampling:
    type: string
    enum: ["1x", "2x", "4x", "8x", "16x"]
  update_interval:
    type: string
    default: "60s"

notes: "Pressure-only Bosch sibling of the BME280; same I2C protocol, no humidity channel. 3V3 only. SDO
  pin selects the I2C address (0x76 GND, 0x77 VCC)."
# KiCad symbol mapping (0.9). BMP280 in Sensor lib; same VDD/GND/SDA/SCL
# pinout as BME280 minus humidity.
kicad:
  symbol_lib: Sensor_Pressure
  symbol: BMP280
  footprint: Package_LGA:Bosch_LGA-8_2x2.5mm_P0.65mm_ClockwisePinNumbering
  pin_map:
    VCC: VDD
    SDA: SDI
    SCL: SCK

wled:
  kind: usermod
  usermod: BME280_v2
  define: USERMOD_BME280
  lib_deps: ["BME280@~3.0.0"]
  um_name: BME280/BMP280
  um: {enabled: true}
  um_params: {I2CAddress: address}

lorawan:
  lib_deps: ["adafruit/Adafruit BMP280 Library@^2.6.8"]
  requires: [i2c]
  globals: |
    #include <Adafruit_BMP280.h>
    Adafruit_BMP280 bmp280(&Wire);
    bool bmp280Ok = false;
    float bmp280TempC = 0, bmp280HPa = 0;
  setup: |
    bmp280Ok = bmp280.begin({{ params.address | default('0x77') }});
  loop: |
    if (bmp280Ok) {
      bmp280TempC = bmp280.readTemperature();
      bmp280HPa = bmp280.readPressure() / 100.0F;
    }
  fields:
    - name: bmp280_temp_c
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(bmp280TempC * 100.0)
      signed: true
      scale: 100.0
      ha_device_class: temperature
      ha_unit: "°C"
      ha_state_class: measurement
    - name: bmp280_pressure
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(bmp280HPa * 10.0)
      scale: 10.0
      ha_device_class: atmospheric_pressure
      ha_unit: hPa
      ha_state_class: measurement
