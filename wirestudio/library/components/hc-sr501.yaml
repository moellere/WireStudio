id: hc-sr501
name: HC-SR501 PIR motion sensor
category: binary_sensor
use_cases: [motion, occupancy, presence]

electrical:
  vcc_min: 4.5
  vcc_max: 20.0
  current_ma_typical: 50
  current_ma_peak: 65
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: OUT, kind: digital_in, voltage: 3.3, driven: true}
  passives: []

esphome:
  required_components: []
  yaml_template: |
    binary_sensor:
      - platform: gpio
        pin: {{ pins.OUT | tojson }}
        name: "{{ label }}"
        id: {{ id }}
        device_class: motion
    {%- if params.filters is defined %}
        filters: {{ params.filters | tojson }}
    {%- endif %}
    {%- if params.on_press is defined %}
        on_press: {{ params.on_press | tojson }}
    {%- endif %}
    {%- if params.on_release is defined %}
        on_release: {{ params.on_release | tojson }}
    {%- endif %}

capability:
  role: input
  provides:
    - {event: on_press}
    - {event: on_release}
  checks:
    - {predicate: is_on,  esphome: binary_sensor.is_on}
    - {predicate: is_off, esphome: binary_sensor.is_off}

circuitpython:
  imports: ["import digitalio"]
  setup: |
    {{ id }} = digitalio.DigitalInOut(P({{ pins.OUT }}))
    {{ id }}.direction = digitalio.Direction.INPUT
  loop: |
    print("{{ label }}: motion" if {{ id }}.value else "{{ label }}: clear")

micropython:
  setup: |
    {{ id }} = Pin({{ pins.OUT }}, Pin.IN)
  loop: |
    print("{{ label }}: motion" if {{ id }}.value() else "{{ label }}: clear")

params_schema:
  retrigger:
    type: string
    enum: [H, L]
    default: H
    description: "Retrigger jumper position (H=repeat, L=single)"
  pulse_ms:
    type: integer
    default: 2500

notes: "Requires 5V supply. OUT signal is 3.3V, safe for ESP32 GPIO."
# KiCad symbol mapping (0.9 schematic export). Generic 3-pin header --
# the HC-SR501 PIR ships as a breakout module without a dedicated
# kicad-symbols entry.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x03
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical
  value: HC-SR501

wled:
  kind: button
  pins: [OUT]
  button: pir
tasmota:
  pins: {OUT: Switch}

lorawan:
  globals: |
    uint8_t hcsr501Motion = 0;
  setup: |
    pinMode({{ pins.OUT }}, INPUT);
  loop: |
    hcsr501Motion = digitalRead({{ pins.OUT }}) == HIGH;
  fields:
    - name: hc_sr501_motion
      bytes: 1
      cpp_type: uint8_t
      cpp_expr: hcsr501Motion
      ha_device_class: motion

# Enclosure geometry (mm): the common HC-SR501 board, 32.3 x 24.3 with
# two 2.0 holes 28 apart on the centre line. The 23 Fresnel dome pokes
# through the lid; its square skirt stops under it, 3.5 from the PCB
# (fitted on the first wall-panel print).
# Pots, jumper and the 3-pin header face the floor, 17 deep as wired.
enclosure:
  mount: lid
  pcb: {length_mm: 32.3, width_mm: 24.3, thickness_mm: 1.6}
  mount_holes:
    - {x_mm: 2.15, y_mm: 12.15, hole_diameter_mm: 2.0}
    - {x_mm: 30.15, y_mm: 12.15, hole_diameter_mm: 2.0}
  lid_gap_mm: 3.5
  height_above_pcb_mm: 14.0
  height_below_pcb_mm: 17.0
  features:
    - {kind: hole, x_mm: 16.15, y_mm: 12.15, diameter_mm: 23.6}
