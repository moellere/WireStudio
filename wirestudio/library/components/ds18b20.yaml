id: ds18b20
name: DS18B20 1-wire temperature sensor
category: sensor
use_cases: [temperature]
aliases: ["dallas", "1-wire temp", "onewire", "ds1820"]

electrical:
  vcc_min: 3.0
  vcc_max: 5.5
  current_ma_typical: 1
  current_ma_peak: 2
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - {role: DATA, kind: onewire_data, voltage: 3.3}
  passives:
  - {kind: resistor, value: "4.7k", between: ["DATA", "VCC"], purpose: "1-wire bus pull-up"}

esphome:
  required_components: ["1wire"]
  yaml_template: |
    sensor:
      - platform: dallas_temp
        one_wire_id: {{ bus.id }}
        name: "{{ label }}"
    {%- if params.address is defined %}
        address: "{{ params.address }}"
    {%- endif %}
        update_interval: {{ params.update_interval | default('60s') }}
    {%- if params.resolution is defined %}
        resolution: {{ params.resolution }}
    {%- endif %}
    {%- if params.on_value is defined %}
        on_value: {{ params.on_value | tojson }}
    {%- endif %}
    {%- if params.on_value_range is defined %}
        on_value_range: {{ params.on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}
    - {event: on_value_range, kind: event}

circuitpython:
  imports: ["from adafruit_onewire.bus import OneWireBus", "from adafruit_ds18x20 import DS18X20"]
  deps: [adafruit_onewire, adafruit_ds18x20]
  setup: |
    {%- if not bus_var and pins.DATA is not defined %}
    {{ unsupported("its 1-wire bus has no usable GPIO") }}
    {%- endif %}
    {%- set ow = bus_var if bus_var else id ~ '_ow' %}
    {%- if not bus_var %}
    {{ ow }} = OneWireBus(P({{ pins.DATA }}))
    {%- endif %}
    {%- if params.address is defined %}
    {{ id }} = DS18X20({{ ow }}, next(d for d in {{ ow }}.scan() if d.rom == ({{ params.address }}).to_bytes(8, "little")))
    {%- else %}
    {{ id }} = DS18X20({{ ow }}, {{ ow }}.scan()[0])
    {%- endif %}
  loop: |
    print("{{ label }}: %.1fC" % {{ id }}.temperature)

micropython:
  imports: ["import onewire", "import ds18x20"]
  setup: |
    {%- if not bus_var and pins.DATA is not defined %}
    {{ unsupported("its 1-wire bus has no usable GPIO") }}
    {%- endif %}
    {{ id }} = ds18x20.DS18X20({{ bus_var if bus_var else 'onewire.OneWire(Pin(%d))' % pins.DATA }})
    {%- if params.address is defined %}
    {{ id }}_roms = [({{ params.address }}).to_bytes(8, "little")]
    {%- else %}
    {{ id }}_roms = {{ id }}.scan()
    {%- endif %}
  loop: |
    {{ id }}.convert_temp()
    time.sleep_ms(750)
    for rom in {{ id }}_roms:
        print("{{ label }}: %.1fC" % {{ id }}.read_temp(rom))

params_schema:
  address:
    type: string
    description: "ROM address (e.g., 0x1c0000031edd2a28). Required when more than one DS18B20 shares a
      bus."
  update_interval:
    type: string
    default: "60s"
  resolution:
    type: integer
    enum: [9, 10, 11, 12]
    description: "Bits of resolution (9 = 0.5°C / fast, 12 = 0.0625°C / slow)"

notes: |
  Connects via a 1-wire bus -- the bus carries the DATA pin and any
  number of DS18B20 (and other 1-wire devices) can share it. Needs a
  4.7kΩ pull-up between the bus pin and VCC. When two or more sensors
  share a wire, give each instance a distinct `address` param (the
  factory-burned ROM); ESPHome auto-discovers but emits a warning
  about ambiguous read order when the addresses are missing. Output
  is 3.3V-compatible. Parasite power is supported by ESPHome but not
  modeled here -- wire VCC.
# KiCad symbol mapping (0.9 schematic export). The standard TO-92
# package; map our DATA role to the symbol's DQ pin.
kicad:
  symbol_lib: Sensor_Temperature
  symbol: DS18B20
  footprint: Package_TO_SOT_THT:TO-92_Inline
  pin_map:
    VCC: V_{DD}
    DATA: DQ
tasmota:
  pins: {DATA: DS18x20}

wled:
  kind: usermod
  usermod: Temperature
  define: USERMOD_DALLASTEMPERATURE
  lib_deps: ["paulstoffregen/OneWire@~2.3.8"]
  pins: [DATA]
  pin_defines: {DATA: TEMPERATURE_PIN}
  um_name: Temperature
  um: {enabled: true, degC: true}
  um_pins: {DATA: pin}
