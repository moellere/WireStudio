id: pmsx003
name: Plantower PMS5003/PMS7003 particulate matter sensor (UART)
category: sensor
use_cases: [pm25, air_quality, dust, particulate, outdoor_air]
aliases: ["pms5003", "pms7003", "pmsa003", "plantower"]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 100
  current_ma_peak: 120
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: TX, kind: uart_tx, voltage: 3.3}
    - {role: RX, kind: uart_rx, voltage: 3.3}
    - {role: SET, kind: digital_out, voltage: 3.3}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [uart]
  yaml_template: |
    sensor:
      - platform: pmsx003
        uart_id: {{ bus.id }}
        type: {{ params.type | default('PMSX003') }}
        pm_1_0:
          name: "{{ label }} PM1.0"
        pm_2_5:
          name: "{{ label }} PM2.5"
        pm_10_0:
          name: "{{ label }} PM10"

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}

tasmota:
  bus:
    tx: PMS5003_TX
    rx: PMS5003_RX

circuitpython:
  imports: ["from adafruit_pm25.uart import PM25_UART"]
  deps: [adafruit_pm25]
  setup: |
    {{ id }} = PM25_UART({{ bus_var }})
  loop: |
    try:
        {{ id }}_aq = {{ id }}.read()
        print("{{ label }}: PM1.0 %d PM2.5 %d PM10 %d ug/m3" % ({{ id }}_aq["pm10 env"], {{ id }}_aq["pm25 env"], {{ id }}_aq["pm100 env"]))
    except RuntimeError as e:
        print("{{ label }}:", e)

# Datasheet frame: 0x42 0x4D, a big-endian length, data words, then a
# checksum word, the sum of every byte before it. Words 4-6 are PM1.0,
# PM2.5 and PM10 under atmospheric conditions.
micropython:
  setup: |
    def {{ id }}_read():
        buf = {{ bus_var }}.read()
        found = None
        i = buf.find(b"\x42\x4d") if buf else -1
        while 0 <= i and i + 4 <= len(buf):
            frame = buf[i:i + 4 + (buf[i + 2] << 8 | buf[i + 3])]
            if len(frame) >= 16 and len(frame) == 4 + (buf[i + 2] << 8 | buf[i + 3]) \
                    and sum(frame[:-2]) == (frame[-2] << 8 | frame[-1]):
                found = [frame[k] << 8 | frame[k + 1] for k in (10, 12, 14)]
            i = buf.find(b"\x42\x4d", i + 2)
        return found
  loop: |
    {{ id }}_pm = {{ id }}_read()
    if {{ id }}_pm:
        print("{{ label }}: PM1.0 %d PM2.5 %d PM10 %d ug/m3" % tuple({{ id }}_pm))

lorawan:
  requires: [uart]
  globals: |
    HardwareSerial {{ id }}Serial({{ serial }});
    uint8_t {{ id }}Buf[32];
    uint8_t {{ id }}Len = 0;
    uint16_t {{ id }}Pm1 = 0, {{ id }}Pm25 = 0, {{ id }}Pm10 = 0;
  setup: |
    {{ id }}Serial.begin({{ bus.baud if bus and bus.baud else 9600 }}, SERIAL_8N1, {{ bus.rx if bus and bus.rx is not none else -1 }}, {{ bus.tx if bus and bus.tx is not none else -1 }});
    {%- if pins.SET is defined %}
    pinMode({{ pins.SET }}, OUTPUT);
    digitalWrite({{ pins.SET }}, HIGH);  // SET high: awake, fan on
    {%- endif %}
  loop: |
    // Frames stream on their own: 0x42 0x4D, length, data, sum of every byte before it.
    while ({{ id }}Serial.available()) {
      uint8_t _b = {{ id }}Serial.read();
      if ({{ id }}Len == 0 && _b != 0x42) continue;
      if ({{ id }}Len == 1 && _b != 0x4D) { {{ id }}Len = _b == 0x42 ? 1 : 0; continue; }
      {{ id }}Buf[{{ id }}Len++] = _b;
      if ({{ id }}Len < 4) continue;
      uint16_t _n = 4 + ({{ id }}Buf[2] << 8 | {{ id }}Buf[3]);
      if (_n < 16 || _n > sizeof({{ id }}Buf)) { {{ id }}Len = 0; continue; }
      if ({{ id }}Len < _n) continue;
      uint16_t _sum = 0;
      for (uint16_t _i = 0; _i + 2 < _n; _i++) _sum += {{ id }}Buf[_i];
      if (_sum == ({{ id }}Buf[_n - 2] << 8 | {{ id }}Buf[_n - 1])) {
        {{ id }}Pm1 = {{ id }}Buf[10] << 8 | {{ id }}Buf[11];
        {{ id }}Pm25 = {{ id }}Buf[12] << 8 | {{ id }}Buf[13];
        {{ id }}Pm10 = {{ id }}Buf[14] << 8 | {{ id }}Buf[15];
      }
      {{ id }}Len = 0;
    }
  fields:
    - name: "{{ id }}_pm1_0"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}Pm1"
      ha_device_class: pm1
      ha_unit: "µg/m³"
      ha_state_class: measurement
    - name: "{{ id }}_pm2_5"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}Pm25"
      ha_device_class: pm25
      ha_unit: "µg/m³"
      ha_state_class: measurement
    - name: "{{ id }}_pm10"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}Pm10"
      ha_device_class: pm10
      ha_unit: "µg/m³"
      ha_state_class: measurement
params_schema:
  type:
    type: string
    enum: [PMSX003, PMS5003T, PMS5003ST, PMS5003S]
    default: PMSX003
    description: "T/ST variants add temperature+humidity, S/ST add formaldehyde."

notes: |
  Laser-scatter particle counter, the sensor inside most DIY AQI
  boxes. 5V fan, 3.3V UART at 9600 baud. The fan wears out over a few
  years of continuous duty -- tie SET low or use ESPHome's
  update_interval sleep support to duty-cycle it outdoors. Give the
  inlet/outlet clearance in the enclosure; recirculated air reads low.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x08
  footprint: Connector_PinHeader_1.27mm:PinHeader_1x08_P1.27mm_Vertical
  value: PMS5003
