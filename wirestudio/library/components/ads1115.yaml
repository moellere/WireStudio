id: ads1115
name: ADS1115 4-channel 16-bit ADC hub (I2C)
category: sensor
use_cases: [adc, analog_in, voltage, current_sense]
aliases: ["ads1015", "ti adc", "external adc"]

electrical:
  vcc_min: 2.0
  vcc_max: 5.5
  current_ma_typical: 1
  current_ma_peak: 2
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    ads1115:
      - id: {{ id }}_hub
        address: "{{ params.address | default('0x48') }}"
        i2c_id: {{ bus.id }}
    {%- if params.continuous_mode is defined %}
        continuous_mode: {{ params.continuous_mode | tojson }}
    {%- endif %}

circuitpython:
  imports: ["from adafruit_ads1x15.ads1115 import ADS1115", "from adafruit_ads1x15.analog_in import AnalogIn"]
  deps: [adafruit_ads1x15, adafruit_bus_device]
  setup: |
    {{ id }} = ADS1115({{ bus_var }}, address={{ params.address | default('0x48') }})
    def {{ id }}_read(positive, negative=None):
        return AnalogIn({{ id }}, positive, negative).voltage

micropython:
  imports: ["from ads1x15 import ADS1115"]
  deps: ["github:robert-hh/ads1x15/ads1x15.py"]
  setup: |
    {{ id }} = ADS1115({{ bus_var }}, address={{ params.address | default('0x48') }}, gain=1)
    def {{ id }}_read(channel1, channel2=None):
        return {{ id }}.raw_to_v({{ id }}.read(4, channel1, channel2))

params_schema:
  address:
    type: string
    enum: ["0x48", "0x49", "0x4A", "0x4B"]
    default: "0x48"
    description: "ADDR pin: GND=0x48, VDD=0x49, SDA=0x4A, SCL=0x4B"
  continuous_mode:
    type: boolean
    description: "Continuous conversion vs single-shot. Continuous wakes the chip on every sample."

notes: |
  Hub-only component. Each logical analog reading is a separate
  `ads1115_channel` instance pointing at this hub via a HUB connection
  -- that lets each channel have its own gain, update_interval, and
  inspector row instead of being buried inside a `channels` array
  param. ADDR pin selects between four bus addresses; pull it to
  GND/VDD/SDA/SCL for 0x48/0x49/0x4A/0x4B respectively. 4-channel
  16-bit ADC over I2C; rescues ESP32 designs from the ADC2/WiFi
  conflict and gives ESP8266 a wider dynamic range than its 10-bit ADC.
# KiCad symbol mapping (0.9 schematic export). Hub-only -- ads1115_channel
# instances reference this hub via a kind:component target, no separate
# symbol per channel.
kicad:
  symbol_lib: Analog_ADC
  symbol: ADS1115IDGS
  footprint: Package_SO:MSOP-10_3x3mm_P0.5mm
  pin_map:
    VCC: VDD

# Hub: the channels on it read through `<id>Read(mux, gain)`, mux being the
# multiplexer's index (A0_GND..A3_GND 0-3, then A0_A1, A0_A3, A1_A3, A2_A3).
lorawan:
  lib_deps: ["adafruit/Adafruit ADS1X15@^2.5.0"]
  requires: [i2c]
  globals: |
    #include <Adafruit_ADS1X15.h>
    Adafruit_ADS1115 {{ id }}Ads;
    bool {{ id }}Ok = false;
    float {{ id }}Read(uint8_t mux, adsGain_t gain) {
      if (!{{ id }}Ok) return 0;
      {{ id }}Ads.setGain(gain);
      int16_t raw;
      switch (mux) {
        case 4: raw = {{ id }}Ads.readADC_Differential_0_1(); break;
        case 5: raw = {{ id }}Ads.readADC_Differential_0_3(); break;
        case 6: raw = {{ id }}Ads.readADC_Differential_1_3(); break;
        case 7: raw = {{ id }}Ads.readADC_Differential_2_3(); break;
        default: raw = {{ id }}Ads.readADC_SingleEnded(mux); break;
      }
      return {{ id }}Ads.computeVolts(raw);
    }
  setup: |
    {{ id }}Ok = {{ id }}Ads.begin({{ params.address | default('0x48') }}, &Wire);
