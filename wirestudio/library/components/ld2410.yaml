id: ld2410
name: Hi-Link LD2410 24GHz mmWave presence sensor (UART)
category: binary_sensor
use_cases: [presence, occupancy, motion, distance, still_detection]
aliases: [ld2410b, ld2410c, hlk-ld2410]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 80
  current_ma_peak: 120
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: TX, kind: uart_tx, voltage: 3.3}
    - {role: RX, kind: uart_rx, voltage: 3.3}
    - {role: OUT, kind: digital_in, voltage: 3.3, driven: true}
  passives:
    - {kind: capacitor, value: "10uF", between: [VCC, GND], purpose: bulk decoupling}

esphome:
  required_components: [uart]
  yaml_template: |
    ld2410:
      uart_id: {{ bus.id }}
      id: {{ id }}
    binary_sensor:
      - platform: ld2410
        has_target:
          name: "{{ label }} Presence"
        has_moving_target:
          name: "{{ label }} Moving Target"
        has_still_target:
          name: "{{ label }} Still Target"
    sensor:
      - platform: ld2410
        moving_distance:
          name: "{{ label }} Moving Distance"
        still_distance:
          name: "{{ label }} Still Distance"
        detection_distance:
          name: "{{ label }} Detection Distance"

capability:
  role: input
  provides:
    - {event: on_press}
    - {event: on_release}
  checks:
    - {predicate: is_on,  esphome: binary_sensor.is_on}
    - {predicate: is_off, esphome: binary_sensor.is_off}

tasmota:
  bus:
    tx: LD2410_TX
    rx: LD2410_RX

# Datasheet report frame: F4 F3 F2 F1, a little-endian length, the data
# (type, 0xAA, target state, moving distance and energy, still distance
# and energy, ...) and F8 F7 F6 F5.
circuitpython:
  setup: |
    def {{ id }}_decode(buf):
        found = None
        i = buf.find(b"\xf4\xf3\xf2\xf1")
        while 0 <= i and i + 6 <= len(buf):
            n = buf[i + 4] | buf[i + 5] << 8
            d = buf[i + 6:i + 6 + n]
            if len(d) == n >= 13 and buf[i + 6 + n:i + 10 + n] == b"\xf8\xf7\xf6\xf5" \
                    and d[0] in (1, 2) and d[1] == 0xAA:
                found = (d[2], d[3] | d[4] << 8, d[5], d[6] | d[7] << 8, d[8])
            i = buf.find(b"\xf4\xf3\xf2\xf1", i + 4)
        return found
    def {{ id }}_listen(seconds):
        {{ bus_var }}.reset_input_buffer()
        buf = b""
        until = time.monotonic() + seconds
        while time.monotonic() < until:
            n = {{ bus_var }}.in_waiting
            if n:
                buf += {{ bus_var }}.read(n)
        return buf
  loop: |
    {{ id }}_target = {{ id }}_decode({{ id }}_listen(0.5))
    if {{ id }}_target:
        print("{{ label }}: %s, moving %d cm, still %d cm" % (("none", "moving", "still", "moving and still")[{{ id }}_target[0] & 3], {{ id }}_target[1], {{ id }}_target[3]))

micropython:
  setup: |
    def {{ id }}_decode(buf):
        found = None
        i = buf.find(b"\xf4\xf3\xf2\xf1")
        while 0 <= i and i + 6 <= len(buf):
            n = buf[i + 4] | buf[i + 5] << 8
            d = buf[i + 6:i + 6 + n]
            if len(d) == n >= 13 and buf[i + 6 + n:i + 10 + n] == b"\xf8\xf7\xf6\xf5" \
                    and d[0] in (1, 2) and d[1] == 0xAA:
                found = (d[2], d[3] | d[4] << 8, d[5], d[6] | d[7] << 8, d[8])
            i = buf.find(b"\xf4\xf3\xf2\xf1", i + 4)
        return found
    def {{ id }}_listen(seconds):
        {{ bus_var }}.read()
        buf = b""
        until = time.ticks_add(time.ticks_ms(), int(seconds * 1000))
        while time.ticks_diff(until, time.ticks_ms()) > 0:
            buf += {{ bus_var }}.read() or b""
            time.sleep_ms(20)
        return buf
  loop: |
    {{ id }}_target = {{ id }}_decode({{ id }}_listen(0.5))
    if {{ id }}_target:
        print("{{ label }}: %s, moving %d cm, still %d cm" % (("none", "moving", "still", "moving and still")[{{ id }}_target[0] & 3], {{ id }}_target[1], {{ id }}_target[3]))

lorawan:
  requires: [uart]
  globals: |
    HardwareSerial {{ id }}Serial({{ serial }});
    uint8_t {{ id }}Buf[64];
    uint8_t {{ id }}Len = 0;
    uint8_t {{ id }}Target = 0;
    uint16_t {{ id }}MovingCm = 0, {{ id }}StillCm = 0;
  setup: |
    {{ id }}Serial.begin({{ bus.baud if bus and bus.baud else 256000 }}, SERIAL_8N1, {{ bus.rx if bus and bus.rx is not none else -1 }}, {{ bus.tx if bus and bus.tx is not none else -1 }});
  loop: |
    // Report frames: F4 F3 F2 F1, length (LE), data, F8 F7 F6 F5.
    {
      static const uint8_t _head[4] = {0xF4, 0xF3, 0xF2, 0xF1};
      static const uint8_t _tail[4] = {0xF8, 0xF7, 0xF6, 0xF5};
      while ({{ id }}Serial.available()) {
        uint8_t _b = {{ id }}Serial.read();
        if ({{ id }}Len < 4) {
          if (_b == _head[{{ id }}Len]) {{ id }}Buf[{{ id }}Len++] = _b;
          else {{ id }}Len = _b == _head[0] ? 1 : 0;
          continue;
        }
        {{ id }}Buf[{{ id }}Len++] = _b;
        if ({{ id }}Len < 6) continue;
        uint16_t _n = {{ id }}Buf[4] | {{ id }}Buf[5] << 8;
        if (10 + _n > sizeof({{ id }}Buf)) { {{ id }}Len = 0; continue; }
        if ({{ id }}Len < 10 + _n) continue;
        const uint8_t* _d = {{ id }}Buf + 6;
        if (memcmp(_d + _n, _tail, 4) == 0 && _n >= 13 && (_d[0] == 1 || _d[0] == 2) && _d[1] == 0xAA) {
          {{ id }}Target = _d[2];
          {{ id }}MovingCm = _d[3] | _d[4] << 8;
          {{ id }}StillCm = _d[6] | _d[7] << 8;
        }
        {{ id }}Len = 0;
      }
    }
  fields:
    - name: "{{ id }}_target"
      bytes: 1
      cpp_type: uint8_t
      cpp_expr: "{{ id }}Target"
      ha_icon: mdi:motion-sensor
    - name: "{{ id }}_moving_cm"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}MovingCm"
      ha_device_class: distance
      ha_unit: "cm"
      ha_state_class: measurement
    - name: "{{ id }}_still_cm"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}StillCm"
      ha_device_class: distance
      ha_unit: "cm"
      ha_state_class: measurement
params_schema:
  throttle:
    type: string
    description: "Minimum interval between distance/energy updates (e.g. '2s') to calm the log."

notes: |
  The mmWave that made still-presence detection mainstream: detects a
  motionless person by micro-motion out to ~5m through plastic. UART
  runs at 256000 baud -- set the bus accordingly. Wire module TX to MCU
  RX and vice versa. The OUT pin mirrors presence as a plain digital
  signal if you want a wire fallback; the UART integration is richer
  (per-gate energies, distances, engineering mode). One ld2410 hub per
  device. Sister ld2420 has its own library entry.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x05
  footprint: Connector_PinHeader_1.27mm:PinHeader_1x05_P1.27mm_Vertical
  value: LD2410
