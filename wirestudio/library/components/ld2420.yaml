id: ld2420
name: Hi-Link LD2420 24GHz mmWave presence sensor
category: binary_sensor
use_cases: [presence, occupancy, motion, distance]
aliases: [ld2412, hlk-ld2420]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 65
  current_ma_peak: 90
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: TX,  kind: uart_tx, voltage: 3.3}
    - {role: RX,  kind: uart_rx, voltage: 3.3}
    # OT2 (digital target presence) pin exists on the module but the
    # ESPHome integration drives everything over UART; omit for 0.1.
  passives:
    - {kind: capacitor, value: "10uF", between: [VCC, GND], purpose: bulk decoupling}

esphome:
  required_components: [uart]
  yaml_template: |
    ld2420:
      uart_id: {{ bus.id }}
      id: {{ id }}
    binary_sensor:
      - platform: ld2420
        has_target:
          name: "{{ label }} Presence"
          device_class: presence
    sensor:
      - platform: ld2420
        moving_distance:
          name: "{{ label }} Moving Distance"

# Module output, as ESPHome's ld2420 reads it: in simple mode text lines
# "ON" / "OFF" and "Range <cm>", in energy mode F4 F3 F2 F1 frames with a
# little-endian length, presence, distance and gate energies, F8 F7 F6 F5.
circuitpython:
  setup: |
    def {{ id }}_listen(seconds):
        {{ bus_var }}.reset_input_buffer()
        buf = b""
        until = time.monotonic() + seconds
        while time.monotonic() < until:
            n = {{ bus_var }}.in_waiting
            if n:
                buf += {{ bus_var }}.read(n)
        return buf
    def {{ id }}_decode(buf):
        found = None
        i = buf.find(b"\xf4\xf3\xf2\xf1")
        while 0 <= i and i + 6 <= len(buf):
            n = buf[i + 4] | buf[i + 5] << 8
            d = buf[i + 6:i + 6 + n]
            if len(d) == n >= 3 and buf[i + 6 + n:i + 10 + n] == b"\xf8\xf7\xf6\xf5":
                found = (d[0] != 0, d[1] | d[2] << 8)
            i = buf.find(b"\xf4\xf3\xf2\xf1", i + 4)
        presence = distance = None
        for line in buf.split(b"\r\n"):
            if line == b"ON":
                presence = True
            elif line == b"OFF":
                presence = False
            elif line.startswith(b"Range "):
                try:
                    distance = int(line[6:].decode())
                except (UnicodeError, ValueError):
                    pass
        if presence is not None or distance is not None:
            found = (presence, distance)
        return found
  loop: |
    {{ id }}_state = {{ id }}_decode({{ id }}_listen(0.5))
    if {{ id }}_state:
        print("{{ label }}: %s, %s" % ({None: "?", True: "present", False: "clear"}[{{ id }}_state[0]], "?" if {{ id }}_state[1] is None else "%d cm" % {{ id }}_state[1]))

micropython:
  setup: |
    def {{ id }}_listen(seconds):
        {{ bus_var }}.read()
        buf = b""
        until = time.ticks_add(time.ticks_ms(), int(seconds * 1000))
        while time.ticks_diff(until, time.ticks_ms()) > 0:
            buf += {{ bus_var }}.read() or b""
            time.sleep_ms(20)
        return buf
    def {{ id }}_decode(buf):
        found = None
        i = buf.find(b"\xf4\xf3\xf2\xf1")
        while 0 <= i and i + 6 <= len(buf):
            n = buf[i + 4] | buf[i + 5] << 8
            d = buf[i + 6:i + 6 + n]
            if len(d) == n >= 3 and buf[i + 6 + n:i + 10 + n] == b"\xf8\xf7\xf6\xf5":
                found = (d[0] != 0, d[1] | d[2] << 8)
            i = buf.find(b"\xf4\xf3\xf2\xf1", i + 4)
        presence = distance = None
        for line in buf.split(b"\r\n"):
            if line == b"ON":
                presence = True
            elif line == b"OFF":
                presence = False
            elif line.startswith(b"Range "):
                try:
                    distance = int(line[6:].decode())
                except (UnicodeError, ValueError):
                    pass
        if presence is not None or distance is not None:
            found = (presence, distance)
        return found
  loop: |
    {{ id }}_state = {{ id }}_decode({{ id }}_listen(0.5))
    if {{ id }}_state:
        print("{{ label }}: %s, %s" % ({None: "?", True: "present", False: "clear"}[{{ id }}_state[0]], "?" if {{ id }}_state[1] is None else "%d cm" % {{ id }}_state[1]))

lorawan:
  requires: [uart]
  globals: |
    HardwareSerial {{ id }}Serial({{ serial }});
    uint8_t {{ id }}Buf[64];
    uint8_t {{ id }}Len = 0;
    char {{ id }}Line[16];
    uint8_t {{ id }}LineLen = 0;
    uint8_t {{ id }}Presence = 0;
    uint16_t {{ id }}DistanceCm = 0;
  setup: |
    {{ id }}Serial.begin({{ bus.baud if bus and bus.baud else 115200 }}, SERIAL_8N1, {{ bus.rx if bus and bus.rx is not none else -1 }}, {{ bus.tx if bus and bus.tx is not none else -1 }});
  loop: |
    // Two firmware dialects: text lines ("ON", "OFF", "Range 123") or the
    // binary frame F4 F3 F2 F1, length (LE), presence, distance, F8 F7 F6 F5.
    {
      static const uint8_t _head[4] = {0xF4, 0xF3, 0xF2, 0xF1};
      static const uint8_t _tail[4] = {0xF8, 0xF7, 0xF6, 0xF5};
      while ({{ id }}Serial.available()) {
        uint8_t _b = {{ id }}Serial.read();
        if (_b == '\n') {
          if ({{ id }}LineLen && {{ id }}Line[{{ id }}LineLen - 1] == '\r') {{ id }}LineLen--;
          {{ id }}Line[{{ id }}LineLen] = 0;
          if (strcmp({{ id }}Line, "ON") == 0) {{ id }}Presence = 1;
          else if (strcmp({{ id }}Line, "OFF") == 0) {{ id }}Presence = 0;
          else if (strncmp({{ id }}Line, "Range ", 6) == 0 && isdigit((unsigned char){{ id }}Line[6]))
            {{ id }}DistanceCm = (uint16_t)atoi({{ id }}Line + 6);
          {{ id }}LineLen = 0;
        } else if ({{ id }}LineLen < sizeof({{ id }}Line) - 1) {
          {{ id }}Line[{{ id }}LineLen++] = (char)_b;
        } else {
          {{ id }}LineLen = 0;
        }
        if ({{ id }}Len < 4) {
          if (_b == _head[{{ id }}Len]) {{ id }}Buf[{{ id }}Len++] = _b;
          else {{ id }}Len = _b == _head[0] ? 1 : 0;
          continue;
        }
        {{ id }}Buf[{{ id }}Len++] = _b;
        if ({{ id }}Len < 6) continue;
        uint16_t _n = {{ id }}Buf[4] | {{ id }}Buf[5] << 8;
        if (10 + _n > sizeof({{ id }}Buf)) { {{ id }}Len = 0; continue; }
        if ({{ id }}Len < 10 + _n) continue;
        const uint8_t* _d = {{ id }}Buf + 6;
        if (memcmp(_d + _n, _tail, 4) == 0 && _n >= 3) {
          {{ id }}Presence = _d[0] != 0;
          {{ id }}DistanceCm = _d[1] | _d[2] << 8;
        }
        {{ id }}Len = 0;
      }
    }
  fields:
    - name: "{{ id }}_presence"
      bytes: 1
      cpp_type: uint8_t
      cpp_expr: "{{ id }}Presence"
      ha_device_class: occupancy
    - name: "{{ id }}_distance_cm"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}DistanceCm"
      ha_device_class: distance
      ha_unit: "cm"
      ha_state_class: measurement
params_schema:
  presence_timeout:
    type: integer
    description: "Seconds with no detection before clearing presence."
  min_gate_distance:
    type: integer
    minimum: 1
    maximum: 16
  max_gate_distance:
    type: integer
    minimum: 1
    maximum: 16

notes: "UART runs at 256000 baud (LD2420) or 256000/115200 (LD2410). Wire the module's TX to the MCU RX and vice versa. ESPHome's `ld2420` integration is a singleton -- one mmWave per device. The sister `ld2410` integration mirrors this template if you swap the platform name."
# KiCad symbol mapping (0.9). 24GHz radar presence sensor; standard
# 4-pin breakout (5V, GND, RX, TX).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: LD2420
