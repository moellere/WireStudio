id: xpt2046
name: XPT2046 resistive touchscreen controller (SPI)
category: touchscreen
use_cases: [touchscreen, dashboard_input, kiosk]
aliases: [ads7843, tsc2046]

electrical:
  vcc_min: 2.7
  vcc_max: 5.25
  current_ma_typical: 1
  current_ma_peak: 2
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - {role: SCK, kind: spi_clk}
  - {role: MOSI, kind: spi_mosi}
  - {role: MISO, kind: spi_miso}
  - {role: CS, kind: spi_cs, voltage: 3.3}
  - {role: IRQ, kind: digital_out, voltage: 3.3}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [spi]
  yaml_template: |
    touchscreen:
      platform: xpt2046
      id: {{ id }}
      cs_pin: {{ pins.CS | tojson }}
      interrupt_pin: {{ pins.IRQ | tojson }}
      spi_id: {{ bus.id }}
    {%- if params.update_interval is defined %}
      update_interval: {{ params.update_interval }}
    {%- endif %}
    {%- if params.threshold is defined %}
      threshold: {{ params.threshold }}
    {%- endif %}
    {%- if params.transform is defined %}
      transform: {{ params.transform | tojson }}
    {%- endif %}
    {%- if params.calibration is defined %}
      calibration: {{ params.calibration | tojson }}
    {%- endif %}

# Datasheet protocol as ESPHome's xpt2046 runs it: each conversion is a
# control byte and two reads, the 12-bit result left-aligned after one
# busy bit. Pressure from Z1 and Z2 gates the reading; X and Y are the
# closest two of three samples averaged, after a discarded first X. The
# last X control byte powers the ADC down and re-arms PENIRQ. Values are
# raw; the panel's calibration maps them to screen coordinates.
circuitpython:
  imports: ["import digitalio"]
  setup: |
    {{ id }}_cs = digitalio.DigitalInOut(P({{ pins.CS }}))
    {{ id }}_cs.switch_to_output(value=True)
    {%- if pins.IRQ is defined %}
    {{ id }}_irq = digitalio.DigitalInOut(P({{ pins.IRQ }}))
    {{ id }}_irq.pull = digitalio.Pull.UP
    def {{ id }}_pen():
        return not {{ id }}_irq.value
    {%- else %}
    def {{ id }}_pen():
        return True
    {%- endif %}
    def {{ id }}_adc(ctrl):
        buf = bytearray(3)
        while not {{ bus_var }}.try_lock():
            pass
        try:
            {{ bus_var }}.configure(baudrate=2000000, polarity=0, phase=0)
            {{ id }}_cs.value = False
            {{ bus_var }}.write_readinto(bytes([ctrl, 0, 0]), buf)
            {{ id }}_cs.value = True
        finally:
            {{ bus_var }}.unlock()
        return (buf[1] << 8 | buf[2]) >> 3
    {{ id }}_threshold = {{ params.threshold | default(400) }}
    def {{ id }}_best_two(a, b, c):
        da, db, dc = abs(a - b), abs(a - c), abs(c - b)
        if da <= db and da <= dc:
            return (a + b) >> 1
        if db <= da and db <= dc:
            return (a + c) >> 1
        return (b + c) >> 1
    def {{ id }}_touch():
        if not {{ id }}_pen():
            return None
        z = {{ id }}_adc(0xB1) + 0xFFF - {{ id }}_adc(0xC1)
        if z < {{ id }}_threshold:
            {{ id }}_adc(0xD0)
            return None
        {{ id }}_adc(0xD1)
        d = [{{ id }}_adc(c) for c in (0x91, 0xD1, 0x91, 0xD1, 0x91, 0xD0)]
        return {{ id }}_best_two(d[1], d[3], d[5]), {{ id }}_best_two(d[0], d[2], d[4]), z
    {{ id }}_adc(0xD0)
  loop: |
    {{ id }}_point = {{ id }}_touch()
    if {{ id }}_point:
        print("{{ label }}: x %d y %d z %d" % {{ id }}_point)

micropython:
  setup: |
    {{ id }}_cs = Pin({{ pins.CS }}, Pin.OUT, value=1)
    {%- if pins.IRQ is defined %}
    {{ id }}_irq = Pin({{ pins.IRQ }}, Pin.IN, Pin.PULL_UP)
    def {{ id }}_pen():
        return not {{ id }}_irq()
    {%- else %}
    def {{ id }}_pen():
        return True
    {%- endif %}
    def {{ id }}_adc(ctrl):
        buf = bytearray(3)
        {{ id }}_cs(0)
        {{ bus_var }}.write_readinto(bytes([ctrl, 0, 0]), buf)
        {{ id }}_cs(1)
        return (buf[1] << 8 | buf[2]) >> 3
    {{ id }}_threshold = {{ params.threshold | default(400) }}
    def {{ id }}_best_two(a, b, c):
        da, db, dc = abs(a - b), abs(a - c), abs(c - b)
        if da <= db and da <= dc:
            return (a + b) >> 1
        if db <= da and db <= dc:
            return (a + c) >> 1
        return (b + c) >> 1
    def {{ id }}_touch():
        if not {{ id }}_pen():
            return None
        z = {{ id }}_adc(0xB1) + 0xFFF - {{ id }}_adc(0xC1)
        if z < {{ id }}_threshold:
            {{ id }}_adc(0xD0)
            return None
        {{ id }}_adc(0xD1)
        d = [{{ id }}_adc(c) for c in (0x91, 0xD1, 0x91, 0xD1, 0x91, 0xD0)]
        return {{ id }}_best_two(d[1], d[3], d[5]), {{ id }}_best_two(d[0], d[2], d[4]), z
    {{ id }}_adc(0xD0)
  loop: |
    {{ id }}_point = {{ id }}_touch()
    if {{ id }}_point:
        print("{{ label }}: x %d y %d z %d" % {{ id }}_point)

params_schema:
  update_interval:
    type: string
    default: "50ms"
  threshold:
    type: integer
    default: 400
  transform:
    type: object
    description: "{ swap_xy: bool, mirror_x: bool, mirror_y: bool }"
  calibration:
    type: object
    description: "{ x_min: int, x_max: int, y_min: int, y_max: int } -- raw ADC values for the four corners
      of the touch panel."

notes: "Lives on a typical 3.5\" Pi-style display alongside the ILI9486 panel and shares the same SPI
  bus with its own CS. Calibration values vary panel-to-panel: log raw values in a lambda for one device
  of each model, then bake them into the library entry's params_schema defaults. The interrupt pin should
  support edge interrupts (avoid ESP8266 GPIO16)."
# KiCad symbol mapping (0.9). Resistive touch controller; 5-pin SPI
# breakout (VCC, GND, CLK, MOSI, MISO with optional CS, IRQ, T_DO).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x07
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x07_P2.54mm_Vertical
  value: XPT2046
