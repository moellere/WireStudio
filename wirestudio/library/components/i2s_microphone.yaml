id: i2s_microphone
name: I2S / PDM microphone (i2s_audio)
category: audio
use_cases: [microphone, voice, sound, audio_in]
aliases: [i2s_mic, pdm_mic, spm1423]

electrical:
  vcc_min: 1.8
  vcc_max: 3.6
  current_ma_typical: 2
  current_ma_peak: 5
  pins:
    - {role: WS,   kind: digital_out, voltage: 3.3}
    - {role: BCLK, kind: digital_out, voltage: 3.3}
    - {role: DIN,  kind: digital_in,  voltage: 3.3}
  passives: []

esphome:
  required_components: []
  yaml_template: |
    i2s_audio:
      - id: {{ id }}_bus
        i2s_lrclk_pin: {{ pins.WS | tojson }}
    {%- if pins.BCLK is defined %}
        i2s_bclk_pin: {{ pins.BCLK | tojson }}
    {%- endif %}
    microphone:
      - platform: i2s_audio
        id: {{ id }}
        i2s_audio_id: {{ id }}_bus
        i2s_din_pin: {{ pins.DIN | tojson }}
        adc_type: external
        pdm: {{ params.pdm | default(false) | tojson }}

# A level meter: record a tenth of a second at 16 kHz and print the RMS
# about the mean. CircuitPython's audio input is PDM only (audiobusio.PDMIn,
# WS as the PDM clock); MicroPython's machine.I2S has no PDM mode and reads
# a standard I2S mic's 24-bit samples from 32-bit slots. The mic takes I2S
# peripheral 1 so a speaker can keep 0.
circuitpython:
  imports: ["import array", "import audiobusio"]
  setup: |
    {%- if not params.pdm | default(false) %}{{ unsupported("CircuitPython has no I2S input; audiobusio.PDMIn reads PDM microphones only") }}{% endif %}
    {{ id }} = audiobusio.PDMIn(P({{ pins.WS }}), P({{ pins.DIN }}), sample_rate=16000, bit_depth=16)
    {{ id }}_n = 1600
    {{ id }}_buf = array.array("H", [0] * {{ id }}_n)
    def {{ id }}_level(samples):
        if not samples:
            return 0.0
        mean = sum(samples) / len(samples)
        return (sum((s - mean) ** 2 for s in samples) / len(samples)) ** 0.5
  loop: |
    {{ id }}.record({{ id }}_buf, {{ id }}_n)
    print("{{ label }}: level %.0f" % {{ id }}_level({{ id }}_buf))

micropython:
  imports: ["from machine import I2S"]
  setup: |
    {%- if params.pdm | default(false) %}{{ unsupported("machine.I2S has no PDM mode") }}{% endif %}
    {{ id }} = I2S(1, sck=Pin({{ pins.BCLK }}), ws=Pin({{ pins.WS }}), sd=Pin({{ pins.DIN }}), mode=I2S.RX,
                   bits=32, format=I2S.MONO, rate=16000, ibuf=12800)
    {{ id }}_buf = bytearray(6400)
    def {{ id }}_samples(raw, n):
        out = []
        for i in range(0, n - n % 4, 4):
            v = raw[i + 1] | raw[i + 2] << 8 | raw[i + 3] << 16
            out.append(v - (1 << 24) if v & 0x800000 else v)
        return out
    def {{ id }}_level(samples):
        if not samples:
            return 0.0
        mean = sum(samples) / len(samples)
        return (sum((s - mean) ** 2 for s in samples) / len(samples)) ** 0.5
  loop: |
    {{ id }}_got = {{ id }}.readinto({{ id }}_buf)
    print("{{ label }}: level %.0f" % {{ id }}_level({{ id }}_samples({{ id }}_buf, {{ id }}_got)))

params_schema:
  pdm:
    type: boolean
    default: false
    description: "true for a PDM mic (single clock + data, e.g. the Atom Echo/AtomU SPM1423); false for a standard I2S mic."

notes: |
  Microphone over the ESPHome `i2s_audio` bus. PDM mics (the M5Stack
  Atom Echo / AtomU SPM1423) use the WS pin as the PDM clock with no
  BCLK; set `pdm: true` and leave BCLK unconnected. Standard I2S mics
  wire WS + BCLK + DIN. The speaker side of a combo board (e.g. the
  Echo's NS4168 amp) is a separate component.
# KiCad: generic 3-pin header for the I2S signal lines (WS/BCLK/DIN);
# no stock symbol for these MEMS mic breakouts.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x03
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical
  value: I2S microphone
# A PDM mic's clock goes on I2S_WS, as Tasmota's audio driver reads it.
tasmota:
  pins: {WS: I2S_WS, BCLK: I2S_BCLK, DIN: I2S_DIN}

# The ESP32 release already compiles audioreactive in; the override
# repeats its flags for the chips whose environment does not.
wled:
  kind: usermod
  usermod: audioreactive
  define: USERMOD_AUDIOREACTIVE
  build_flags: ["-D sqrt_internal=sqrtf"]
  lib_deps: ["kosme/arduinoFFT @ 2.0.1"]
  pin_defines: {DIN: I2S_SDPIN, WS: I2S_WSPIN, BCLK: I2S_CKPIN}
  param_defines:
    pdm: {define: SR_DMTYPE, values: {"True": 5, "False": 1}}
  um_name: AudioReactive
  um: {enabled: true}
