id: sht3xd
name: Sensirion SHT3x / SHT4x temperature + humidity (I2C)
category: sensor
use_cases: [temperature, humidity, weather, climate]
aliases: ["sht30", "sht31", "sht35", "sht40", "sht41", "sht45"]

electrical:
  vcc_min: 2.15
  vcc_max: 5.5
  current_ma_typical: 0.6
  current_ma_peak: 1.5
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: sht3xd
        i2c_id: {{ bus.id }}
        address: "{{ params.address | default('0x44') }}"
        update_interval: {{ params.update_interval | default('60s') }}
        temperature:
          id: {{ id }}_temperature
          name: "{{ label }} Temperature"
    {%- if params.temperature_on_value is defined %}
          on_value: {{ params.temperature_on_value | tojson }}
    {%- endif %}
    {%- if params.temperature_on_value_range is defined %}
          on_value_range: {{ params.temperature_on_value_range | tojson }}
    {%- endif %}
        humidity:
          id: {{ id }}_humidity
          name: "{{ label }} Humidity"
    {%- if params.humidity_on_value is defined %}
          on_value: {{ params.humidity_on_value | tojson }}
    {%- endif %}
    {%- if params.humidity_on_value_range is defined %}
          on_value_range: {{ params.humidity_on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value, channel: temperature}
    - {event: on_value_range, kind: event, channel: temperature}
    - {event: on_value, kind: value, channel: humidity}
    - {event: on_value_range, kind: event, channel: humidity}

circuitpython:
  imports: ["import adafruit_sht31d"]
  deps: [adafruit_sht31d, adafruit_bus_device]
  setup: |
    {{ id }} = adafruit_sht31d.SHT31D({{ bus_var }}, address={{ params.address | default('0x44') }})
  loop: |
    print("{{ label }}: %.1fC %.0f%%" % ({{ id }}.temperature, {{ id }}.relative_humidity))

micropython:
  imports: ["from sht31 import SHT31"]
  deps: ["github:kfricke/micropython-sht31/sht31.py"]
  setup: |
    {{ id }} = SHT31({{ bus_var }}, addr={{ params.address | default('0x44') }})
  loop: |
    print("{{ label }}: %.1fC %.0f%%" % {{ id }}.get_temp_humi())

params_schema:
  address:
    type: string
    enum: ["0x44", "0x45"]
    default: "0x44"
    description: "ADDR pin: GND=0x44 (default), VDD=0x45"
  update_interval:
    type: string
    default: "60s"

notes: |
  Sensirion's modern T/H family. SHT3x = ±0.3°C / ±2% RH (the default
  pick for new projects); SHT4x is pin-compatible and uses the same
  ESPHome platform. Wide supply range (2.15-5.5V) and handles 5V tolerant
  I2C, so it's the easiest swap-in for an Arduino Uno.
# KiCad symbol mapping. SHT3x uses the SHT31 footprint family.
kicad:
  symbol_lib: Sensor_Humidity
  symbol: SHT31-DIS
  footprint: Package_DFN_QFN:DFN-8-1EP_3x3mm_P0.5mm_EP1.65x2.38mm
  value: SHT3xD
  pin_map:
    VCC: VDD
    GND: VSS

wled:
  kind: usermod
  usermod: sht
  define: USERMOD_SHT
  lib_deps: ["robtillaart/SHT85@~0.3.3"]
  um_name: SHT-Sensor
  um: {Enabled: true, SHT-Type: 0, Unit: 0}

lorawan:
  lib_deps: ["adafruit/Adafruit SHT31 Library@^2.2.2"]
  requires: [i2c]
  globals: |
    #include <Adafruit_SHT31.h>
    Adafruit_SHT31 sht3x(&Wire);
    bool sht3xOk = false;
    float sht3xTempC = 0, sht3xHum = 0;
  setup: |
    sht3xOk = sht3x.begin({{ params.address | default('0x44') }});
  loop: |
    if (sht3xOk) {
      float _t = sht3x.readTemperature(), _h = sht3x.readHumidity();
      if (!isnan(_t)) sht3xTempC = _t;
      if (!isnan(_h)) sht3xHum = _h;
    }
  fields:
    - name: sht3x_temp_c
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(sht3xTempC * 100.0)
      signed: true
      scale: 100.0
      ha_device_class: temperature
      ha_unit: "°C"
      ha_state_class: measurement
    - name: sht3x_humidity
      bytes: 1
      cpp_type: uint8_t
      cpp_expr: (uint8_t)(sht3xHum + 0.5)
      ha_device_class: humidity
      ha_unit: "%"
      ha_state_class: measurement
