id: max31855
name: MAX31855 thermocouple amplifier (SPI, K-type)
category: sensor
use_cases: [temperature, thermocouple, high_temperature, hot]
aliases: ["k-type", "max6675", "kiln"]

electrical:
  vcc_min: 3.0
  vcc_max: 3.6
  current_ma_typical: 1.5
  current_ma_peak: 2
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - {role: CLK, kind: spi_clk}
  - {role: MISO, kind: spi_miso}
  - {role: CS, kind: spi_cs}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}
  - {kind: capacitor, value: "10nF", between: [T+, T-], purpose: "thermocouple noise filter (optional)"}

esphome:
  required_components: [spi]
  yaml_template: |
    sensor:
      - platform: max31855
        spi_id: {{ bus.id }}
        cs_pin: {{ pins.CS | tojson }}
        name: "{{ label }} Thermocouple"
        update_interval: {{ params.update_interval | default('60s') }}
    {%- if params.reference_temperature is defined %}
        reference_temperature:
          name: "{{ label }} Cold Junction"
    {%- endif %}
    {%- if params.on_value is defined %}
        on_value: {{ params.on_value | tojson }}
    {%- endif %}
    {%- if params.on_value_range is defined %}
        on_value_range: {{ params.on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}
    - {event: on_value_range, kind: event}

circuitpython:
  imports: ["import digitalio", "import adafruit_max31855"]
  deps: [adafruit_max31855]
  setup: |
    {{ id }}_cs = digitalio.DigitalInOut(P({{ pins.CS }}))
    {{ id }} = adafruit_max31855.MAX31855({{ bus_var }}, {{ id }}_cs)
  loop: |
    print("{{ label }}: %.1fC" % {{ id }}.temperature)

# Datasheet register code: one 32-bit read; D16 is the fault bit,
# D31..D18 the temperature, 14-bit signed, 0.25C a step.
micropython:
  setup: |
    {{ id }}_cs = Pin({{ pins.CS }}, Pin.OUT, value=1)
    def {{ id }}_read():
        {{ id }}_cs(0)
        raw = {{ bus_var }}.read(4)
        {{ id }}_cs(1)
        v = int.from_bytes(raw, "big")
        if v & 0x10000:
            return None
        t = v >> 18
        if t & 0x2000:
            t -= 0x4000
        return t * 0.25
  loop: |
    {{ id }}_t = {{ id }}_read()
    print("{{ label }}: %s" % ("fault" if {{ id }}_t is None else "%.2fC" % {{ id }}_t))

lorawan:
  requires: [spi]
  globals: |
    int16_t {{ id }}Quarters = 0;  // degrees C x 4
  setup: |
    pinMode({{ pins.CS }}, OUTPUT);
    digitalWrite({{ pins.CS }}, HIGH);
    SPI.begin({{ radio_spi.clk }}, {{ radio_spi.miso }}, {{ radio_spi.mosi }});  // the radio's bus; RadioLib keeps it
  loop: |
    {
      static unsigned long _last = 0;
      if (_last == 0 || millis() - _last >= 1000) {
        _last = millis();
        SPI.beginTransaction(SPISettings(4000000, MSBFIRST, SPI_MODE0));
        digitalWrite({{ pins.CS }}, LOW);
        uint32_t _v = (uint32_t)SPI.transfer(0) << 24;
        _v |= (uint32_t)SPI.transfer(0) << 16;
        _v |= (uint32_t)SPI.transfer(0) << 8;
        _v |= SPI.transfer(0);
        digitalWrite({{ pins.CS }}, HIGH);
        SPI.endTransaction();
        if (!(_v & 0x10000)) {  // bit 16: thermocouple fault
          int16_t _t = (int16_t)(_v >> 18);
          if (_t & 0x2000) _t -= 0x4000;
          {{ id }}Quarters = _t;
        }
      }
    }
  fields:
    - name: "{{ id }}_temp_c"
      bytes: 2
      cpp_type: int16_t
      cpp_expr: "{{ id }}Quarters"
      signed: true
      scale: 4.0
      ha_device_class: temperature
      ha_unit: "°C"
      ha_state_class: measurement
params_schema:
  update_interval:
    type: string
    default: "60s"
  reference_temperature:
    type: boolean
    description: "Also publish the cold-junction (board) temperature reading"

notes: |
  K-type thermocouple amp on SPI. Read-only -- no MOSI line, just CLK,
  CS, and MISO. Range -270 to +1372°C with 0.25°C resolution; great
  for kilns, smokers, espresso boilers. The cold-junction temperature
  (the chip's own die, used for compensation) can also be published
  via `reference_temperature: true`. 3.3V only -- a 5V MCU needs a
  level shifter on the SPI lines. Keep the thermocouple wires twisted
  and the optional 10nF noise cap close to the screw terminals.
# KiCad symbol mapping (0.9 schematic export).
kicad:
  symbol_lib: Sensor_Temperature
  symbol: MAX31855KASA
  footprint: Package_SO:SOIC-8_3.9x4.9mm_P1.27mm
  pin_map:
    VCC: V_CC
    CLK: SCK
    MISO: SO
    CS: ~{CS}
tasmota:
  pins: {CS: MAX31855_CS}
  bus: {clk: MAX31855_CLK, miso: MAX31855_DO}
