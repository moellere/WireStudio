id: max98357a
name: Maxim MAX98357A I2S Class-D mono amp + DAC
category: audio_dac
use_cases: [audio_output, media_player, speaker_driver]
aliases: [pcm5102, generic_i2s_dac]

electrical:
  vcc_min: 2.5
  vcc_max: 5.5
  current_ma_typical: 50
  current_ma_peak: 1400
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - {role: LRCLK, kind: i2s_lrclk}
  - {role: BCLK, kind: i2s_bclk}
  - {role: DIN, kind: i2s_dout, voltage: 3.3}
  - {role: SD, kind: digital_in, voltage: 3.3}
  - {role: GAIN, kind: analog_in, voltage: 3.3}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}
  - {kind: capacitor, value: "10uF", between: [VCC, GND], purpose: bulk decoupling}

esphome:
  required_components: [i2s_audio]
  # ESPHome 2026.x removed the i2s_audio media_player; the replacement
  # is an i2s_audio speaker wrapped by the speaker media_player, whose
  # announcement_pipeline is the one required key.
  yaml_template: |
    speaker:
      - platform: i2s_audio
        id: {{ id }}_spk
        dac_type: external
        i2s_dout_pin: {{ pins.DIN | tojson }}
        channel: {{ params.mode | default('mono') }}
    media_player:
      - platform: speaker
        name: "{{ label }}"
        id: {{ id }}
        announcement_pipeline:
          speaker: {{ id }}_spk
          num_channels: {{ 2 if params.mode | default('mono') == 'stereo' else 1 }}

# A half-second 444 Hz tone at start-up (36 samples a cycle at 16 kHz)
# proves the wiring; the chip mixes or picks a channel by its SD level, so
# one mono stream suits every mode. SD, when wired, is driven high to
# leave shutdown.
circuitpython:
  imports: ["import array", "import math", "import audiobusio", "import audiocore", "import digitalio"]
  setup: |
    {%- if pins.SD is defined %}
    {{ id }}_sd = digitalio.DigitalInOut(P({{ pins.SD }}))
    {{ id }}_sd.switch_to_output(value=True)
    {%- endif %}
    {{ id }} = audiobusio.I2SOut(P({{ pins.BCLK }}), P({{ pins.LRCLK }}), P({{ pins.DIN }}))
    {{ id }}_tone = [int(math.sin(2 * math.pi * k / 36) * 8000) for k in range(36)]
    {{ id }}_wave = audiocore.RawSample(array.array("h", {{ id }}_tone), sample_rate=16000)
    {{ id }}.play({{ id }}_wave, loop=True)
    time.sleep(0.5)
    {{ id }}.stop()

micropython:
  imports: ["import math", "from machine import I2S"]
  setup: |
    {%- if pins.SD is defined %}
    {{ id }}_sd = Pin({{ pins.SD }}, Pin.OUT, value=1)
    {%- endif %}
    {{ id }} = I2S(0, sck=Pin({{ pins.BCLK }}), ws=Pin({{ pins.LRCLK }}), sd=Pin({{ pins.DIN }}), mode=I2S.TX,
                   bits=16, format=I2S.MONO, rate=16000, ibuf=8000)
    {{ id }}_tone = [int(math.sin(2 * math.pi * k / 36) * 8000) for k in range(36)]
    {{ id }}_wave = bytes(b for s in {{ id }}_tone for b in (s & 0xFF, s >> 8 & 0xFF))
    for {{ id }}_n in range(222):
        {{ id }}.write({{ id }}_wave)

params_schema:
  mode: {type: string, enum: [mono, stereo, left, right], default: "mono"}

notes: "MAX98357A is mono Class-D. For stereo use two boards with one wired left, one right. DIN, BCLK,
  LRCLK come from the i2s_audio bus and i2s_dout_pin connection. SD pin (shutdown) is optional; tie high
  or omit for always-on. The speaker media_player decodes on-device; enable PSRAM on boards that have it
  for longer buffers."
# KiCad symbol mapping (0.9 schematic export). KiCad bundles MAX98357A
# in the Amplifier_Audio library for newer releases; older installs
# may need an alias or an external addon library.
kicad:
  symbol_lib: Audio
  symbol: MAX98357A
  footprint: Package_DFN_QFN:QFN-16-1EP_3x3mm_P0.5mm_EP1.7x1.7mm
  pin_map:
    VCC: VDD
    SD: ~{SD_MODE}
    GAIN: GAIN_SLOT
tasmota:
  pins: {DIN: I2S_DOUT}
  bus: {lrclk: I2S_WS, bclk: I2S_BCLK}
