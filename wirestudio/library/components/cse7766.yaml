id: cse7766
name: Chipsea CSE7766 AC power meter (UART, 4800 baud, EVEN parity)
category: sensor
use_cases: [power_metering, ac_voltage, ac_current, energy, smart_plug]
aliases: ["sonoff_pow", "athom_v2", "v9821", "bl0937_uart"]

electrical:
  vcc_min: 3.3
  vcc_max: 5.0
  current_ma_typical: 5
  current_ma_peak: 15
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    # The CSE7766 sends AC measurements one-way at 4800 8E1; the MCU only
    # listens. So the module's TX -> MCU RX. There is no MCU-to-module
    # data path on this chip.
    - {role: TX, kind: uart_tx, voltage: 3.3}
  passives:
    # The chip itself is on the high-voltage side via current shunt + voltage
    # divider; the only LV decoupling our library cares about is on VCC.
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [uart]
  yaml_template: |
    sensor:
      - platform: cse7766
        uart_id: {{ bus.id }}
        current:
          name: "{{ label }} Current"
        voltage:
          name: "{{ label }} Voltage"
        power:
          name: "{{ label }} Power"
        energy:
          name: "{{ label }} Energy"
        apparent_power:
          name: "{{ label }} Apparent Power"
        power_factor:
          name: "{{ label }} Power Factor"

# Datasheet frame, 24 bytes at 4800 8E1: header (0x55 normal, 0xFx with
# overflow bits), 0x5A, then voltage, current and power each as a
# 3-byte coefficient and a 3-byte cycle (value = coefficient / cycle),
# the adjust byte flagging which are valid, and a checksum, the low
# byte of the sum of bytes 2-22.
circuitpython:
  setup: |
    def {{ id }}_decode(buf):
        found = None
        for i in range(len(buf) - 23):
            f = buf[i:i + 24]
            if f[1] != 0x5A or sum(f[2:23]) & 0xFF != f[23]:
                continue
            h, adj = f[0], f[20]
            if h != 0x55 and (h & 0xF1) != 0xF0:
                continue
            over = h if h != 0x55 else 0
            word = lambda k: f[k] << 16 | f[k + 1] << 8 | f[k + 2]
            volts = word(2) / word(5) if adj & 0x40 and not over & 0x08 else None
            amps = word(8) / word(11) if adj & 0x20 and not over & 0x04 else 0.0
            watts = word(14) / word(17) if adj & 0x10 and not over & 0x02 else 0.0
            found = (volts, amps, watts)
        return found
    def {{ id }}_listen(seconds):
        {{ bus_var }}.reset_input_buffer()
        buf = b""
        until = time.monotonic() + seconds
        while time.monotonic() < until:
            n = {{ bus_var }}.in_waiting
            if n:
                buf += {{ bus_var }}.read(n)
        return buf
  loop: |
    {{ id }}_reading = {{ id }}_decode({{ id }}_listen(0.5))
    if {{ id }}_reading:
        print("{{ label }}: %s V %.3f A %.1f W" % (("%.1f" % {{ id }}_reading[0]) if {{ id }}_reading[0] else "-", {{ id }}_reading[1], {{ id }}_reading[2]))

micropython:
  setup: |
    def {{ id }}_decode(buf):
        found = None
        for i in range(len(buf) - 23):
            f = buf[i:i + 24]
            if f[1] != 0x5A or sum(f[2:23]) & 0xFF != f[23]:
                continue
            h, adj = f[0], f[20]
            if h != 0x55 and (h & 0xF1) != 0xF0:
                continue
            over = h if h != 0x55 else 0
            word = lambda k: f[k] << 16 | f[k + 1] << 8 | f[k + 2]
            volts = word(2) / word(5) if adj & 0x40 and not over & 0x08 else None
            amps = word(8) / word(11) if adj & 0x20 and not over & 0x04 else 0.0
            watts = word(14) / word(17) if adj & 0x10 and not over & 0x02 else 0.0
            found = (volts, amps, watts)
        return found
    def {{ id }}_listen(seconds):
        {{ bus_var }}.read()
        buf = b""
        until = time.ticks_add(time.ticks_ms(), int(seconds * 1000))
        while time.ticks_diff(until, time.ticks_ms()) > 0:
            buf += {{ bus_var }}.read() or b""
            time.sleep_ms(20)
        return buf
  loop: |
    {{ id }}_reading = {{ id }}_decode({{ id }}_listen(0.5))
    if {{ id }}_reading:
        print("{{ label }}: %s V %.3f A %.1f W" % (("%.1f" % {{ id }}_reading[0]) if {{ id }}_reading[0] else "-", {{ id }}_reading[1], {{ id }}_reading[2]))

lorawan:
  requires: [uart]
  globals: |
    HardwareSerial {{ id }}Serial({{ serial }});
    uint8_t {{ id }}Frame[24];
    uint8_t {{ id }}Len = 0;
    float {{ id }}Volts = 0, {{ id }}Amps = 0, {{ id }}Watts = 0;
  setup: |
    {{ id }}Serial.begin({{ bus.baud if bus and bus.baud else 4800 }}, SERIAL_8E1, {{ bus.rx if bus and bus.rx is not none else -1 }}, {{ bus.tx if bus and bus.tx is not none else -1 }});
  loop: |
    // 24-byte frames at 4800 8E1: header, 0x5A, coefficient/cycle pairs,
    // adjustment byte, sum of bytes 2-22. Each value is coefficient / cycle.
    while ({{ id }}Serial.available()) {
      uint8_t _b = {{ id }}Serial.read();
      if ({{ id }}Len == 24) { memmove({{ id }}Frame, {{ id }}Frame + 1, 23); {{ id }}Len = 23; }
      {{ id }}Frame[{{ id }}Len++] = _b;
      if ({{ id }}Len < 24) continue;
      const uint8_t* _f = {{ id }}Frame;
      if (_f[1] != 0x5A) continue;
      uint8_t _sum = 0;
      for (int _i = 2; _i < 23; _i++) _sum += _f[_i];
      if (_sum != _f[23]) continue;
      uint8_t _h = _f[0], _adj = _f[20];
      if (_h != 0x55 && (_h & 0xF1) != 0xF0) continue;
      uint8_t _over = _h != 0x55 ? _h : 0;
      uint32_t _vc = (uint32_t)_f[2] << 16 | _f[3] << 8 | _f[4], _vt = (uint32_t)_f[5] << 16 | _f[6] << 8 | _f[7];
      uint32_t _ic = (uint32_t)_f[8] << 16 | _f[9] << 8 | _f[10], _it = (uint32_t)_f[11] << 16 | _f[12] << 8 | _f[13];
      uint32_t _pc = (uint32_t)_f[14] << 16 | _f[15] << 8 | _f[16], _pt = (uint32_t)_f[17] << 16 | _f[18] << 8 | _f[19];
      if ((_adj & 0x40) && !(_over & 0x08) && _vt) {{ id }}Volts = (float)_vc / _vt;
      {{ id }}Amps = (_adj & 0x20) && !(_over & 0x04) && _it ? (float)_ic / _it : 0;
      {{ id }}Watts = (_adj & 0x10) && !(_over & 0x02) && _pt ? (float)_pc / _pt : 0;
      {{ id }}Len = 0;
    }
  fields:
    - name: "{{ id }}_voltage"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "(uint16_t)({{ id }}Volts * 10.0 + 0.5)"
      scale: 10.0
      ha_device_class: voltage
      ha_unit: "V"
      ha_state_class: measurement
    - name: "{{ id }}_current"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "(uint16_t)({{ id }}Amps * 1000.0 + 0.5)"
      scale: 1000.0
      ha_device_class: current
      ha_unit: "A"
      ha_state_class: measurement
    - name: "{{ id }}_power"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "(uint16_t)({{ id }}Watts * 10.0 + 0.5)"
      scale: 10.0
      ha_device_class: power
      ha_unit: "W"
      ha_state_class: measurement
params_schema: {}

notes: |
  AC power-metering IC inside Athom / Sonoff smart plugs (v2 / c3 era) and
  the V9821-clone modules. Streams measurements one-way over UART at
  4800 8E1; bind the host UART to those pins + parity. The chip pushes
  values on its own cadence -- there's no `update_interval`, the sub-
  sensors update whenever a fresh frame lands. The chip is on the mains
  side -- *do not poke at the high-voltage pads if the plug is plugged
  in.*
# KiCad symbol mapping. CSE7766 isn't in stock KiCad libs; use a generic
# 4-pin header for the LV side breakout.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: CSE7766
tasmota:
  bus: {rx: CSE7766_RX, tx: CSE7766_TX}
