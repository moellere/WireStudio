id: ads1115_channel
name: ADS1115 channel
category: sensor
use_cases: [adc, analog_in, voltage, current_sense]
aliases: ["ads1115_sensor", "adc channel"]

electrical:
  current_ma_typical: 0
  current_ma_peak: 0
  pins:
    # Logical "connection" to the hub. No physical wire; the connection
    # target rewrites to {kind: component, component_id: <hub>} which
    # the generator surfaces as `parent.id` in the template context.
    - role: HUB
      kind: hub_ref
      parent_library_id: ads1115
  passives: []

esphome:
  required_components: []
  yaml_template: |
    sensor:
      - platform: ads1115
        ads1115_id: {{ parent.id }}_hub
        multiplexer: {{ params.multiplexer | default('A0_GND') }}
        gain: {{ params.gain | default('6.144') }}
        name: "{{ label }}"
        update_interval: {{ params.update_interval | default('60s') }}
    {%- if params.on_value is defined %}
        on_value: {{ params.on_value | tojson }}
    {%- endif %}
    {%- if params.on_value_range is defined %}
        on_value_range: {{ params.on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}
    - {event: on_value_range, kind: event}

# Read through the hub's `_read(positive, negative)`, with this
# channel's full-scale range set on the hub first, since channels on one
# chip may differ.
circuitpython:
  setup: |
    {%- set mux = {"A0_GND": "0, None", "A1_GND": "1, None", "A2_GND": "2, None", "A3_GND": "3, None",
                   "A0_A1": "0, 1", "A0_A3": "0, 3", "A1_A3": "1, 3", "A2_A3": "2, 3"}[params.multiplexer | default("A0_GND")] %}
    {%- set gains = {"6.144": "2 / 3", "4.096": "1", "2.048": "2", "1.024": "4", "0.512": "8", "0.256": "16"} %}
    {{ id }}_gain = {{ gains[params.gain | default("6.144") | string] }}
    def {{ id }}_volts():
        {{ parent }}.gain = {{ id }}_gain
        return {{ parent }}_read({{ mux }})
  loop: |
    print("{{ label }}: %.4f V" % {{ id }}_volts())

micropython:
  setup: |
    {%- set mux = {"A0_GND": "0, None", "A1_GND": "1, None", "A2_GND": "2, None", "A3_GND": "3, None",
                   "A0_A1": "0, 1", "A0_A3": "0, 3", "A1_A3": "1, 3", "A2_A3": "2, 3"}[params.multiplexer | default("A0_GND")] %}
    {%- set gains = {"6.144": 0, "4.096": 1, "2.048": 2, "1.024": 3, "0.512": 4, "0.256": 5} %}
    {{ id }}_gain = {{ gains[params.gain | default("6.144") | string] }}
    def {{ id }}_volts():
        {{ parent }}.gain = {{ id }}_gain
        return {{ parent }}_read({{ mux }})
  loop: |
    print("{{ label }}: %.4f V" % {{ id }}_volts())

params_schema:
  multiplexer:
    type: string
    enum:
      - A0_GND
      - A1_GND
      - A2_GND
      - A3_GND
      - A0_A1
      - A0_A3
      - A1_A3
      - A2_A3
    default: A0_GND
    description: "Single-ended (Ax_GND) or differential (Ax_Ay) channel select"
  gain:
    type: string
    enum: ["6.144", "4.096", "2.048", "1.024", "0.512", "0.256"]
    default: "6.144"
    description: "Full-scale range in volts. Lower = higher resolution but less headroom."
  update_interval:
    type: string
    default: "60s"

notes: |
  One logical reading from an ADS1115 hub. Add an `ads1115` first, then
  add as many `ads1115_channel` instances as you need readings; each
  one's HUB connection auto-binds to the (single) hub in the design.
  Single-ended modes use Ax_GND (Ax referenced to ground); differential
  modes Ax_Ay use the two pins as a differential pair. Gain is the
  full-scale range in volts -- pick the lowest one ≥ your expected
  signal range to maximise resolution.
# KiCad symbol mapping (0.9). Each ADS1115 channel is a logical
# reading on the hub -- there's no separate physical part. We render
# a 1-pin header on the schematic so the channel's HUB connection
# has somewhere to land; KiCad users typically delete these and let
# the hub's input pin label the net by itself.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x01
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x01_P2.54mm_Vertical
  value: ADS1115 channel
