id: axp192
name: X-Powers AXP192 PMIC
category: power
use_cases: [power, battery, pmic]
aliases: [axp]

electrical:
  vcc_min: 3.3
  vcc_max: 3.3
  current_ma_typical: 1
  current_ma_peak: 2
  pins:
    - {role: SDA, kind: i2c_sda}
    - {role: SCL, kind: i2c_scl}

esphome:
  required_components: [i2c]
  yaml_template: "" # Not actively used for ESPHome right now unless there is an AXP192 esphome component.

# Register code, as the lorawan block does with XPowersLib: LDO2 (LoRa)
# and LDO3 (GPS) at 3.3 V on (0x28, 0x12), the battery voltage ADC on
# (0x82), and the battery voltage at 0x78-0x79 in 1.1 mV steps.
circuitpython:
  setup: |
    {{ id }}_addr = 0x34
    def {{ id }}_rd(reg, n):
        buf = bytearray(n)
        while not {{ bus_var }}.try_lock():
            pass
        try:
            {{ bus_var }}.writeto_then_readfrom({{ id }}_addr, bytes([reg]), buf)
        finally:
            {{ bus_var }}.unlock()
        return buf
    def {{ id }}_wr(reg, value):
        while not {{ bus_var }}.try_lock():
            pass
        try:
            {{ bus_var }}.writeto({{ id }}_addr, bytes([reg, value]))
        finally:
            {{ bus_var }}.unlock()
    def {{ id }}_battery_mv(b):
        return (b[0] << 4 | b[1] & 0x0F) * 1.1
    {{ id }}_wr(0x28, 0xFF)
    {{ id }}_wr(0x12, {{ id }}_rd(0x12, 1)[0] | 0x0C)
    {{ id }}_wr(0x82, {{ id }}_rd(0x82, 1)[0] | 0x80)
  loop: |
    print("{{ label }}: battery %.0f mV" % {{ id }}_battery_mv({{ id }}_rd(0x78, 2)))

micropython:
  setup: |
    {{ id }}_addr = 0x34
    def {{ id }}_rd(reg, n):
        return {{ bus_var }}.readfrom_mem({{ id }}_addr, reg, n)
    def {{ id }}_wr(reg, value):
        {{ bus_var }}.writeto_mem({{ id }}_addr, reg, bytes([value]))
    def {{ id }}_battery_mv(b):
        return (b[0] << 4 | b[1] & 0x0F) * 1.1
    {{ id }}_wr(0x28, 0xFF)
    {{ id }}_wr(0x12, {{ id }}_rd(0x12, 1)[0] | 0x0C)
    {{ id }}_wr(0x82, {{ id }}_rd(0x82, 1)[0] | 0x80)
  loop: |
    print("{{ label }}: battery %.0f mV" % {{ id }}_battery_mv({{ id }}_rd(0x78, 2)))

params_schema: {}

notes: "Onboard PMIC used by TTGO T-Beam"

lorawan:
  lib_deps:
    - "lewisxhe/XPowersLib@^0.3.3"
  requires:
    - i2c
  globals: |
    #define XPOWERS_CHIP_AXP192
    #include "XPowersLib.h"
    XPowersPMU power;            // AXP192 PMIC: gates the GPS + LoRa rails, reports battery
    uint16_t batteryMv = 0;
  setup: |
    if (power.begin(Wire, AXP192_SLAVE_ADDRESS, {{ i2c_sda | default(21) }}, {{ i2c_scl | default(22) }})) {
      power.setLDO2Voltage(3300); power.enableLDO2();  // LoRa rail
      power.setLDO3Voltage(3300); power.enableLDO3();  // GPS rail
      power.enableBattDetection();
      power.enableBattVoltageMeasure();
      Serial.println("AXP192: LoRa + GPS rails enabled");
    } else {
      Serial.println("AXP192 init failed (battery/GPS telemetry unavailable)");
    }
  loop: |
    batteryMv = power.getBattVoltage();
  fields:
    - name: batt_mv
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: batteryMv
      ha_device_class: voltage
      ha_unit: V
      ha_state_class: measurement
      ha_diagnostic: true
      ha_divide: 1000

kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x02
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
  value: AXP192
