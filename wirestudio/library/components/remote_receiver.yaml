id: remote_receiver
name: Remote receiver (IR demodulator, or a 433 MHz OOK data line)
category: input
use_cases: [ir, remote_control, media_control, learning_remote, rf_433, rc_switch]
aliases: ["tsop38238", "vs1838b", "tsop4838", "ir-receiver", "rxb6", "srx882", "433mhz receiver", "rf receiver", "ook receiver"]

electrical:
  vcc_min: 2.5
  vcc_max: 5.5
  current_ma_typical: 0.45
  current_ma_peak: 1.5
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: OUT, kind: digital_in, voltage: 3.3, driven: true}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling per datasheet app circuit}
    - {kind: resistor, value: "100R", between: [VCC, VCC], purpose: supply filter (datasheet RC) -- optional on clean rails}

esphome:
  required_components: []
  yaml_template: |
    remote_receiver:
      id: {{ id }}
      pin:
        number: {{ pins.OUT | tojson }}
        inverted: {{ params.inverted | default(true) | tojson }}
        mode:
          input: true
      dump: {{ params.dump | default('all') }}
    {%- for key in ['tolerance', 'filter', 'idle', 'buffer_size', 'rmt_symbols'] %}
    {%- if params[key] is defined %}
      {{ key }}: {{ params[key] }}
    {%- endif %}
    {%- endfor %}
    {%- if params.on_nec is defined %}
      on_nec: {{ params.on_nec | tojson }}
    {%- endif %}
    {%- if params.on_rc_switch is defined %}
      on_rc_switch: {{ params.on_rc_switch | tojson }}
    {%- endif %}

tasmota:
  pins:
    OUT: IRrecv

capability:
  role: input
  provides:
    - {event: on_nec, kind: event}
    - {event: on_rc_switch, kind: event}

circuitpython:
  imports: ["import adafruit_irremote", "import pulseio"]
  deps: [adafruit_irremote]
  setup: |
    {{ id }}_pulses = pulseio.PulseIn(P({{ pins.OUT }}), maxlen=120, idle_state={{ params.inverted | default(true) }})
    {{ id }} = adafruit_irremote.NonblockingGenericDecode({{ id }}_pulses)
  loop: |
    for {{ id }}_msg in {{ id }}.read():
        if isinstance({{ id }}_msg, adafruit_irremote.IRMessage):
            print("{{ label }}:", {{ id }}_msg.code)

# ir_rx times each frame with a software timer, which the ESP32-C3 lacks;
# hardware timer 0 exists on every ESP32, so ESP32 builds use it.
micropython:
  imports: ["from ir_rx.nec import NEC_8"]
  deps: ["github:peterhinch/micropython_ir/ir_rx"]
  setup: |
    def {{ id }}_decoded(command, address, ctrl):
        if command >= 0:
            print("{{ label }}: address 0x%02x command 0x%02x" % (address, command))
    {%- if board.chip_variant != 'esp8266' %}
    NEC_8.Timer_id = 0
    {%- endif %}
    {{ id }} = NEC_8(Pin({{ pins.OUT }}, Pin.IN), {{ id }}_decoded)

params_schema:
  dump:
    type: string
    default: "all"
    description: "Protocols to log for learning codes ('all' while setting up, then narrow or remove)."
  inverted:
    type: boolean
    default: true
    description: "IR demodulators idle high and pull low on carrier -- leave true. A 433 MHz data line
      (an RXB6/SRX882 module, or an SX127x's DIO2 in OOK mode) is active high -- set false."
  on_nec:
    type: object
    description: "NEC automation, e.g. {address: 0x407F, command: 0xC03F, then: [...]}"
  tolerance: {type: string, description: "Timing tolerance, e.g. '25%'. RF remotes want more than IR."}
  filter: {type: string, description: "Drop pulses shorter than this, e.g. '250us' for 433 MHz noise"}
  idle: {type: string, description: "Gap that ends a frame, e.g. '4ms' for RC-switch"}
  buffer_size: {type: string, description: "Receive buffer, e.g. '2kb'"}
  rmt_symbols: {type: integer, description: "ESP32: RMT symbols this receiver reserves. A classic ESP32 has 512 and the default is 192, so a third receiver needs this lower, e.g. 128."}
  on_rc_switch:
    type: object
    description: "RC-switch (433 MHz) automation, e.g. {code: '100010000000000010111110', then: [...]}"

notes: |
  Counterpart to the remote_transmitter entry: a demodulating 38kHz
  receiver module on one GPIO. Start with dump: all, press the remote,
  copy the decoded protocol/address/command from the log into a
  binary_sensor or automation. On ESP32 the RMT peripheral does the
  timing; on ESP8266 pick a pin that tolerates interrupts (avoid
  GPIO16).

  For 433 MHz remotes the same component reads an OOK data line: an
  RXB6/SRX882 module's DATA pin, or the GPIO wired to an SX127x's DIO2
  with the radio in OOK mode. Set inverted: false, dump: rc_switch, and
  tolerance 25%, filter 250us, idle 4ms as a starting point.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x03
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x03_P2.54mm_Vertical
  value: TSOP38238

wled:
  kind: ir
  pins: [OUT]
