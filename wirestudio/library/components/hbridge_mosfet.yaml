id: hbridge_mosfet
name: Discrete MOSFET H-bridge (IRF4905 / IRFZ44N, 5 V)
category: actuator
use_cases: [motor, dc_motor, actuator, linear_actuator, reversible_load]
aliases: [mosfet_bridge, discrete_hbridge, irf4905, irfz44n]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 300
  current_ma_peak: 1000
  # Same two-input interface as `hbridge`, built on the board. Each leg is a
  # P-FET to VM and an N-FET to GND sharing one gate node, which a small NPN
  # pulls low: input high -> leg output at VM, input low -> leg output at GND.
  # No input combination conducts through a leg. VM is tied to the gate
  # pull-ups, so it has to stay near the FETs' gate drive: 5 V.
  pins:
  - {role: IN1, kind: digital_out, voltage: 3.3}
  - {role: IN2, kind: digital_out, voltage: 3.3}
  - {role: VM, kind: power}
  - {role: GND, kind: ground}
  passives: []

esphome:
  required_components: []
  yaml_template: |
    {%- set pwm = params.pwm | default(false) or params.expose | default('none') == 'fan' %}
    {%- if params.expose | default('none') == 'switches' %}
    switch:
      - platform: gpio
        pin: {{ pins.IN1 | tojson }}
        name: "{{ label }} forward"
        id: {{ id }}_in1
        restore_mode: ALWAYS_OFF
        interlock: [{{ id }}_in2]
        interlock_wait_time: {{ params.interlock_wait_time | default('100ms') }}
      - platform: gpio
        pin: {{ pins.IN2 | tojson }}
        name: "{{ label }} reverse"
        id: {{ id }}_in2
        restore_mode: ALWAYS_OFF
        interlock: [{{ id }}_in1]
        interlock_wait_time: {{ params.interlock_wait_time | default('100ms') }}
    {%- else %}
    output:
    {%- for n in ['IN1', 'IN2'] %}
      - platform: {{ ('ledc' if board and board.chip_variant.startswith('esp32') else 'esp8266_pwm') if pwm else 'gpio' }}
        pin: {{ pins[n] | tojson }}
        id: {{ id }}_{{ n | lower }}
    {%- if pwm %}
        frequency: {{ params.frequency | default('200 Hz') }}
    {%- endif %}
    {%- endfor %}
    {%- endif %}
    {%- if params.expose | default('none') == 'fan' %}
    fan:
      - platform: hbridge
        pin_a: {{ id }}_in1
        pin_b: {{ id }}_in2
        name: "{{ label }}"
        id: {{ id }}
        decay_mode: {{ params.decay_mode | default('slow') }}
    {%- endif %}

params_schema:
  load_ma:
    type: number
    default: 1000
  expose:
    type: string
    enum: [none, switches, fan]
    default: none
  pwm:
    type: boolean
    default: false
  frequency:
    type: string
    default: "200 Hz"
  decay_mode:
    type: string
    enum: [slow, fast]
    default: slow
  interlock_wait_time:
    type: string
    default: "100ms"

verify:
  # The gates swing to VM through the 470 ohm pull-ups, so VM is the gate
  # drive; a standard-threshold IRF4905 wants 4.5 V or more of it. Each
  # driver NPN sinks the pull-up current, VM / 470.
  checks:
  - {kind: gate_drive, drive: {pin: VM}, vgs_on_v: 4.5, rds_on_ohm: 0.02, load: load_ma, max_w: 1.0, max_ma: 20000}
  - {kind: base_drive, resistor: r_base_a, drive: {pin: IN1}, vbe_v: 0.7, hfe_min: 30, load: 11, max_ma: 200}
notes: "Sized for a small 5-6 V gearmotor (about 1 A). The shared gate node switches through a 470 ohm
  pull-up, so both FETs of a leg are partly on for a few microseconds per edge: fine for on/off and
  position control, keep PWM at a few hundred Hz. The KiCad symbol library has no IRFZ44N; the low
  side uses the pin-compatible IRLZ44N symbol, which is also the better part (logic-level gate). An
  IRF9540N substitutes for the IRF4905. The FET body diodes carry the flyback current. J1 is the
  motor terminal."
# Header view for generators that place one part per component; the KiCad
# schematic, PCB and BOM emit the subcircuit below instead.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: MOSFET H-bridge
# `requires` is the circuit's need (5 V rail, ~1 A motor, with margin for
# stall and flyback), not the fitted part's rating: a drawer FET rated well
# below an IRF4905 still substitutes if it clears these.
subcircuit:
  parts:
  - id: q_hi_a
    ref_prefix: Q
    kicad: {symbol_lib: Transistor_FET, symbol: IRF4905, footprint: "Package_TO_SOT_THT:TO-220-3_Vertical", value: IRF4905}
    pins: {G: gate_a, D: out_a, S: VM}
    requires: {family: mosfet, polarity: p, v_min: 20, i_min: 3}
  - id: q_lo_a
    ref_prefix: Q
    kicad: {symbol_lib: Transistor_FET, symbol: IRLZ44N, footprint: "Package_TO_SOT_THT:TO-220-3_Vertical", value: IRFZ44N}
    pins: {G: gate_a, D: out_a, S: GND}
    requires: {family: mosfet, polarity: n, v_min: 20, i_min: 3}
  - id: q_drv_a
    ref_prefix: Q
    kicad: {symbol_lib: Transistor_BJT, symbol: 2N3904, footprint: "Package_TO_SOT_THT:TO-92_Inline", value: 2N3904}
    pins: {C: gate_a, B: base_a, E: GND}
    requires: {family: bjt, polarity: npn, v_min: 10, i_min: 0.05}
  - id: r_gate_a
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "470"}
    pins: {"1": VM, "2": gate_a}
  - id: r_base_a
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "1k"}
    pins: {"1": IN1, "2": base_a}
  - id: r_pd_a
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "10k"}
    pins: {"1": IN1, "2": GND}
  - id: q_hi_b
    ref_prefix: Q
    kicad: {symbol_lib: Transistor_FET, symbol: IRF4905, footprint: "Package_TO_SOT_THT:TO-220-3_Vertical", value: IRF4905}
    pins: {G: gate_b, D: out_b, S: VM}
    requires: {family: mosfet, polarity: p, v_min: 20, i_min: 3}
  - id: q_lo_b
    ref_prefix: Q
    kicad: {symbol_lib: Transistor_FET, symbol: IRLZ44N, footprint: "Package_TO_SOT_THT:TO-220-3_Vertical", value: IRFZ44N}
    pins: {G: gate_b, D: out_b, S: GND}
    requires: {family: mosfet, polarity: n, v_min: 20, i_min: 3}
  - id: q_drv_b
    ref_prefix: Q
    kicad: {symbol_lib: Transistor_BJT, symbol: 2N3904, footprint: "Package_TO_SOT_THT:TO-92_Inline", value: 2N3904}
    pins: {C: gate_b, B: base_b, E: GND}
    requires: {family: bjt, polarity: npn, v_min: 10, i_min: 0.05}
  - id: r_gate_b
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "470"}
    pins: {"1": VM, "2": gate_b}
  - id: r_base_b
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "1k"}
    pins: {"1": IN2, "2": base_b}
  - id: r_pd_b
    ref_prefix: R
    kicad: {symbol_lib: Device, symbol: R, footprint: "Resistor_THT:R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal", value: "10k"}
    pins: {"1": IN2, "2": GND}
  - id: c_bulk
    ref_prefix: C
    kicad: {symbol_lib: Device, symbol: C_Polarized, footprint: "Capacitor_THT:CP_Radial_D8.0mm_P3.50mm", value: 470uF}
    pins: {"1": VM, "2": GND}
  - id: c_motor
    ref_prefix: C
    kicad: {symbol_lib: Device, symbol: C, footprint: "Capacitor_THT:C_Disc_D5.0mm_W2.5mm_P5.00mm", value: 100nF}
    pins: {"1": out_a, "2": out_b}
  - id: j_motor
    ref_prefix: J
    kicad: {symbol_lib: Connector_Generic, symbol: Conn_01x02, footprint: "TerminalBlock_Phoenix:TerminalBlock_Phoenix_MKDS-1,5-2_1x02_P5.00mm_Horizontal", value: Motor}
    pins: {"1": out_a, "2": out_b}
  # The drawing: two legs, VM rail across the top, GND rail along the
  # bottom, the motor and its snubber between the outputs, a driver under
  # each leg. Grid units (1.27 mm), x right, y down. The P-FETs are
  # mirrored top-for-bottom so their sources sit on the rail with the
  # gates still facing left.
  schematic:
    parts:
      c_bulk:   {at: [10, 3]}
      r_gate_a: {at: [20, 3]}
      q_hi_a:   {at: [24, 10], mirror: x}
      q_lo_a:   {at: [24, 26]}
      q_drv_a:  {at: [18, 38]}
      r_base_a: {at: [9, 38], rot: 90}
      r_pd_a:   {at: [6, 42]}
      r_gate_b: {at: [56, 3]}
      q_hi_b:   {at: [60, 10], mirror: x}
      q_lo_b:   {at: [60, 26]}
      q_drv_b:  {at: [54, 38]}
      r_base_b: {at: [45, 38], rot: 90}
      r_pd_b:   {at: [42, 42]}
      j_motor:  {at: [46, 10], rot: 90}
      c_motor:  {at: [47, 24], rot: 90}
    wires:
      - [[10, 0], [20, 0], [26, 0], [34, 0], [56, 0], [62, 0]]      # VM rail
      - [[10, 6], [10, 8]]                                          # C1 to its GND
      - [[20, 6], [20, 10], [20, 26], [20, 34]]                     # gate_a
      - [[26, 0], [26, 6]]                                          # VM to Q1 source
      - [[26, 14], [26, 18], [26, 22]]                              # out_a between the FETs
      - [[26, 18], [44, 18], [46, 18], [46, 14]]                    # out_a to the motor
      - [[26, 30], [26, 48]]                                        # Q2 source to GND
      - [[20, 42], [20, 48]]                                        # Q3 emitter to GND
      - [[12, 38], [14, 38]]                                        # R2 to Q3 base
      - [[6, 38], [6, 39]]                                          # IN1 to R3
      - [[6, 45], [6, 48]]                                          # R3 to GND
      - [[6, 48], [20, 48], [26, 48], [34, 48], [42, 48], [56, 48], [62, 48]]   # GND rail
      - [[56, 6], [56, 10], [56, 26], [56, 34]]                     # gate_b
      - [[62, 0], [62, 6]]                                          # VM to Q4 source
      - [[62, 14], [62, 18], [62, 22]]                              # out_b between the FETs
      - [[62, 18], [50, 18], [48, 18], [48, 14]]                    # out_b to the motor
      - [[62, 30], [62, 48]]                                        # Q5 source to GND
      - [[56, 42], [56, 48]]                                        # Q6 emitter to GND
      - [[48, 38], [50, 38]]                                        # R5 to Q6 base
      - [[42, 38], [42, 39]]                                        # IN2 to R6
      - [[42, 45], [42, 48]]                                        # R6 to GND
      - [[44, 24], [44, 18]]                                        # C2 across the outputs
      - [[50, 24], [50, 18]]
    nodes:
      VM:  [{at: [34, 0], kind: power}]
      GND: [{at: [34, 48], kind: power}, {at: [10, 8], kind: power}]
      IN1: [{at: [6, 38], rot: 180}]
      IN2: [{at: [42, 38], rot: 180}]
      out_a: [{at: [40, 18], rot: 270}]
      out_b: [{at: [54, 18], rot: 270}]
