id: hlw8012
name: HLW8012 / BL0937 AC power meter (3-pin pulse output)
category: sensor
use_cases: [power_metering, ac_voltage, ac_current, energy, smart_plug]
aliases: ["bl0937", "athom_v1"]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 5
  current_ma_peak: 15
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    # HLW8012 / BL0937 multiplex voltage + current measurements through
    # two pulse-frequency outputs (CF, CF1) and one selector input (SEL).
    # The MCU drives SEL to switch CF1 between voltage and current modes,
    # and reads pulse rates on CF + CF1 -- no UART, no I2C.
    - {role: SEL, kind: digital_out,  voltage: 3.3}
    - {role: CF,  kind: digital_in, voltage: 3.3, driven: true}
    - {role: CF1, kind: digital_in, voltage: 3.3, driven: true}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: []
  yaml_template: |
    sensor:
      - platform: hlw8012
        sel_pin:
          number: {{ pins.SEL | tojson }}
          inverted: true
        cf_pin: {{ pins.CF | tojson }}
        cf1_pin: {{ pins.CF1 | tojson }}
        update_interval: {{ params.update_interval | default('30s') }}
        model: {{ params.model | default('HLW8012') }}
        current_resistor: {{ params.current_resistor | default('0.001 ohm') | tojson }}
        voltage_divider: {{ params.voltage_divider | default(2351) }}
        current:
          name: "{{ label }} Current"
        voltage:
          name: "{{ label }} Voltage"
        power:
          name: "{{ label }} Power"
        energy:
          name: "{{ label }} Energy"

# Pulse-rate code after ESPHome's hlw8012 component: CF counts power,
# CF1 counts current or voltage as SEL picks (BL0937 inverts SEL), and
# CF1 is only read on the second pass after a switch, once it settles.
# Multipliers from the reference voltage, shunt and divider as ESPHome's.
circuitpython:
  imports: ["import countio", "import digitalio"]
  setup: |
    {{ id }}_cf = countio.Counter(P({{ pins.CF }}), edge=countio.Edge.RISE)
    {{ id }}_cf1 = countio.Counter(P({{ pins.CF1 }}), edge=countio.Edge.RISE)
    {{ id }}_sel = digitalio.DigitalInOut(P({{ pins.SEL }}))
    {{ id }}_sel.switch_to_output()
    def {{ id }}_take():
        counts = {{ id }}_cf.count, {{ id }}_cf1.count
        {{ id }}_cf.reset()
        {{ id }}_cf1.reset()
        return counts
    def {{ id }}_select(current):
        {{ id }}_sel.value = current != {{ id }}_inverted
    {{ id }}_last = [time.monotonic()]
    def {{ id }}_elapsed():
        now = time.monotonic()
        dt, {{ id }}_last[0] = now - {{ id }}_last[0], now
        return dt
    {%- set bl0937 = (params.model | default('HLW8012')) == 'BL0937' %}
    {%- set r = (params.current_resistor | default('0.001 ohm')).split()[0] | float %}
    {%- set div = params.voltage_divider | default(2351) %}
    {%- if bl0937 %}
    {{ id }}_kp = 1.218 * 1.218 * {{ div }} / {{ r }} / 1721506
    {{ id }}_ki = 1.218 / {{ r }} / 94638
    {{ id }}_kv = 1.218 * {{ div }} / 15397
    {%- else %}
    {{ id }}_kp = 2.43 * 2.43 * {{ div }} / {{ r }} * 64 / 24 / 3579000
    {{ id }}_ki = 2.43 / {{ r }} * 512 / 24 / 3579000
    {{ id }}_kv = 2.43 * {{ div }} * 256 / 3579000
    {%- endif %}
    {{ id }}_inverted = {{ bl0937 }}
    {{ id }}_pass = 0
    {{ id }}_select(True)
    {{ id }}_take()
    {{ id }}_elapsed()
  loop: |
    {{ id }}_dt = {{ id }}_elapsed()
    {{ id }}_cf_n, {{ id }}_cf1_n = {{ id }}_take()
    {{ id }}_cf_hz = {{ id }}_cf_n / {{ id }}_dt if {{ id }}_cf_n > 1 else 0
    {{ id }}_cf1_hz = {{ id }}_cf1_n / {{ id }}_dt if {{ id }}_cf1_n > 1 else 0
    {{ id }}_current = {{ id }}_pass // 2 % 2 == 0
    if {{ id }}_pass % 2:
        print("{{ label }}: %.1f W %s" % ({{ id }}_cf_hz * {{ id }}_kp, "%.3f A" % ({{ id }}_cf1_hz * {{ id }}_ki) if {{ id }}_current else "%.1f V" % ({{ id }}_cf1_hz * {{ id }}_kv)))
    {{ id }}_pass += 1
    {{ id }}_select({{ id }}_pass // 2 % 2 == 0)

micropython:
  setup: |
    {{ id }}_counts = [0, 0]
    def {{ id }}_edge(pin):
        {{ id }}_counts[pin is {{ id }}_cf1] += 1
    {{ id }}_cf = Pin({{ pins.CF }}, Pin.IN)
    {{ id }}_cf1 = Pin({{ pins.CF1 }}, Pin.IN)
    {{ id }}_cf.irq(trigger=Pin.IRQ_RISING, handler={{ id }}_edge)
    {{ id }}_cf1.irq(trigger=Pin.IRQ_RISING, handler={{ id }}_edge)
    {{ id }}_sel = Pin({{ pins.SEL }}, Pin.OUT)
    def {{ id }}_take():
        counts = tuple({{ id }}_counts)
        {{ id }}_counts[0] = {{ id }}_counts[1] = 0
        return counts
    def {{ id }}_select(current):
        {{ id }}_sel(int(current != {{ id }}_inverted))
    {{ id }}_last = [time.ticks_ms()]
    def {{ id }}_elapsed():
        now = time.ticks_ms()
        dt, {{ id }}_last[0] = time.ticks_diff(now, {{ id }}_last[0]) / 1000, now
        return dt
    {%- set bl0937 = (params.model | default('HLW8012')) == 'BL0937' %}
    {%- set r = (params.current_resistor | default('0.001 ohm')).split()[0] | float %}
    {%- set div = params.voltage_divider | default(2351) %}
    {%- if bl0937 %}
    {{ id }}_kp = 1.218 * 1.218 * {{ div }} / {{ r }} / 1721506
    {{ id }}_ki = 1.218 / {{ r }} / 94638
    {{ id }}_kv = 1.218 * {{ div }} / 15397
    {%- else %}
    {{ id }}_kp = 2.43 * 2.43 * {{ div }} / {{ r }} * 64 / 24 / 3579000
    {{ id }}_ki = 2.43 / {{ r }} * 512 / 24 / 3579000
    {{ id }}_kv = 2.43 * {{ div }} * 256 / 3579000
    {%- endif %}
    {{ id }}_inverted = {{ bl0937 }}
    {{ id }}_pass = 0
    {{ id }}_select(True)
    {{ id }}_take()
    {{ id }}_elapsed()
  loop: |
    {{ id }}_dt = {{ id }}_elapsed()
    {{ id }}_cf_n, {{ id }}_cf1_n = {{ id }}_take()
    {{ id }}_cf_hz = {{ id }}_cf_n / {{ id }}_dt if {{ id }}_cf_n > 1 else 0
    {{ id }}_cf1_hz = {{ id }}_cf1_n / {{ id }}_dt if {{ id }}_cf1_n > 1 else 0
    {{ id }}_current = {{ id }}_pass // 2 % 2 == 0
    if {{ id }}_pass % 2:
        print("{{ label }}: %.1f W %s" % ({{ id }}_cf_hz * {{ id }}_kp, "%.3f A" % ({{ id }}_cf1_hz * {{ id }}_ki) if {{ id }}_current else "%.1f V" % ({{ id }}_cf1_hz * {{ id }}_kv)))
    {{ id }}_pass += 1
    {{ id }}_select({{ id }}_pass // 2 % 2 == 0)

params_schema:
  update_interval:
    type: string
    default: "30s"
  model:
    type: string
    enum: ["HLW8012", "BL0937", "CSE7759"]
    default: "HLW8012"
    description: "BL0937 is the cost-down clone in older Athom plugs; CSE7759 is the same chip rebadged."
  current_resistor:
    type: string
    default: "0.001 ohm"
    description: "Shunt resistor on the current path. Most plug PCBs use 1 milliohm; check the silkscreen."
  voltage_divider:
    type: number
    default: 2351
    description: "Resistor-divider ratio on the voltage path. 2351 is the Athom/Sonoff stock value; tweak after measuring against a known reference."

notes: |
  AC power-metering IC in older Athom v1 / Sonoff POW R1 / Smartape
  power-strip generations -- predates the cse7766 UART chip. Three GPIOs
  (SEL, CF, CF1) instead of UART. Calibration is per-board: the
  current_resistor + voltage_divider params reflect the Athom/Sonoff
  stock values; cross-check against a known reference if absolute
  accuracy matters. *Do not poke at the high-voltage pads while the plug
  is plugged in.*
# KiCad symbol mapping. HLW8012/BL0937 isn't in stock KiCad libs; use a
# generic 5-pin header for the LV side breakout (VCC, GND, SEL, CF, CF1).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x05
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical
  value: HLW8012
tasmota:
  pins: {SEL: NRG_SEL, CF: HLW_CF, CF1: NRG_CF1}

# xoseperez's HLW8012 library on interrupts. BL0937 (and the CSE7759
# rebadge) read current with SEL low, the HLW8012 with SEL high. ESPHome's
# voltage_divider is the whole ratio; the library wants the two legs.
lorawan:
  lib_deps: ["xoseperez/HLW8012@^1.1.1"]
  globals: |
    #include <HLW8012.h>
    HLW8012 hlw8012;
    void IRAM_ATTR hlw8012CfIsr() { hlw8012.cf_interrupt(); }
    void IRAM_ATTR hlw8012Cf1Isr() { hlw8012.cf1_interrupt(); }
    float hlw8012Voltage = 0, hlw8012Current = 0, hlw8012Power = 0;
    uint32_t hlw8012EnergyWh = 0;
  setup: |
    {%- set model = params.model | default('HLW8012') %}
    hlw8012.begin({{ pins.CF }}, {{ pins.CF1 }}, {{ pins.SEL }}, {{ 'HIGH' if model == 'HLW8012' else 'LOW' }}, true);
    hlw8012.setResistors({{ (params.current_resistor | default('0.001 ohm')) | string | replace('ohm', '') | trim | float }}, ({{ params.voltage_divider | default(2351) }} - 1.0) * 1000.0, 1000.0);
    attachInterrupt(digitalPinToInterrupt({{ pins.CF }}), hlw8012CfIsr, FALLING);
    attachInterrupt(digitalPinToInterrupt({{ pins.CF1 }}), hlw8012Cf1Isr, FALLING);
  loop: |
    {
      static unsigned long _last = 0;
      if (_last == 0 || millis() - _last >= 5000) {
        _last = millis();
        hlw8012Power = hlw8012.getActivePower();
        hlw8012Voltage = hlw8012.getVoltage();
        hlw8012Current = hlw8012.getCurrent();
        hlw8012EnergyWh = (uint32_t)(hlw8012.getEnergy() / 3600.0);
        hlw8012.toggleMode();
      }
    }
  fields:
    - name: hlw8012_voltage
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(hlw8012Voltage * 10.0)
      scale: 10.0
      ha_device_class: voltage
      ha_unit: V
      ha_state_class: measurement
    - name: hlw8012_current
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(hlw8012Current * 1000.0)
      scale: 1000.0
      ha_device_class: current
      ha_unit: A
      ha_state_class: measurement
    - name: hlw8012_power
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(hlw8012Power * 10.0)
      scale: 10.0
      ha_device_class: power
      ha_unit: W
      ha_state_class: measurement
    - name: hlw8012_energy
      bytes: 4
      cpp_type: uint32_t
      cpp_expr: hlw8012EnergyWh
      ha_device_class: energy
      ha_unit: Wh
      ha_state_class: total_increasing
