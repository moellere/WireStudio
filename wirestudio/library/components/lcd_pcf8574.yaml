id: lcd_pcf8574
name: HD44780 character LCD (16x2 / 20x4) via PCF8574 I2C backpack
category: display
use_cases: [text_display, status, dashboard]
aliases: [hd44780, lcd_2004, lcd_1602, lcd_i2c]

electrical:
  vcc_min: 4.5
  vcc_max: 5.5
  current_ma_typical: 25
  current_ma_peak: 60
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - role: SDA
      kind: i2c_sda
      pull_up: {required: true, value: "4.7k", to: VCC}
    - role: SCL
      kind: i2c_scl
      pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  display_dialect: character
  yaml_template: |
    display:
      - platform: lcd_pcf8574
        dimensions: {{ params.dimensions | default('20x4') }}
        address: "{{ params.address | default('0x27') }}"
        i2c_id: {{ bus.id }}
        id: {{ id }}
    {%- if params.update_interval is defined %}
        update_interval: {{ params.update_interval }}
    {%- endif %}
    {%- if params.lambda_ is defined %}
        lambda: {{ params.lambda_ | tojson }}
    {%- endif %}

# HD44780 in 4-bit mode behind the PCF8574, as ESPHome's lcd_pcf8574
# drives it: P4-P7 carry the nibble, P0 is RS, P2 is E (latched on its
# falling edge) and P3 the backlight. Three 0x3 nibbles and a 0x2 enter
# 4-bit mode; rows 2 and 3 of a 20x4 continue rows 0 and 1 in DDRAM.
circuitpython:
  setup: |
    {%- set dims = (params.dimensions | default('20x4')).split('x') %}
    {{ id }}_addr = {{ params.address | default('0x27') }}
    {{ id }}_cols, {{ id }}_rows = {{ dims[0] }}, {{ dims[1] }}
    def {{ id }}_out(b):
        while not {{ bus_var }}.try_lock():
            pass
        try:
            {{ bus_var }}.writeto({{ id }}_addr, bytes([b]))
        finally:
            {{ bus_var }}.unlock()
    def {{ id }}_pulse(b):
        b |= 0x08
        {{ id }}_out(b)
        {{ id }}_out(b | 0x04)
        {{ id }}_out(b)
    def {{ id }}_send(value, rs=0):
        {{ id }}_pulse(value & 0xF0 | rs)
        {{ id }}_pulse(value << 4 & 0xF0 | rs)
    def {{ id }}_show(*lines):
        for row, text in enumerate(lines[:{{ id }}_rows]):
            {{ id }}_send(0x80 | (0x00, 0x40, {{ id }}_cols, 0x40 + {{ id }}_cols)[row])
            data = text.encode()[:{{ id }}_cols]
            for c in data + b" " * ({{ id }}_cols - len(data)):
                {{ id }}_send(c, 1)
    {{ id }}_out(0x08)
    time.sleep(0.05)
    for {{ id }}_n in (0x30, 0x30, 0x30, 0x20):
        {{ id }}_pulse({{ id }}_n)
        time.sleep(0.005)
    for {{ id }}_c in (0x28, 0x0C, 0x01, 0x06, 0x02):
        {{ id }}_send({{ id }}_c)
        time.sleep(0.002)
    {{ id }}_show("{{ label }}")

micropython:
  setup: |
    {%- set dims = (params.dimensions | default('20x4')).split('x') %}
    {{ id }}_addr = {{ params.address | default('0x27') }}
    {{ id }}_cols, {{ id }}_rows = {{ dims[0] }}, {{ dims[1] }}
    def {{ id }}_out(b):
        {{ bus_var }}.writeto({{ id }}_addr, bytes([b]))
    def {{ id }}_pulse(b):
        b |= 0x08
        {{ id }}_out(b)
        {{ id }}_out(b | 0x04)
        {{ id }}_out(b)
    def {{ id }}_send(value, rs=0):
        {{ id }}_pulse(value & 0xF0 | rs)
        {{ id }}_pulse(value << 4 & 0xF0 | rs)
    def {{ id }}_show(*lines):
        for row, text in enumerate(lines[:{{ id }}_rows]):
            {{ id }}_send(0x80 | (0x00, 0x40, {{ id }}_cols, 0x40 + {{ id }}_cols)[row])
            data = text.encode()[:{{ id }}_cols]
            for c in data + b" " * ({{ id }}_cols - len(data)):
                {{ id }}_send(c, 1)
    {{ id }}_out(0x08)
    time.sleep(0.05)
    for {{ id }}_n in (0x30, 0x30, 0x30, 0x20):
        {{ id }}_pulse({{ id }}_n)
        time.sleep(0.005)
    for {{ id }}_c in (0x28, 0x0C, 0x01, 0x06, 0x02):
        {{ id }}_send({{ id }}_c)
        time.sleep(0.002)
    {{ id }}_show("{{ label }}")

params_schema:
  dimensions:
    type: string
    enum: ["16x2", "20x4"]
    default: "20x4"
  address:
    type: string
    enum: ["0x20", "0x21", "0x22", "0x23", "0x24", "0x25", "0x26", "0x27", "0x3F"]
    default: "0x27"
  update_interval:
    type: string
    default: "1s"

notes: "5V LCD running over a 3.3V I2C bus through a level-shifting PCF8574 backpack. Common backpack addresses are 0x27 (most clones) and 0x3F (some Adafruit-style boards); the in-tree corpus also has 0x26 for a custom variant. Backlight control is exposed as `display.{id}.backlight()` / `no_backlight()`."
# KiCad symbol mapping (0.9). Generic 4-pin header (VCC/GND/SDA/SCL)
# matching the I2C backpack on a 16x2 / 20x4 character LCD.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: LCD I2C backpack
