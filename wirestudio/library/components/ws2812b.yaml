id: ws2812b
name: WS2812B addressable LED (NeoPixel)
category: light
use_cases: [indicator, status_led, ambient]
aliases: [ws2811, sk6812, neopixel]

electrical:
  vcc_min: 3.5
  vcc_max: 5.3
  current_ma_typical: 20
  current_ma_peak: 60
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - {role: DIN, kind: digital_out, voltage: 5.0, requires_fast_gpio: true}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: []
  yaml_template: |
    light:
      - platform: neopixelbus
        variant: {{ params.variant | default('WS2812') }}
    {%- if params.method is defined %}
        method: {{ params.method }}
    {%- endif %}
        type: {{ params.type | default('GRB') }}
        pin: {{ pins.DIN | tojson }}
        num_leds: {{ params.num_leds | default(1) }}
        name: "{{ label }}"
        id: {{ id }}
    {%- if params.on_turn_on is defined %}
        on_turn_on: {{ params.on_turn_on | tojson }}
    {%- endif %}
    {%- if params.on_turn_off is defined %}
        on_turn_off: {{ params.on_turn_off | tojson }}
    {%- endif %}

capability:
  # Addressable LED strip / pixel under ESPHome's `light:` platform. Emits
  # on_turn_on / on_turn_off and accepts the standard light action verbs.
  role: output
  provides:
    - {event: on_turn_on}
    - {event: on_turn_off}
  accepts:
    - {action: turn_on,  esphome: light.turn_on}
    - {action: turn_off, esphome: light.turn_off}
    - {action: toggle,   esphome: light.toggle}
  checks:
    - {predicate: is_on,  esphome: light.is_on}
    - {predicate: is_off, esphome: light.is_off}

circuitpython:
  imports: ["import neopixel"]
  deps: [neopixel, adafruit_pixelbuf]
  setup: |
    {{ id }} = neopixel.NeoPixel(P({{ pins.DIN }}), {{ params.num_leds | default(1) }}, auto_write=True)
    {{ id }}.fill((0, 8, 0))

micropython:
  imports: ["import neopixel"]
  setup: |
    {{ id }} = neopixel.NeoPixel(Pin({{ pins.DIN }}), {{ params.num_leds | default(1) }})
    {{ id }}.fill((0, 8, 0))
    {{ id }}.write()

params_schema:
  variant: {type: string, default: "WS2812", enum: ["WS2811", "WS2812", "WS2812X", "400KBPS", "SK6812",
      "TM1814"]}
  # Unset, ESPHome picks the method from the chip and pin: on the ESP8266
  # DMA on GPIO3, UART0 on GPIO1, UART1 on GPIO2, bit-bang elsewhere.
  method: {type: string, enum: ["BIT_BANG", "ESP8266_UART0", "ESP8266_UART1",
      "ESP8266_DMA", "ESP32_RMT", "ESP32_I2S0", "ESP32_I2S1"]}
  type: {type: string, default: "GRB"}
  num_leds: {type: integer, default: 1, minimum: 1}

notes: "Current rises ~60mA per LED at full white. Budget accordingly. Add a 300-500ohm series resistor
  on DIN and a 1000uF cap across VCC/GND for strips >8 LEDs."
# KiCad symbol mapping (0.9 schematic export).
kicad:
  symbol_lib: LED
  symbol: WS2812B
  footprint: LED_SMD:LED_WS2812B_PLCC4_5.0x5.0mm_P3.2mm
  pin_map:
    VCC: VDD
    GND: VSS
tasmota:
  pins: {DIN: WS2812}

wled:
  kind: led
  pins: [DIN]
  type: 22
  chipsets: {WS2811: 22, WS2812: 22, WS2812X: 22, 400KBPS: 24, SK6812: 30, TM1814: 31}
  chipset_param: variant
  order_param: type
