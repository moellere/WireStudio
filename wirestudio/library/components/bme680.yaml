id: bme680
name: Bosch BME680 environmental sensor (temp/humidity/pressure/gas, I2C)
category: sensor
use_cases: [temperature, humidity, pressure, voc, air_quality, indoor_air]
aliases: ["bme688", "gy-bme680"]

electrical:
  vcc_min: 1.71
  vcc_max: 3.6
  current_ma_typical: 12
  current_ma_peak: 18
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: bme680
        i2c_id: {{ bus.id }}
        address: {{ params.address | default('0x76') }}
        temperature:
          id: {{ id }}_temperature
          name: "{{ label }} Temperature"
        pressure:
          id: {{ id }}_pressure
          name: "{{ label }} Pressure"
        humidity:
          id: {{ id }}_humidity
          name: "{{ label }} Humidity"
        gas_resistance:
          id: {{ id }}_gas_resistance
          name: "{{ label }} Gas Resistance"
        update_interval: {{ params.update_interval | default('60s') }}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}

circuitpython:
  imports: ["import adafruit_bme680"]
  deps: [adafruit_bme680, adafruit_bus_device]
  setup: |
    {{ id }} = adafruit_bme680.Adafruit_BME680_I2C({{ bus_var }}, address={{ params.address | default('0x76') }})
  loop: |
    print("{{ label }}: %.1fC %.0f%% %.1fhPa gas=%d" % ({{ id }}.temperature, {{ id }}.humidity, {{ id }}.pressure, {{ id }}.gas))

micropython:
  imports: ["from bme680 import BME680_I2C"]
  deps: ["github:robert-hh/BME680-Micropython/bme680.py"]
  setup: |
    {{ id }} = BME680_I2C({{ bus_var }}, address={{ params.address | default('0x76') }})
  loop: |
    print("{{ label }}: %.1fC %.0f%% %.1fhPa gas=%d" % ({{ id }}.temperature, {{ id }}.humidity, {{ id }}.pressure, {{ id }}.gas))

params_schema:
  address:
    type: string
    enum: ["0x76", "0x77"]
    default: "0x76"
    description: "SDO low = 0x76, high = 0x77. Adafruit boards default to 0x77."
  update_interval:
    type: string
    default: "60s"

notes: |
  The four-in-one climate sensor. gas_resistance is a raw MOX reading
  (ohms) -- turning it into an IAQ score needs Bosch's closed-source
  BSEC library (ESPHome's separate bme68x_bsec2 platform). The heater
  also warms the die slightly; expect temperature ~1C high unless you
  calibrate it out with a filter.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x06
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x06_P2.54mm_Vertical
  value: BME680

lorawan:
  lib_deps: ["adafruit/Adafruit BME680 Library@^2.0.4"]
  requires: [i2c]
  globals: |
    #include <Adafruit_BME680.h>
    Adafruit_BME680 bme680(&Wire);
    bool bme680Ok = false;
    float bme680TempC = 0, bme680Hum = 0, bme680HPa = 0, bme680GasKOhm = 0;
  setup: |
    bme680Ok = bme680.begin({{ params.address | default('0x76') }});
    if (bme680Ok) bme680.setGasHeater(320, 150);
  loop: |
    if (bme680Ok && bme680.performReading()) {
      bme680TempC = bme680.temperature;
      bme680Hum = bme680.humidity;
      bme680HPa = bme680.pressure / 100.0F;
      bme680GasKOhm = bme680.gas_resistance / 1000.0F;
    }
  fields:
    - name: bme680_temp_c
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(bme680TempC * 100.0)
      signed: true
      scale: 100.0
      ha_device_class: temperature
      ha_unit: "°C"
      ha_state_class: measurement
    - name: bme680_humidity
      bytes: 1
      cpp_type: uint8_t
      cpp_expr: (uint8_t)(bme680Hum + 0.5)
      ha_device_class: humidity
      ha_unit: "%"
      ha_state_class: measurement
    - name: bme680_pressure
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(bme680HPa * 10.0)
      scale: 10.0
      ha_device_class: atmospheric_pressure
      ha_unit: hPa
      ha_state_class: measurement
    - name: bme680_gas_kohm
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: (uint16_t)(min(bme680GasKOhm, 6553.5f) * 10.0)
      scale: 10.0
      ha_unit: "kΩ"
      ha_icon: mdi:air-filter
      ha_state_class: measurement

wled:
  kind: usermod
  usermod: BME68X_v2
  define: USERMOD_BME68X
  lib_deps: ["boschsensortec/BSEC Software Library @ ^1.8.1492"]
  um_name: BME680X
  um: {Enabled: true}
  um_params: {i2C Address: address}
