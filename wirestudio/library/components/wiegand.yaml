id: wiegand
name: Wiegand keypad / card reader interface (D0/D1)
category: input
use_cases: [access_control, rfid, keypad, door_entry]
aliases: ["wiegand26", "wiegand34", "access-keypad"]

electrical:
  vcc_min: 5.0
  vcc_max: 12.0
  current_ma_typical: 60
  current_ma_peak: 120
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - {role: D0, kind: digital_in, voltage: 5.0, driven: true}
    - {role: D1, kind: digital_in, voltage: 5.0, driven: true}
  passives: []

esphome:
  required_components: []
  yaml_template: |
    wiegand:
      - id: {{ id }}
        d0: {{ pins.D0 | tojson }}
        d1: {{ pins.D1 | tojson }}
    {%- if params.on_tag is defined %}
        on_tag: {{ params.on_tag | tojson }}
    {%- endif %}
    {%- if params.on_key is defined %}
        on_key: {{ params.on_key | tojson }}
    {%- endif %}

capability:
  role: input
  provides:
    - {event: on_tag, kind: event}
    - {event: on_key, kind: event}

tasmota:
  pins:
    D0: Wiegand_D0
    D1: Wiegand_D1

# Wiegand: D0 and D1 idle high and pulse low for a 0 or a 1, so the frame
# is the order of falling edges across both lines; a 25 ms gap ends it.
# 26, 34 and 37 bits carry a tag between an even and an odd parity bit
# (37's parity halves overlap by a bit), 4 and 8 bits a key (the 8-bit
# form carries it inverted in the high nibble), as ESPHome's wiegand
# component reads them. CircuitPython has no pin interrupts.
micropython:
  imports: ["from machine import disable_irq, enable_irq"]
  setup: |
    {{ id }}_bits = []
    {{ id }}_frames = []
    {{ id }}_last = [time.ticks_ms()]
    def {{ id }}_edge(pin):
        now = time.ticks_ms()
        if {{ id }}_bits and time.ticks_diff(now, {{ id }}_last[0]) > 25:
            {{ id }}_frames.append({{ id }}_bits[:])
            del {{ id }}_bits[:]
        {{ id }}_bits.append(0 if pin is {{ id }}_d0 else 1)
        {{ id }}_last[0] = now
    {{ id }}_d0 = Pin({{ pins.D0 }}, Pin.IN, Pin.PULL_UP)
    {{ id }}_d1 = Pin({{ pins.D1 }}, Pin.IN, Pin.PULL_UP)
    {{ id }}_d0.irq(trigger=Pin.IRQ_FALLING, handler={{ id }}_edge)
    {{ id }}_d1.irq(trigger=Pin.IRQ_FALLING, handler={{ id }}_edge)
    def {{ id }}_decode(bits):
        v = 0
        for b in bits:
            v = v << 1 | b
        n = len(bits)
        halves = {26: (13, 13), 34: (17, 17), 37: (19, 18)}.get(n)
        if halves and sum(bits[:halves[0]]) % 2 == 0 and sum(bits[halves[1]:]) % 2 == 1:
            return "tag", v >> 1 & (1 << n - 2) - 1
        if n == 4 and v < 12:
            return "key", "0123456789*#"[v]
        if n == 8 and v >> 4 == ~v & 0xF and v & 0xF < 12:
            return "key", "0123456789*#"[v & 0xF]
        return None
  loop: |
    {{ id }}_irq = disable_irq()
    if {{ id }}_bits and time.ticks_diff(time.ticks_ms(), {{ id }}_last[0]) > 25:
        {{ id }}_frames.append({{ id }}_bits[:])
        del {{ id }}_bits[:]
    {{ id }}_ready = {{ id }}_frames[:]
    del {{ id }}_frames[:]
    enable_irq({{ id }}_irq)
    for {{ id }}_frame in {{ id }}_ready:
        {{ id }}_read = {{ id }}_decode({{ id }}_frame)
        print("{{ label }}: %s" % ("%s %s" % {{ id }}_read if {{ id }}_read else "%d bits, not a tag or key" % len({{ id }}_frame)))

params_schema:
  on_tag:
    type: array
    description: "Actions on card/fob scan; `x` is the tag id string."
  on_key:
    type: array
    description: "Actions on keypad digit; `x` is the key (0-9, * = 10, # = 11)."

notes: |
  The wall-reader standard: two open-collector lines pulsing bits.
  Most readers run 5-12V and idle D0/D1 at their supply voltage --
  check the reader's spec: many pull to 5V, which ESP32 pins are not
  rated for. Safest wiring is a small level shifter or two resistor
  dividers on D0/D1; some readers are fine idling at 3.3V with the
  MCU's internal pull-ups. Keep the run under ~10m.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: Wiegand reader
