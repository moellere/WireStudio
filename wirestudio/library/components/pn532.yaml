id: pn532
name: NXP PN532 NFC/RFID reader (13.56MHz, I2C)
category: input
use_cases: [rfid, nfc, access_control, tag_reader]
aliases: ["pn532-nfc", "elechouse-pn532", "grove-nfc"]

electrical:
  vcc_min: 3.3
  vcc_max: 5.5
  current_ma_typical: 60
  current_ma_peak: 150
  pins:
  - {role: VCC, kind: power}
  - {role: GND, kind: ground}
  - role: SDA
    kind: i2c_sda
    pull_up: {required: true, value: "4.7k", to: VCC}
  - role: SCL
    kind: i2c_scl
    pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
  - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    pn532_i2c:
      id: {{ id }}
      i2c_id: {{ bus.id }}
      update_interval: {{ params.update_interval | default('1s') }}
    {%- if params.on_tag is defined %}
      on_tag: {{ params.on_tag | tojson }}
    {%- endif %}
    {%- if params.uid is defined %}
    binary_sensor:
      - platform: pn532
        pn532_id: {{ id }}
        uid: {{ params.uid | tojson }}
        name: "{{ label }} Known Tag"
    {%- endif %}

capability:
  role: input
  provides:
    - {event: on_tag, kind: event}

circuitpython:
  imports: ["from adafruit_pn532.i2c import PN532_I2C"]
  deps: [adafruit_pn532, adafruit_bus_device]
  setup: |
    {{ id }} = PN532_I2C({{ bus_var }})
    {{ id }}.SAM_configuration()
  loop: |
    {{ id }}_uid = {{ id }}.read_passive_target(timeout=0.5)
    if {{ id }}_uid is not None:
        print("{{ label }}: tag", "-".join("%02x" % b for b in {{ id }}_uid))

# Frames as ESPHome's pn532 and pn532_i2c build and check them: 00 00 FF,
# LEN, LCS, D4 + command + data, DCS, 00. Every I2C read starts with a
# status byte (01 when ready). A command is acknowledged with
# 00 00 FF 00 FF 00; the response's length is read from its header, a
# NACK asks for it again, and the whole frame is read and checked. An
# InListPassiveTarget that finds nothing in 100 ms is aborted with an ACK.
micropython:
  setup: |
    {{ id }}_addr = 0x24
    def {{ id }}_frame(data):
        body = bytes([0xD4]) + bytes(data)
        return bytes([0x00, 0x00, 0xFF, len(body), -len(body) & 0xFF]) + body + bytes([-sum(body) & 0xFF, 0x00])
    def {{ id }}_ready(ms):
        until = time.ticks_add(time.ticks_ms(), ms)
        while {{ bus_var }}.readfrom({{ id }}_addr, 1)[0] != 0x01:
            if time.ticks_diff(until, time.ticks_ms()) <= 0:
                return False
            time.sleep_ms(1)
        return True
    def {{ id }}_read(n):
        return {{ bus_var }}.readfrom({{ id }}_addr, n + 1)[1:]
    def {{ id }}_parse(cmd, raw):
        if len(raw) < 9 or raw[:3] != b"\x00\x00\xff" or (raw[3] + raw[4]) & 0xFF or raw[5] != 0xD5 or raw[6] != cmd + 1:
            return None
        n = raw[3]
        if len(raw) < n + 7 or (sum(raw[5:5 + n]) + raw[5 + n]) & 0xFF or raw[6 + n] != 0x00:
            return None
        return raw[7:5 + n]
    def {{ id }}_command(cmd, params=(), wait_ms=100):
        {{ bus_var }}.writeto({{ id }}_addr, {{ id }}_frame((cmd,) + params))
        if not {{ id }}_ready(100) or {{ id }}_read(6) != b"\x00\x00\xff\x00\xff\x00":
            return None
        if not {{ id }}_ready(wait_ms):
            {{ bus_var }}.writeto({{ id }}_addr, b"\x00\x00\xff\x00\xff\x00")
            return None
        head = {{ id }}_read(6)
        if head[:3] != b"\x00\x00\xff" or (head[3] + head[4]) & 0xFF:
            return None
        {{ bus_var }}.writeto({{ id }}_addr, b"\x00\x00\xff\xff\x00\x00")
        if not {{ id }}_ready(100):
            return None
        return {{ id }}_parse(cmd, {{ id }}_read(head[3] + 7))
    def {{ id }}_read_uid():
        found = {{ id }}_command(0x4A, (0x01, 0x00))
        {{ id }}_command(0x32, (0x01, 0x00))
        if not found or found[0] != 1 or len(found) < 6 + found[5]:
            return None
        return bytes(found[6:6 + found[5]])
    {{ id }}_version = {{ id }}_command(0x02)
    {{ id }}_command(0x14, (0x01, 0x14, 0x01))
    {{ id }}_command(0x32, (0x01, 0x00))
    {{ id }}_last = None
  loop: |
    {{ id }}_uid = {{ id }}_read_uid()
    if {{ id }}_uid != {{ id }}_last:
        if {{ id }}_uid:
            print("{{ label }}: tag", "-".join("%02x" % b for b in {{ id }}_uid))
        else:
            print("{{ label }}: tag removed")
        {{ id }}_last = {{ id }}_uid

params_schema:
  update_interval:
    type: string
    default: "1s"
    description: "Tag poll interval; 100ms-500ms for snappy access control."
  uid:
    type: string
    description: "Match a specific tag as a binary_sensor, e.g. '74-10-37-94'."
  on_tag:
    type: array
    description: "Actions on any tag; `x` is the UID string. Pair with homeassistant.tag_scanned for HA's tag registry."

notes: |
  Reads 13.56MHz MIFARE/NTAG (the card/fob/phone-tag family) -- a
  different band from the 125kHz RDM6300/EM4100 fobs. The common red
  Elechouse module: set its DIP switches to I2C mode (1=on 2=off).
  Antenna is on-board; keep it clear of ground planes and metal
  standoffs. SPI variant exists (pn532_spi) if the bus is busy.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x04
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
  value: PN532

# An event part: the payload carries the last tag seen, how many have been
# seen since boot and how long ago the last one was (65535 = none yet). A
# tag held on the reader counts once; the first four UID bytes are the id.
lorawan:
  lib_deps: ["adafruit/Adafruit PN532@^1.3.3"]
  requires: [i2c]
  globals: |
    #include <Adafruit_PN532.h>
    Adafruit_PN532 {{ id }}Nfc(-1, -1, &Wire);
    bool {{ id }}Ok = false, {{ id }}Present = false;
    uint32_t {{ id }}Last = 0;
    uint16_t {{ id }}Count = 0;
    unsigned long {{ id }}At = 0;
  setup: |
    {{ id }}Ok = {{ id }}Nfc.begin() && {{ id }}Nfc.getFirmwareVersion() != 0;
    if ({{ id }}Ok) {{ id }}Nfc.SAMConfig();
  loop: |
    if ({{ id }}Ok) {
      uint8_t _uid[7] = {0}, _len = 0;
      if ({{ id }}Nfc.readPassiveTargetID(PN532_MIFARE_ISO14443A, _uid, &_len, 50)) {
        uint32_t _id = 0;
        for (uint8_t i = 0; i < _len && i < 4; i++) _id = _id << 8 | _uid[i];
        if (!{{ id }}Present || _id != {{ id }}Last) {
          {{ id }}Last = _id;
          {{ id }}Count++;
          {{ id }}At = millis();
        }
        {{ id }}Present = true;
      } else {
        {{ id }}Present = false;
      }
    }
  fields:
    - name: "{{ id }}_last"
      bytes: 4
      cpp_type: uint32_t
      cpp_expr: "{{ id }}Last"
      ha_icon: mdi:nfc
    - name: "{{ id }}_count"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: "{{ id }}Count"
      ha_state_class: total_increasing
      ha_icon: mdi:counter
    - name: "{{ id }}_last_age_min"
      bytes: 2
      cpp_type: uint16_t
      cpp_expr: >-
        (uint16_t)({{ id }}Count
          ? (((millis() - {{ id }}At) / 60000UL) > 65534UL ? 65534UL : ((millis() - {{ id }}At) / 60000UL))
          : 65535UL)
      ha_unit: min
      ha_state_class: measurement
      ha_icon: mdi:clock-outline
