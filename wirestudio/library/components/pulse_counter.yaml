id: pulse_counter
name: Pulse counter / tachometer (RPM, flow, energy)
category: sensor
use_cases: [tachometer, rpm, flow_meter, kwh_meter, frequency]
aliases: [tach, frequency_counter]

electrical:
  vcc_min: 0.0
  vcc_max: 0.0
  current_ma_typical: 0
  current_ma_peak: 0
  # The component itself is just a pin reader; the upstream sensor
  # (4-pin PWM fan tach, hall flow meter, etc.) supplies its own
  # electrical metadata if you model it separately.
  pins:
    - role: PULSE
      kind: digital_in
      voltage: 3.3
      requires_interrupt: true
      pull_up: {required: false, value: "10k", to: VCC}
  passives: []

esphome:
  required_components: []
  yaml_template: |
    sensor:
      - platform: pulse_counter
        pin:
          number: {{ pins.PULSE | tojson }}
    {%- if params.input_mode is defined %}
          mode: {{ params.input_mode }}
    {%- endif %}
        name: "{{ label }}"
        id: {{ id }}
    {%- if params.unit_of_measurement is defined %}
        unit_of_measurement: "{{ params.unit_of_measurement }}"
    {%- endif %}
    {%- if params.update_interval is defined %}
        update_interval: {{ params.update_interval }}
    {%- endif %}
    {%- if params.count_mode is defined %}
        count_mode: {{ params.count_mode | tojson }}
    {%- endif %}
    {%- if params.filters is defined %}
        filters: {{ params.filters | tojson }}
    {%- endif %}
    {%- if params.on_value is defined %}
        on_value: {{ params.on_value | tojson }}
    {%- endif %}
    {%- if params.on_value_range is defined %}
        on_value_range: {{ params.on_value_range | tojson }}
    {%- endif %}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}
    - {event: on_value_range, kind: event}

circuitpython:
  imports: ["import countio", "import digitalio"]
  setup: |
    {{ id }} = countio.Counter(P({{ pins.PULSE }}), edge=countio.Edge.RISE, pull={{ {'INPUT_PULLUP': 'digitalio.Pull.UP', 'INPUT_PULLDOWN': 'digitalio.Pull.DOWN'}.get(params.input_mode | default('INPUT_PULLUP'), 'None') }})
    {{ id }}_t0 = time.monotonic()
  loop: |
    {{ id }}_now = time.monotonic()
    print("{{ label }}: %.1f pulses/min" % ({{ id }}.count * 60 / ({{ id }}_now - {{ id }}_t0)))
    {{ id }}.reset()
    {{ id }}_t0 = {{ id }}_now

micropython:
  setup: |
    {{ id }}_count = 0
    def {{ id }}_edge(pin):
        global {{ id }}_count
        {{ id }}_count += 1
    {{ id }} = Pin({{ pins.PULSE }}, Pin.IN{{ {'INPUT_PULLUP': ', Pin.PULL_UP', 'INPUT_PULLDOWN': ', Pin.PULL_DOWN'}.get(params.input_mode | default('INPUT_PULLUP'), '') }})
    {{ id }}.irq(trigger=Pin.IRQ_RISING, handler={{ id }}_edge)
    {{ id }}_t0 = time.ticks_ms()
  loop: |
    {{ id }}_now = time.ticks_ms()
    print("{{ label }}: %.1f pulses/min" % ({{ id }}_count * 60000 / time.ticks_diff({{ id }}_now, {{ id }}_t0)))
    {{ id }}_count = 0
    {{ id }}_t0 = {{ id }}_now

params_schema:
  input_mode:
    type: string
    enum: [INPUT, INPUT_PULLUP, INPUT_PULLDOWN]
    default: INPUT_PULLUP
  unit_of_measurement:
    type: string
  update_interval:
    type: string
    default: "60s"
  count_mode:
    type: object
    description: "{ rising_edge: INCREMENT|DECREMENT|DISABLE, falling_edge: ... }"
  filters:
    type: array
    description: "Standard ESPHome sensor filters; commonly `multiply: 0.5` for 2-pulse-per-rev fan tachs."

notes: "On ESP8266 the pulse counter is software-driven and tops out around ~10kHz. ESP32 uses the dedicated PCNT peripheral and is good for several hundred kHz. For 4-pin PWM fan tachs, two pulses are produced per revolution -- divide by 2 with a `multiply: 0.5` filter to read RPM."
# KiCad symbol mapping (0.9). 2-pin header captures the pulse source
# (water meter reed switch, anemometer, encoder, etc.).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x02
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
  value: Pulse source
tasmota:
  pins: {PULSE: Counter}

# A running total on rising edges (count_mode is not applied), so a missed
# uplink loses nothing; the rate is the difference between uplinks.
lorawan:
  globals: |
    volatile uint32_t {{ id }}Pulses = 0;
    void IRAM_ATTR {{ id }}Isr() { {{ id }}Pulses++; }
  setup: |
    pinMode({{ pins.PULSE }}, {{ params.input_mode | default('INPUT_PULLUP') }});
    attachInterrupt(digitalPinToInterrupt({{ pins.PULSE }}), {{ id }}Isr, RISING);
  fields:
    - name: "{{ id }}_pulses"
      bytes: 4
      cpp_type: uint32_t
      cpp_expr: "{{ id }}Pulses"
      ha_state_class: total_increasing
      ha_icon: mdi:counter
