id: st7789
name: Sitronix ST7789V color TFT (SPI)
category: display
use_cases: [tft, color_display, dashboard]
aliases: [st7789v, st7789vw]

electrical:
  vcc_min: 3.0
  vcc_max: 3.6
  current_ma_typical: 25
  current_ma_peak: 90
  pins:
    - {role: VCC,       kind: power}
    - {role: GND,       kind: ground}
    - {role: SCK,       kind: spi_clk}
    - {role: MOSI,      kind: spi_mosi}
    - {role: CS,        kind: spi_cs,     voltage: 3.3}
    - {role: DC,        kind: digital_out, voltage: 3.3}
    - {role: RESET,     kind: digital_out, voltage: 3.3}
    - {role: BACKLIGHT, kind: digital_out, voltage: 3.3}
    # MISO is unused: ST7789 SPI is write-only.
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}
    - {kind: capacitor, value: "10uF",  between: [VCC, GND], purpose: bulk decoupling}

esphome:
  required_components: [spi]
  display_dialect: pixel
  yaml_template: |
    display:
      - platform: st7789v
        spi_id: {{ bus.id }}
        cs_pin: {{ pins.CS | tojson }}
        dc_pin: {{ pins.DC | tojson }}
        reset_pin: {{ pins.RESET | tojson }}
        backlight_pin: {{ pins.BACKLIGHT | tojson }}
        id: {{ id }}
        model: "{{ params.model | default('Custom') }}"
        width: {{ params.width | default(240) }}
        height: {{ params.height | default(320) }}
    {%- if params.offset_width is defined %}
        offset_width: {{ params.offset_width }}
    {%- endif %}
    {%- if params.offset_height is defined %}
        offset_height: {{ params.offset_height }}
    {%- endif %}
    {%- if params.rotation is defined %}
        rotation: {{ params.rotation }}
    {%- endif %}
    {%- if params.update_interval is defined %}
        update_interval: {{ params.update_interval }}
    {%- endif %}
    {%- if params.lambda_ is defined %}
        lambda: {{ params.lambda_ | tojson }}
    {%- endif %}

# Panel geometry per module from Adafruit's ST7789 examples.
circuitpython:
  imports: ["import displayio", "import fourwire", "import terminalio", "import adafruit_st7789", "from adafruit_display_text import label as display_label"]
  deps: [adafruit_st7789, adafruit_display_text]
  setup: |
    {%- set geometry = {
        'TTGO_TDISPLAY_135X240': 'width=240, height=135, rowstart=40, colstart=53, rotation=270',
        'ADAFRUIT_S2_TFT_FEATHER_135X240': 'width=240, height=135, rowstart=40, colstart=53, rotation=270',
        'ADAFRUIT_FUNHOUSE_240X240': 'width=240, height=240, rowstart=80, rotation=180',
        'ADAFRUIT_RR_280X240': 'width=280, height=240, rowstart=20, rotation=90',
    } %}
    {%- set model = params.model | default('Custom') %}
    {{ id }}_bus = fourwire.FourWire({{ bus_var }}, command=P({{ pins.DC }}), chip_select=P({{ pins.CS }}){% if pins.RESET is defined %}, reset=P({{ pins.RESET }}){% endif %})
    {{ id }} = adafruit_st7789.ST7789({{ id }}_bus, {{ geometry[model] if model in geometry else 'width=%d, height=%d, rotation=%d' % (params.width | default(240), params.height | default(320), params.rotation | default(0)) }}{% if pins.BACKLIGHT is defined %}, backlight_pin=P({{ pins.BACKLIGHT }}){% endif %})
    {{ id }}.root_group = displayio.Group()
    {{ id }}.root_group.append(display_label.Label(terminalio.FONT, text="{{ label }}", x=8, y=8))

# st7789py knows four panel sizes and their offsets; a size outside them
# would raise on the board, so the fragment refuses it.
micropython:
  imports: ["import st7789py", "import vga1_8x8"]
  deps: ["github:russhughes/st7789py_mpy/lib/st7789py.py", "github:russhughes/st7789py_mpy/romfonts/vga1_8x8.py"]
  setup: |
    {%- set sizes = {
        'TTGO_TDISPLAY_135X240': (135, 240, 1),
        'ADAFRUIT_S2_TFT_FEATHER_135X240': (135, 240, 1),
        'ADAFRUIT_FUNHOUSE_240X240': (240, 240, 0),
        'ADAFRUIT_RR_280X240': (240, 280, 1),
    } %}
    {%- set model = params.model | default('Custom') %}
    {%- set size = sizes[model] if model in sizes else (params.width | default(240), params.height | default(320), (params.rotation | default(0)) // 90) %}
    {%- if (size[0], size[1]) not in [(240, 320), (240, 240), (135, 240), (128, 128)] %}
    {{ unsupported("st7789py has no %dx%d panel" % (size[0], size[1])) }}
    {%- endif %}
    {{ id }} = st7789py.ST7789({{ bus_var }}, {{ size[0] }}, {{ size[1] }}, dc=Pin({{ pins.DC }}, Pin.OUT), cs=Pin({{ pins.CS }}, Pin.OUT){% if pins.RESET is defined %}, reset=Pin({{ pins.RESET }}, Pin.OUT){% endif %}{% if pins.BACKLIGHT is defined %}, backlight=Pin({{ pins.BACKLIGHT }}, Pin.OUT){% endif %}, rotation={{ size[2] }})
    {{ id }}.fill(st7789py.BLACK)
    {{ id }}.text(vga1_8x8, "{{ label }}", 8, 8)

params_schema:
  model:
    type: string
    enum: ["TTGO_TDISPLAY_135X240", "ADAFRUIT_FUNHOUSE_240X240", "ADAFRUIT_RR_280X240", "ADAFRUIT_S2_TFT_FEATHER_135X240", "Custom"]
    default: "Custom"
  width:    { type: integer, default: 240 }
  height:   { type: integer, default: 320 }
  rotation: { type: integer, enum: [0, 90, 180, 270], default: 0 }
  update_interval: { type: string, default: "5s" }

notes: "Bare ST7789 panels often need precise model dimensions and offsets; if you don't know them, start with model: Custom and tune width/height/offset_*."
# KiCad symbol mapping (0.9 schematic export). Generic display header
# fallback -- ST7789V breakouts vary in pin count.
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x08
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x08_P2.54mm_Vertical
  value: ST7789V
