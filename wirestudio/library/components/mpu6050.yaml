id: mpu6050
name: MPU6050 6-axis IMU (accel + gyro, I2C)
category: sensor
use_cases: [imu, accelerometer, gyroscope, motion, orientation, vibration]
aliases: ["mpu-6050", "gy-521", "invensense imu"]

electrical:
  vcc_min: 2.375
  vcc_max: 3.46
  current_ma_typical: 4
  current_ma_peak: 6
  pins:
    - {role: VCC, kind: power}
    - {role: GND, kind: ground}
    - role: SDA
      kind: i2c_sda
      pull_up: {required: true, value: "4.7k", to: VCC}
    - role: SCL
      kind: i2c_scl
      pull_up: {required: true, value: "4.7k", to: VCC}
  passives:
    - {kind: capacitor, value: "100nF", between: [VCC, GND], purpose: decoupling}

esphome:
  required_components: [i2c]
  yaml_template: |
    sensor:
      - platform: mpu6050
        address: "{{ params.address | default('0x68') }}"
        i2c_id: {{ bus.id }}
        update_interval: {{ params.update_interval | default('60s') }}
        accel_x:
          name: "{{ label }} Accel X"
        accel_y:
          name: "{{ label }} Accel Y"
        accel_z:
          name: "{{ label }} Accel Z"
        gyro_x:
          name: "{{ label }} Gyro X"
        gyro_y:
          name: "{{ label }} Gyro Y"
        gyro_z:
          name: "{{ label }} Gyro Z"
        temperature:
          name: "{{ label }} Die Temp"

circuitpython:
  imports: ["import adafruit_mpu6050"]
  deps: [adafruit_mpu6050, adafruit_bus_device, adafruit_register]
  setup: |
    {{ id }} = adafruit_mpu6050.MPU6050({{ bus_var }})
  loop: |
    print("{{ label }}: accel %s gyro %s" % ({{ id }}.acceleration, {{ id }}.gyro))

micropython:
  imports: ["from imu import MPU6050"]
  deps: ["github:micropython-IMU/micropython-mpu9x50/imu.py", "github:micropython-IMU/micropython-mpu9x50/vector3d.py"]
  setup: |
    {{ id }} = MPU6050({{ bus_var }}, device_addr={{ 1 if (params.address | default('0x68')) == '0x69' else 0 }})
  loop: |
    print("{{ label }}: accel %s gyro %s" % ({{ id }}.accel.xyz, {{ id }}.gyro.xyz))

params_schema:
  address:
    type: string
    enum: ["0x68", "0x69"]
    default: "0x68"
    description: "AD0 pin: GND=0x68, VCC=0x69"
  update_interval:
    type: string
    default: "60s"
    description: "How often to publish a fresh reading. The chip itself samples at its configured ODR regardless."

notes: |
  6-axis IMU (3-axis accelerometer + 3-axis gyroscope) plus an on-die
  temperature sensor. 3.3V part -- common breakout boards (GY-521) ship
  with an onboard regulator and accept 5V on the VCC pin, but the bare
  chip needs 3.3V. AD0 selects 0x68 (default, AD0 to GND) or 0x69
  (AD0 to VCC). The INT pin is supported by ESPHome but not modeled
  here -- wire it to a free GPIO and attach a binary_sensor in
  esphome_extras if you need motion-wake.
# KiCad symbol mapping (0.9 schematic export). The bare-chip pinout;
# breakout boards (GY-521) wire the 8 pins directly to a 0.1" header.
kicad:
  symbol_lib: Sensor_Motion
  symbol: MPU-6050
  footprint: Sensor_Motion:InvenSense_QFN-24_4x4mm_P0.5mm
  pin_map:
    VCC: VDD

lorawan:
  lib_deps: ["adafruit/Adafruit MPU6050@^2.2.6"]
  requires: [i2c]
  globals: |
    #include <Adafruit_MPU6050.h>
    Adafruit_MPU6050 mpu6050;
    bool mpu6050Ok = false;
    float mpu6050Ax = 0, mpu6050Ay = 0, mpu6050Az = 0;
  setup: |
    mpu6050Ok = mpu6050.begin({{ params.address | default('0x68') }}, &Wire);
  loop: |
    if (mpu6050Ok) {
      sensors_event_t _a, _g, _t;
      mpu6050.getEvent(&_a, &_g, &_t);
      mpu6050Ax = _a.acceleration.x;
      mpu6050Ay = _a.acceleration.y;
      mpu6050Az = _a.acceleration.z;
    }
  fields:
    - name: mpu6050_accel_x
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6050Ax * 100.0)
      signed: true
      scale: 100.0
      ha_unit: "m/s²"
      ha_state_class: measurement
      ha_icon: mdi:axis-arrow
    - name: mpu6050_accel_y
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6050Ay * 100.0)
      signed: true
      scale: 100.0
      ha_unit: "m/s²"
      ha_state_class: measurement
      ha_icon: mdi:axis-arrow
    - name: mpu6050_accel_z
      bytes: 2
      cpp_type: int16_t
      cpp_expr: (int16_t)(mpu6050Az * 100.0)
      signed: true
      scale: 100.0
      ha_unit: "m/s²"
      ha_state_class: measurement
      ha_icon: mdi:axis-arrow

# v0.15.2's usermod declares its sample counter as `uint32`, an ESP8266 SDK
# typedef, so the ESP32 build gets the standard name for it.
wled:
  kind: usermod
  usermod: mpu6050_imu
  define: USERMOD_MPU6050_IMU
  build_flags: ["-D uint32=uint32_t"]
  lib_deps: ["electroniccats/MPU6050@1.0.1", "bolderflight/Bolder Flight Systems Eigen@^3.0.0"]
  um_name: MPU6050_IMU
  um: {enabled: true}
