id: ct_clamp
name: Current transformer clamp (SCT-013 class, analog)
category: sensor
use_cases: [ac_current, power_metering, mains_monitoring, sub_metering]
aliases: ["sct-013", "sct013", "current-clamp"]

electrical:
  current_ma_typical: 0
  current_ma_peak: 0
  pins:
    - {role: OUT, kind: adc}
  passives:
    - {kind: resistor, value: "33R", between: [OUT, GND], purpose: burden (SCT-013-000 current-output type only)}
    - {kind: resistor, value: "10k", between: [OUT, VCC], purpose: bias divider to mid-rail}
    - {kind: resistor, value: "10k", between: [OUT, GND], purpose: bias divider to mid-rail}
    - {kind: capacitor, value: "10uF", between: [OUT, GND], purpose: bias rail smoothing}

esphome:
  required_components: []
  yaml_template: |
    sensor:
      - platform: adc
        id: {{ id }}_adc
        pin: {{ pins.OUT | tojson }}
        attenuation: 12db
        internal: true
      - platform: ct_clamp
        sensor: {{ id }}_adc
        name: "{{ label }} Current"
        sample_duration: {{ params.sample_duration | default('200ms') }}
        update_interval: {{ params.update_interval | default('60s') }}
        filters:
          - calibrate_linear:
              - 0.0 -> 0.0
              - {{ params.calibration_point | default('0.0125 -> 1.25') }}

capability:
  role: sensor
  provides:
    - {event: on_value, kind: value}

tasmota:
  pins:
    OUT: ADC_CT_POWER

# As ESPHome's ct_clamp: sample the ADC for the sample duration, take the
# RMS around the samples' mean (the bias point), and scale volts to amps
# by the calibration point.
circuitpython:
  imports: ["import analogio"]
  setup: |
    {{ id }}_adc = analogio.AnalogIn(P({{ pins.OUT }}))
    def {{ id }}_sample(seconds):
        out = []
        until = time.monotonic() + seconds
        while time.monotonic() < until:
            out.append({{ id }}_adc.value * {{ id }}_adc.reference_voltage / 65535)
        return out
    {%- set point = (params.calibration_point | default('0.0125 -> 1.25')).split('->') %}
    {%- set d = (params.sample_duration | default('200ms')) | string | trim %}
    {{ id }}_amps_per_volt = {{ point[1] | trim | float }} / {{ point[0] | trim | float }}
    {{ id }}_window = {{ (d[:-2] | float / 1000) if d.endswith('ms') else (d | replace('s', '') | float) }}
    def {{ id }}_rms(samples):
        if not samples:
            return 0.0
        mean = sum(samples) / len(samples)
        return (sum((s - mean) ** 2 for s in samples) / len(samples)) ** 0.5
  loop: |
    print("{{ label }}: %.2f A" % ({{ id }}_rms({{ id }}_sample({{ id }}_window)) * {{ id }}_amps_per_volt))

micropython:
  imports: ["from machine import ADC"]
  setup: |
    {{ id }}_adc = ADC(Pin({{ pins.OUT }}), atten=ADC.ATTN_11DB)
    def {{ id }}_sample(seconds):
        out = []
        until = time.ticks_add(time.ticks_ms(), int(seconds * 1000))
        while time.ticks_diff(until, time.ticks_ms()) > 0:
            out.append({{ id }}_adc.read_uv() / 1000000)
        return out
    {%- set point = (params.calibration_point | default('0.0125 -> 1.25')).split('->') %}
    {%- set d = (params.sample_duration | default('200ms')) | string | trim %}
    {{ id }}_amps_per_volt = {{ point[1] | trim | float }} / {{ point[0] | trim | float }}
    {{ id }}_window = {{ (d[:-2] | float / 1000) if d.endswith('ms') else (d | replace('s', '') | float) }}
    def {{ id }}_rms(samples):
        if not samples:
            return 0.0
        mean = sum(samples) / len(samples)
        return (sum((s - mean) ** 2 for s in samples) / len(samples)) ** 0.5
  loop: |
    print("{{ label }}: %.2f A" % ({{ id }}_rms({{ id }}_sample({{ id }}_window)) * {{ id }}_amps_per_volt))

params_schema:
  sample_duration:
    type: string
    default: "200ms"
    description: "Integrate over >= several mains cycles (200ms = 10-12 cycles)."
  update_interval:
    type: string
    default: "60s"
  calibration_point:
    type: string
    default: "0.0125 -> 1.25"
    description: "measured_raw -> amps, from a known load (e.g. a heater through a kill-a-watt)."

notes: |
  Non-invasive AC current sensing: clamp around ONE conductor (live or
  neutral, not the whole cord). The SCT-013-000 is a current-output CT
  and needs the burden resistor; -030 (1V/30A) variants have it
  built in. Bias the signal to mid-rail with the divider so the ADC
  sees the full sine. Reports RMS current only -- multiply by an
  assumed voltage for apparent power, or use a PZEM-004T where real
  power matters. ESP32 ADC only (ESP8266 A0 works at reduced range).
kicad:
  symbol_lib: Connector_Generic
  symbol: Conn_01x02
  footprint: Connector_PinHeader_2.54mm:PinHeader_1x02_P2.54mm_Vertical
  value: SCT-013
