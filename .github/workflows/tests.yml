name: tests

# The unit, golden and client tests every README row that cites
# `tests/...` stands on. The other gates each run one upstream tool
# against the studio's output; this one runs the suite itself, on
# every PR, so a row that says "tests in tests/test_x.py" is a claim
# CI makes and not only a file in the tree.
#
# KiCad, OpenSCAD and the bench are not installed here: the tests that
# need them skip, and their own gates (kicad-*, enclosure-render, the
# nightly hardware gate) cover that ground.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install studio with every pip-installable extra
        run: pip install -e '.[dev,lorawan,pcb]'

      - name: pytest
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Theme matches design/tokens.json
        run: node scripts/theme.mjs --check

      - name: Typecheck
        run: npx tsc -b

      - name: vitest
        run: npx vitest run

  ui-themes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the web bundle
        working-directory: web
        run: npm ci && npm run build

      - name: Install studio and Chromium
        run: |
          pip install -e . playwright
          python -m playwright install --with-deps chromium

      - name: Workbench renders in both themes with the design tokens
        run: python scripts/check_ui_themes.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore
