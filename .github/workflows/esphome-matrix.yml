name: esphome-matrix

# Compatibility sweep across ESPHome releases, and the support table.
#
# The `esphome-config` gate validates every example against ONE pinned
# ESPHome (the merge bar). This workflow runs the same validation across
# a matrix of releases -- the pin, the stables since, and the releases
# below it the table still claims -- and charges each failure to the
# library components ESPHome's error names, so the result reads as
# "`max98357a` needs 2026.6+" rather than as a list of examples.
#
# It is a *report*, not a gate: a release that rejects our YAML must
# not fail the run (the pin is enforced per PR by esphome-config.yml).
# Each leg uploads its verdicts as `esphome-support-<version>`; the
# `table` job merges them into the support table and writes it to the
# job summary and the `esphome-support` artifact. To refresh the
# committed table, drop the sweep's JSON files into
# scripts/esphome_support/ and run `python scripts/esphome_support.py`;
# tests/test_esphome_support.py holds docs/esphome-support.md to them.
#
# When a newer release is clean across the board, that's the signal to
# bump the pin (CONTRIBUTING.md "Bumping the pinned ESPHome"). When it
# is red, the table names the component.
#
# Runs on a schedule + manual dispatch only.

on:
  schedule:
    - cron: '0 9 * * 1'   # 09:00 UTC Monday (ahead of the per-PR gates)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Informational: a release that rejects our YAML must not fail the run.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # The releases the committed table covers: the pin
        # (esphome-config.yml), the stables since, and the floor the
        # table claims. Add a release here when it lands; the leg's
        # JSON joins the table on the next refresh.
        esphome_version: ["2026.3.3", "2026.4.5", "2026.5.3", "2026.6.5", "2026.7.4", "2026.8.2", "2026.9.1"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install studio + ESPHome ${{ matrix.esphome_version }}
        run: |
          pip install -e .
          pip install "esphome==${{ matrix.esphome_version }}"

      - name: Validate every example through `esphome config`
        id: gate
        continue-on-error: true
        run: python scripts/check_examples.py --json "esphome-support-${{ matrix.esphome_version }}.json"

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esphome-support-${{ matrix.esphome_version }}
          path: esphome-support-${{ matrix.esphome_version }}.json
          if-no-files-found: ignore

      - name: Report result
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            echo "### ESPHome ${{ matrix.esphome_version }}: all examples validate" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ESPHome ${{ matrix.esphome_version }}: some examples failed; the table job names the components" >> "$GITHUB_STEP_SUMMARY"
          fi

  table:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install studio
        run: pip install -e .

      - uses: actions/download-artifact@v8
        with:
          pattern: esphome-support-*
          path: sweep
          merge-multiple: true

      - name: Build the support table
        run: |
          ls sweep
          python scripts/esphome_support.py sweep/*.json --out esphome-support.md --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the table
        uses: actions/upload-artifact@v7
        with:
          name: esphome-support
          path: esphome-support.md
