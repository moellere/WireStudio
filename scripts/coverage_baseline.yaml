# Library components and boards that have no bundled example yet.
#
# `python scripts/coverage_matrix.py --strict` enforces this list in CI:
#   - if a library entry has no example AND is not listed here, the
#     check fails -- a new library entry must ship with an example OR be
#     deliberately added here (with a follow-up plan).
#   - if a baseline entry now has an example, the check also fails --
#     a closed gap means this file must shrink. That keeps the list
#     accurate as coverage grows.
#
# When you close a gap, remove the id from the matching section. When
# you add a new library entry without an example, add its id here.

# axp192 is the TTGO T-Beam's onboard PMIC: it has no standalone ESPHome
# platform (its `esphome.yaml_template` is empty) and is never user-added --
# the LoRaWAN firmware generator materializes it implicitly from the board's
# `onboard_peripherals`. So no example references it by id; this is a
# permanent, deliberate baseline entry, not a coverage gap to close.
# battery_adc is the same case: the divider is a board property (Heltec V2
# GPIO37/3.2, TTGO LoRa32 GPIO35/2.0) that the LoRaWAN generator materializes
# from `onboard_peripherals`, so no example names it by id either. Its ESPHome
# template is empty -- battery sense on the ESPHome path is the `adc` platform.
# The connector sizes share one code path (passthrough pins, positional
# pads, a footprint per `family`); `actuator-harness` exercises it through
# connector_1x08 and connector_1x04, `usbc-led-strip` through connector_1x03.
# The rest differ only in pin count. An example that needs one closes its
# entry here.
components:
  - axp192
  - battery_adc
  - connector_1x02
  - connector_1x05
  - connector_1x06
  - connector_1x07
  - connector_2x05_idc
boards: []
