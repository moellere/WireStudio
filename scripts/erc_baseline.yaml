# ERC violation types the written schematic cannot avoid, each with the
# reason. scripts/check_erc.py fails on any type not listed here and on
# a listed type no example raises any more, so this file says exactly
# what KiCad still objects to and why.
allowed:
  lib_symbol_issues: >-
    kicad-cli runs in CI without a symbol library table, so every symbol,
    whose definition is embedded in the file, reports its source library
    as not configured. A sym-lib-table pointing at KICAD8_SYMBOL_DIR
    would retire this entry.
  pin_not_driven: >-
    Inputs that reach their source through a generic header (a sensor
    KiCad has no symbol for, whose pins are passive rather than outputs)
    or sit on a board drawn as a header: nothing on the sheet is typed as
    their driver.
  global_label_dangling: >-
    Boards drawn as a generic header have no kicad.pin_map yet, so the
    peripheral end of each GPIO net carries a label with no partner on
    the board. Adding the board's pin map retires it for that board.
  pin_to_pin: >-
    SPI peripherals' SDO pins are outputs sharing the MISO line (the
    spi-io-node example's MCP23S17 and MCP3008); they tri-state when
    deselected, which ERC's pin types cannot express.
