tasmota:
  # actuator
  hbridge: "deferred: needs a two-relay or two-PWM template rule; Tasmota has no H-bridge function"
  hbridge_mosfet: "deferred: needs the same template rule as hbridge"
  uln2003: "no driver upstream: Tasmota drives steppers through the A4988 driver only"
  # binary_sensor
  ld2420: "no driver upstream: Tasmota has an LD2410 driver, not an LD2420 one"
  # bus
  level_shifter: "no meaning on this framework: passive hardware, no code on any framework"
  modbus: "no meaning on this framework: Tasmota's meter drivers own their serial pins, so the hub's UART is mapped through the meter on it"
  # connector
  connector_1x02: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x03: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x04: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x05: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x06: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x07: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x08: "no meaning on this framework: passive hardware, no code on any framework"
  connector_2x05_idc: "no meaning on this framework: passive hardware, no code on any framework"
  # display
  ili9xxx: "deferred: Universal Display needs a display.ini descriptor beside the template; the CS and DC functions alone do not start it"
  nextion: "no driver upstream: Tasmota drives a Nextion from a Berry script; no template function names it"
  st7789: "deferred: Universal Display needs a display.ini descriptor beside the template; the CS and DC functions alone do not start it"
  # light
  apa102: "no driver upstream: Tasmota's addressable-LED driver is WS281x only"
  # power
  battery_adc: "no meaning on this framework: the LoRaWAN target synthesizes it; elsewhere the board's divider is seeded as an adc part, which maps to ADC Input"
  usb_c_power_in: "no meaning on this framework: passive hardware, no code on any framework"
  # radio
  rf_bridge: "deferred: the EFM8 bridge is Tasmota's Sonoff Bridge module (BASE 25), not a GPIO function; needs the template's BASE set from the design"
  # sensor
  ads1115_channel: "no meaning on this framework: the hub is the template entry; a channel has no GPIO"
  bl0906: "deferred: needs the BL09xx energy-meter function ids"
  mcp3008: "no driver upstream: Tasmota has no MCP3008 driver"
  mcp3008_channel: "no meaning on this framework: the hub is the template entry; a channel has no GPIO"
  tuya_sensor: "no meaning on this framework: TuyaMCU datapoints are mapped by the TuyaMCU console command at runtime, which a template cannot carry"
  # switch
  tuya_switch: "no meaning on this framework: TuyaMCU datapoints are mapped by the TuyaMCU console command at runtime, which a template cannot carry"

