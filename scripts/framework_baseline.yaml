# Why a component has no block on a framework. Every component a
# framework's generator cannot use needs an entry here, and
# `python scripts/coverage_matrix.py --strict` holds the file to the
# library: an unexplained gap, an entry whose component gained a block,
# or a reason outside the three kinds fails the gate.
#
#   deferred: <what is still to write>   the framework could carry it
#   no driver upstream: <why>            the framework's own library has nothing to wrap
#   no meaning on this framework: <why>  the part has no code on that framework
#
# Write the block, delete the entry. docs/library-coverage.md lists
# these under "Framework gaps".

circuitpython:
  # bus
  level_shifter: "no meaning on this framework: passive hardware, no code on any framework"
  # connector
  connector_1x02: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x03: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x04: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x05: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x06: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x07: "no meaning on this framework: passive hardware, no code on any framework"
  connector_1x08: "no meaning on this framework: passive hardware, no code on any framework"
  connector_2x05_idc: "no meaning on this framework: passive hardware, no code on any framework"
  # input
  wiegand: "no driver upstream: CircuitPython has no pin interrupts, and a Wiegand frame is the order of edges across D0 and D1"
  # power
  battery_adc: "no meaning on this framework: the LoRaWAN target synthesizes it; elsewhere the board's divider is seeded as an adc part, whose multiply filter this framework's block applies"
  usb_c_power_in: "no meaning on this framework: passive hardware, no code on any framework"
  # radio
  cc1101: "no driver upstream: the Adafruit bundle has no CC1101 library"

